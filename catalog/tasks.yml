---
# Explicit catalog of Semaphore task templates. No implicit deletion/update.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Обновить каталог задач Semaphore из Ansible-HOME (без запуска остальных задач)
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-site-credentials.yml
    description: "Ввод и обновление паролей и токенов; проверка доступа к PVE, GitHub и Cloudflare"
    survey_vars:
      - {name: DH_INPUT_PVE_ROOT_PASSWORD, title: "Proxmox — пароль root@pam (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_MEDIA_ROOT_PASSWORD, title: "Медиасервер — пароль Linux root / PBS root@pam (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_POSTGRES_PASSWORD, title: "PostgreSQL HOME — пароль пользователя postgres (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_RECORDER_SSH_PASSWORD, title: "DH Recorder — SSH пароль dh_recorder (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_UPTIME_ADMIN_USERNAME, title: "Uptime Kuma — логин администратора (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_UPTIME_ADMIN_PASSWORD, title: "Uptime Kuma — пароль администратора (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_UPTIME_TELEGRAM_BOT_TOKEN, title: "Uptime Kuma — Telegram Bot Token (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_UPTIME_TELEGRAM_CHAT_ID, title: "Uptime Kuma — Telegram Chat ID (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_GITHUB_PROVISION_TOKEN, title: "GitHub — токен доступа (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare — API-токен (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_TAILSCALE_AUTH_KEY, title: "Tailscale — ключ регистрации PBS (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_BROKER_HOST, title: "MQTT — IP или имя брокера (пусто — оставить прежний)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_USERNAME, title: "MQTT — имя пользователя (пусто — оставить прежнее)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_MQTT_PASSWORD, title: "MQTT — пароль (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PBS_ADMIN_PASSWORD, title: "PBS — пароль admin@pbs (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_PBS_PUSH_AUTH_ID, title: "CORE PBS — Push Token Auth ID (из CORE №50)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_PBS_PUSH_TOKEN_SECRET, title: "CORE PBS — Push Token Secret (из CORE №50)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_PBS_FINGERPRINT, title: "CORE PBS — SHA256 TLS fingerprint (из CORE)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_PBS_RESTORE_AUTH_ID, title: "CORE PBS — Restore Token Auth ID (из CORE №50)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_PBS_RESTORE_TOKEN_SECRET, title: "CORE PBS — Restore Token Secret (из CORE №50)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_KEY_ID, title: "Backblaze B2 — Key ID (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_B2_APPLICATION_KEY, title: "Backblaze B2 — Application Key (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_COMMUNITY, title: "ИБП SNMP v2c — community (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_USERNAME, title: "ИБП SNMP v3 — имя пользователя (пусто — оставить прежнее)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_AUTH_PASSWORD, title: "ИБП SNMP v3 — пароль аутентификации (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_PVE_SNMP_PRIV_PASSWORD, title: "ИБП SNMP v3 — пароль шифрования (пусто — оставить прежний)", type: secret, target: env, required: false, values: []}
  - name: "08-DEV Semaphore"
    previous_name: "08-Настроить доступ DEV к Semaphore"
    playbook: playbooks/configure-dev-semaphore.yml
    description: "Подключение DEV к Semaphore; проверка или перевыпуск API-токена"
    survey_vars:
      - name: DH_DEV_API_TOKEN_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Использовать текущий токен", value: keep}
          - {name: "Перевыпустить токен", value: rotate}
          - {name: "Проверить SSH", value: probe}
  - name: "10-HOME PVE"
    previous_name: "10-Настроить PVE"
    playbook: playbooks/setup-pve.yml
    description: "Proxmox VE: пакеты, Bonjour, ИБП и File Browser Quantum"
    survey_vars:
      - name: DH_PVE_MODE
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Настроить", value: apply}
      - name: DH_PVE_REPO_MODE
        title: "Репозитории PVE"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Сохранить", value: keep}
          - {name: "No-subscription (PVE 8)", value: nosub}
      - name: DH_PVE_UPGRADE
        title: "Пакеты PVE"
        type: enum
        target: ""
        required: true
        default_value: "no"
        values:
          - {name: "Без обновления", value: "no"}
          - {name: "Обновить", value: "yes"}
      - name: DH_PVE_QUANTUM_UPDATE
        title: "Версия Quantum"
        type: enum
        target: ""
        required: true
        default_value: "no"
        values:
          - {name: "Сохранить", value: "no"}
          - {name: "Обновить", value: "yes"}
      - name: DH_PVE_NETWORK_ACTION
        title: "IP PVE"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Сохранить", value: keep}
          - {name: "Сменить IP", value: migrate}
      - {name: DH_PVE_NEW_IP, title: "Новый IP PVE (только при выборе смены адреса)", type: "", target: "", required: false, values: []}
      - name: DH_PVE_QUANTUM
        title: "File Browser Quantum"
        type: enum
        target: ""
        required: true
        default_value: install
        values:
          - {name: "Установить / проверить", value: install}
          - {name: "Не менять", value: skip}
      - name: DH_PVE_UPS_MODE
        title: "ИБП"
        type: enum
        target: ""
        required: true
        default_value: none
        values:
          - {name: "Не менять", value: none}
          - {name: "USB", value: usb}
          - {name: "SNMP v2c", value: snmp_v2c}
          - {name: "SNMP v3", value: snmp_v3}
      - {name: DH_PVE_UPS_IP, title: "IP сетевого ИБП (только для SNMP)", type: "", target: "", required: false, values: []}
      - name: DH_PVE_UPS_DRIVER
        title: "Драйвер NUT"
        type: enum
        target: ""
        required: true
        default_value: auto
        values:
          - {name: "Авто", value: auto}
          - {name: "usbhid-ups", value: usbhid-ups}
          - {name: "nutdrv_qx", value: nutdrv_qx}
          - {name: "blazer_usb", value: blazer_usb}
          - {name: "bcmxcp_usb", value: bcmxcp_usb}
          - {name: "tripplite_usb", value: tripplite_usb}
          - {name: "snmp-ups", value: snmp-ups}
  - name: "70-Cloudflare"
    playbook: playbooks/cloudflare-home.yml
    description: "Единый Cloudflare Tunnel HOME: публичные маршруты и private route PBS /32"
    survey_vars:
      - name: DH_CF70_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Перенести Tunnel на PVE", value: migrate}
          - {name: "Опубликовать Semaphore", value: publish_semaphore}
          - {name: "Опубликовать Webmin", value: publish_webmin}
          - {name: "Опубликовать PBS (private)", value: publish_pbs_private}
          - {name: "Обновить cloudflared", value: update_cloudflared}
          - {name: "Включить автообновление", value: configure_cloudflared_auto}
          - {name: "Проверить HAOS mTLS", value: audit_ha_mtls}
          - {name: "Опубликовать HAOS mTLS", value: publish_ha_mtls}
  - name: "30-Медиасервер"
    playbook: playbooks/media-server-deploy.yml
    description: "Медиасервер HOME: настройка VM и дисков; пересоздание удаляет системный диск VM, Erase стирает управляемый SATA-диск"
    survey_vars:
      - name: DH_MEDIA_MODE
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Настроить", value: apply}
      - name: DH_MEDIA_VM_ACTION
        title: "Виртуальная машина"
        type: enum
        target: ""
        required: true
        default_value: keep
        values:
          - {name: "Сохранить VM", value: keep}
          - {name: "Создать отсутствующую VM", value: create}
          - {name: "Удалить и пересоздать VM", value: recreate}
      - name: DH_MEDIA_DISK_ACTION
        title: "Диски данных"
        type: enum
        target: ""
        required: true
        default_value: import
        values:
          - {name: "Import", value: import}
          - {name: "Erase", value: erase}
      - {name: DH_MEDIA_IP, title: "IP медиасервера HOME (стандарт 192.168.11.223)", type: "", target: "", required: true, default_value: "223", values: []}
      - {name: DH_MEDIA_VM_CPU_PERCENT, title: "Лимит CPU всей VM, % (пусто — настройки сайта)", type: "", target: "", required: false, values: []}
      - {name: DH_MEDIA_TRANSCODE_CPU_PERCENT, title: "Общий лимит CPU Plex + Jellyfin, % (пусто — настройки сайта)", type: "", target: "", required: false, values: []}
  - name: "31-Пароль медиасервера"
    previous_name: "31-Сменить общий пароль медиасервера"
    playbook: playbooks/media-password-rotate.yml
    description: "Верификация либо защищённая native-ротация пароля SMB и медиаприложений; пароль не передаётся в Semaphore"
    survey_vars:
      - name: DH_MEDIA_ROTATION_MODE
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: preflight
        values:
          - {name: "Проверить доступ", value: preflight}
          - {name: "Сменить пароль", value: apply}
  - name: "33-HOME PBS + Restic"
    previous_name: "33-rclone Web GUI"
    playbook: playbooks/media-rclone-gui.yml
    description: "rclone/Restic, PBS 4.2+, локальный datastore/PVE Storage, ежедневный backup, retention 30d, prune/GC/verify и токен клиента; без VM/дисков"
  - name: "34-HOME PBS → CORE"
    previous_name: "34-HOME PBS для CORE"
    playbook: playbooks/media34-core-pbs.yml
    description: "Push HOME → CORE, расписание и проверка восстановления из HOME/CORE. Тестовый Restore удаляет только временный CT. Backup jobs не меняются"
    survey_vars:
      - name: DH_PBS_CORE_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить соединение", value: audit}
          - {name: "Настроить Push", value: prepare}
          - {name: "Запустить Push", value: push}
          - {name: "Подключить CORE для Restore", value: restore-storage}
          - {name: "Проверить Restore из CORE", value: restore-check}
          - {name: "Тестовый Restore из CORE", value: restore-test}
          - {name: "Проверить локальные копии", value: local-check}
          - {name: "Тестовый Restore из HOME", value: local-test}
          - {name: "Включить расписание Push", value: schedule}
          - {name: "Отключить расписание Push", value: unschedule}
      - {name: DH_PBS_CORE_SCHEDULE, title: "Время ежедневного Push на PBS (HH:MM, по умолчанию 05:00)", type: "", target: "", required: false, default_value: "05:00", values: []}
  - name: "60-DigitalHouses Agents"
    playbook: playbooks/digitalhouses-agents.yml
    description: "PVE Agent и Plex Agent: установка, настройка и обновление без операций с VM и ZFS"
    survey_vars:
      - name: DH_AGENTS_MODE
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Установить и настроить", value: apply}
      - name: DH_AGENTS_UPDATE
        title: "Версии агентов"
        type: enum
        target: ""
        required: true
        default_value: "no"
        values:
          - {name: "Сохранить", value: "no"}
          - {name: "Обновить", value: "yes"}

  - name: "71-Tailscale"
    playbook: playbooks/home-tailscale.yml
    description: "Tailscale на HOME PVE и PBS: установка, подключение, настройка и обновление"
    survey_vars:
      - name: DH_HOME71_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Установить", value: install}
          - {name: "Настроить DNS и маршруты", value: configure}
          - {name: "Подключить", value: join}
          - {name: "Обновить", value: update}
      - name: DH_HOME71_TARGET
        title: "Сервер"
        type: enum
        target: ""
        required: true
        default_value: both
        values:
          - {name: "PVE", value: pve}
          - {name: "PBS", value: pbs}
          - {name: "PVE и PBS", value: both}

  - name: "35-PostgreSQL HOME"
    playbook: playbooks/home-postgresql.yml
    description: "CT1224: Debian 13, PostgreSQL 17, homeassistant UTF8, postgres и SSH dh_recorder из №05; создать если отсутствует, сохранить данные"
  - name: "36-Uptime Kuma HOME"
    playbook: playbooks/home-uptime.yml
    description: "CT1237: Uptime Kuma; создаёт отсутствующий LXC, сохраняет существующие мониторы и настройки"

  - name: "37-HAOS PostgreSQL Recorder"
    playbook: playbooks/home-haos-recorder.yml
    description: "HAOS VM2222: подключить Recorder к PostgreSQL CT1224, сохранить параметры и SQLite; проверка states, настройка установленного DH Recorder App"
    survey_vars: []
