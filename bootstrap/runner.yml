---
# Run inside a freshly created Debian 13 LXC, as root.
- name: Install and initialize Ansible-HOMES Runner with Semaphore
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    semaphore_version: 2.20.16-beta9
    semaphore_deb_sha256: 7e26db3b09b8e9fe5d8bd5c3956f3640dfc748b290f0b0b282746ba2633bf03a
    semaphore_deb: "/root/semaphore_{{ semaphore_version }}_linux_amd64.deb"
    semaphore_api: http://127.0.0.1/api
    code_repo_url: https://github.com/DigitalHouses/Ansible-HOMES.git
  tasks:
    - name: Validate new Runner identity
      ansible.builtin.assert:
        that:
          - site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - site_profile | default('home') == 'home'
          - site_id != 'dh-core'
          - runner_hostname is match('^[a-z0-9][a-z0-9-]+$')
          - runner_ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
          - pve_ipv4 is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
          - pve_node is match('^[a-zA-Z0-9][a-zA-Z0-9-]*$')
          - pve_hostname is match('^[a-zA-Z0-9][a-zA-Z0-9.-]*$')
        fail_msg: Invalid Runner identity

    - name: Inspect previous Semaphore configuration
      ansible.builtin.stat:
        path: /etc/semaphore/config.json
      register: semaphore_existing

    - name: Refuse to overwrite existing Semaphore
      ansible.builtin.assert:
        that: not semaphore_existing.stat.exists
        fail_msg: Fresh-only bootstrap; existing Semaphore must not be modified

    - name: Install native runtime dependencies
      ansible.builtin.apt:
        name:
          - openssl
          - sudo
          - python3-debian
          - avahi-daemon
          - avahi-utils
          - openssh-client
          - curl
        state: present

    - name: Advertise Runner as a workstation over mDNS
      ansible.builtin.lineinfile:
        path: /etc/avahi/avahi-daemon.conf
        regexp: '^\s*#?\s*publish-workstation\s*='
        insertafter: '^\[publish\]$'
        line: publish-workstation=yes
        state: present
      register: avahi_workstation

    - name: Create Semaphore system user
      ansible.builtin.user:
        name: semaphore
        comment: Semaphore UI
        home: /var/lib/semaphore
        create_home: false
        shell: /usr/sbin/nologin
        system: true
        state: present

    - name: Create local service directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/semaphore, owner: root, group: semaphore, mode: '0750'}
        - {path: /var/lib/semaphore, owner: semaphore, group: semaphore, mode: '0700'}
        - {path: /var/lib/semaphore/tmp, owner: semaphore, group: semaphore, mode: '0700'}
        - {path: /etc/digitalhouses, owner: root, group: root, mode: '0755'}

    - name: Store the public site identity
      ansible.builtin.copy:
        dest: /etc/digitalhouses/site-id
        content: "{{ site_id }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Store the runner site profile
      ansible.builtin.copy:
        dest: /etc/digitalhouses/site-profile
        content: "{{ site_profile | default('home') }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Confirm PVE cluster CA was copied from the host
      ansible.builtin.stat:
        path: /etc/digitalhouses/pve-root-ca.pem
      register: pve_ca_file

    - name: Require the trusted PVE CA certificate
      ansible.builtin.assert:
        that:
          - pve_ca_file.stat.isreg | default(false)
          - not (pve_ca_file.stat.islnk | default(false))
        fail_msg: PVE CA was not delivered by host bootstrap

    - name: Record actual PVE endpoint for site tasks
      ansible.builtin.copy:
        dest: /etc/digitalhouses/pve.yml
        content: "{{ {'pve': {'node': pve_node, 'ipv4': pve_ipv4, 'hostname': pve_hostname, 'ca_file': '/etc/digitalhouses/pve-root-ca.pem'}} | to_nice_yaml }}"
        owner: root
        group: root
        mode: '0644'

    - name: Generate Semaphore encryption material and admin password
      ansible.builtin.command:
        argv: [/usr/bin/openssl, rand, -base64, '32']
      loop: [cookie_hash, cookie_encryption, access_key_encryption, admin_password]
      register: semaphore_random
      changed_when: true
      no_log: true

    - name: Keep generated secrets only in Ansible memory
      ansible.builtin.set_fact:
        sem_cookie_hash: "{{ semaphore_random.results[0].stdout }}"
        sem_cookie_encryption: "{{ semaphore_random.results[1].stdout }}"
        sem_access_key_encryption: "{{ semaphore_random.results[2].stdout }}"
        sem_admin_password: "{{ semaphore_random.results[3].stdout }}"
      no_log: true

    - name: Install Semaphore configuration
      ansible.builtin.copy:
        dest: /etc/semaphore/config.json
        owner: root
        group: semaphore
        mode: '0640'
        content: "{{ semaphore_config | to_nice_json }}\n"
      vars:
        semaphore_config:
          dialect: sqlite
          sqlite:
            host: /var/lib/semaphore/database.sqlite
          port: ':80'
          interface: 0.0.0.0
          web_host: ''
          tmp_path: /var/lib/semaphore/tmp
          cookie_hash: "{{ sem_cookie_hash }}"
          cookie_encryption: "{{ sem_cookie_encryption }}"
          access_key_encryption: "{{ sem_access_key_encryption }}"
          tls:
            enabled: false
      no_log: true

    - name: Save the initial admin password on this Runner only
      ansible.builtin.copy:
        dest: /root/dh-semaphore-initial-admin-password
        content: "{{ sem_admin_password }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Download checksum-pinned Semaphore package
      ansible.builtin.get_url:
        url: >-
          {{ 'https://github.com/semaphoreui/semaphore/releases/download/v'
             ~ semaphore_version ~ '/semaphore_'
             ~ semaphore_version ~ '_linux_amd64.deb' }}
        dest: "{{ semaphore_deb }}"
        checksum: "sha256:{{ semaphore_deb_sha256 }}"
        mode: '0600'

    - name: Install Semaphore package
      ansible.builtin.apt:
        deb: "{{ semaphore_deb }}"
        state: present

    - name: Initialize Semaphore DB using upstream CLI
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - semaphore
          - --
          - /usr/bin/semaphore
          - migrate
          - --config
          - /etc/semaphore/config.json
      changed_when: true

    - name: Create initial admin user using upstream CLI
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - semaphore
          - --
          - /usr/bin/semaphore
          - users
          - add
          - --config
          - /etc/semaphore/config.json
          - --admin
          - --login
          - admin
          - --name
          - DigitalHouses Administrator
          - --email
          - admin@localhost
          - --password
          - "{{ sem_admin_password }}"
      changed_when: true
      no_log: true

    - name: Allow local Ansible become for Semaphore on this Runner only
      ansible.builtin.copy:
        dest: /etc/sudoers.d/digitalhouses-semaphore
        content: "semaphore ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Permit Semaphore to traverse the Ansible runtime
      ansible.builtin.file:
        path: /opt/ansible
        state: directory
        mode: '0755'

    - name: Permit Semaphore to read and execute Ansible virtualenv
      ansible.builtin.command:
        argv:
          - /usr/bin/chmod
          - -R
          - a+rX
          - /opt/ansible/venv
      changed_when: true

    - name: Verify that the Semaphore service user can execute Ansible
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - semaphore
          - --
          - /opt/ansible/venv/bin/ansible-playbook
          - --version
      changed_when: false

    - name: Install pinned native Ansible XML collection for task 30
      ansible.builtin.command:
        argv:
          - /opt/ansible/venv/bin/ansible-galaxy
          - collection
          - install
          - community.general:11.2.1
          - -p
          - /usr/share/ansible/collections
        creates: /usr/share/ansible/collections/ansible_collections/community/general/MANIFEST.json

    - name: Read installed community.general collection manifest
      ansible.builtin.slurp:
        src: /usr/share/ansible/collections/ansible_collections/community/general/MANIFEST.json
      register: runner_general_collection_manifest

    - name: Require the pinned XML module collection version
      ansible.builtin.assert:
        that:
          - (runner_general_collection_manifest.content | b64decode | from_json).collection_info.version == '11.2.1'
        fail_msg: RUNNER_COMMUNITY_GENERAL_VERSION_MISMATCH

    - name: Install Semaphore systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/digitalhouses-semaphore.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=DigitalHouses Semaphore UI
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=semaphore
          Group=semaphore
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Environment=PATH=/opt/ansible/venv/bin:/usr/local/bin:/usr/bin:/bin
          Environment=LANG=C.UTF-8
          WorkingDirectory=/var/lib/semaphore
          ExecStart=/usr/bin/semaphore server --config /etc/semaphore/config.json
          Restart=on-failure
          RestartSec=5
          PrivateTmp=true
          UMask=0077

          [Install]
          WantedBy=multi-user.target

    - name: Start Semaphore
      ansible.builtin.systemd_service:
        name: digitalhouses-semaphore.service
        daemon_reload: true
        state: started
        enabled: true

    - name: Publish Runner workstation over Bonjour mDNS
      ansible.builtin.systemd_service:
        name: avahi-daemon.service
        state: "{{ 'restarted' if avahi_workstation.changed else 'started' }}"
        enabled: true

    - name: Wait for native Semaphore HTTP listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        delay: 1
        timeout: 60

    - name: Authenticate with localhost Semaphore API
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/auth/login"
        method: POST
        body_format: json
        body:
          auth: admin
          password: "{{ sem_admin_password }}"
        validate_certs: true
        use_proxy: false
        status_code: [200, 204]
      register: sem_login
      no_log: true

    - name: Keep login cookie in memory
      ansible.builtin.set_fact:
        sem_cookie: "{{ sem_login.cookies_string }}"
      no_log: true

    - name: Create new site project
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/projects"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: "{{ site_id }}"
          max_parallel_tasks: 1
          alert: false
          demo: false
        use_proxy: false
        status_code: [200, 201]
      register: sem_project
      no_log: true

    - name: Create public Git key placeholder
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/keys"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: Public Git (none)
          type: none
          project_id: "{{ sem_project.json.id }}"
        use_proxy: false
        status_code: [200, 201]
      register: sem_git_key
      no_log: true

    - name: Register public Ansible-HOMES repository
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/repositories"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: Ansible-HOMES (public)
          project_id: "{{ sem_project.json.id }}"
          git_url: "{{ code_repo_url }}"
          git_branch: "{{ code_branch | default('main') }}"
          ssh_key_id: "{{ sem_git_key.json.id }}"
        use_proxy: false
        status_code: [200, 201]
      register: sem_repo
      no_log: true

    - name: Register local inventory
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/inventory"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: Runner (local)
          project_id: "{{ sem_project.json.id }}"
          type: file
          inventory: inventory/bootstrap.yml
          repository_id: "{{ sem_repo.json.id }}"
          ssh_key_id: "{{ sem_git_key.json.id }}"
        use_proxy: false
        status_code: [200, 201]
      register: sem_inventory
      no_log: true

    - name: Register empty variable environment
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/environment"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: Empty
          project_id: "{{ sem_project.json.id }}"
          json: '{}'
          env: '{}'
        use_proxy: false
        status_code: [200, 201]
      register: sem_environment
      no_log: true

    - name: Register only manual task 00
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/templates"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        body:
          name: 00-Обновить список задач
          project_id: "{{ sem_project.json.id }}"
          app: ansible
          description: Synchronize catalog entries from the public Ansible-HOMES repo
          playbook: playbooks/update-task-catalog.yml
          arguments: '[]'
          type: ''
          inventory_id: "{{ sem_inventory.json.id }}"
          repository_id: "{{ sem_repo.json.id }}"
          environment_id: "{{ sem_environment.json.id }}"
          allow_override_args_in_task: false
          autorun: false
        use_proxy: false
        status_code: [200, 201]
      no_log: true

    - name: Create revocable API token for the task catalog
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/user/tokens"
        method: POST
        body_format: json
        headers:
          Cookie: "{{ sem_cookie }}"
        use_proxy: false
        status_code: [200, 201]
      register: sem_catalog_token
      no_log: true

    - name: Save catalog API token for Semaphore service only
      ansible.builtin.copy:
        dest: /etc/semaphore/catalog-token
        content: "{{ sem_catalog_token.json.id }}\n"
        owner: root
        group: semaphore
        mode: '0640'
      no_log: true

    - name: Enroll dedicated DEV API access
      ansible.builtin.import_tasks: tasks/dev-access.yml
      vars:
        dev_admin_token: "{{ sem_catalog_token.json.id }}"
        dev_project_id: "{{ sem_project.json.id }}"

    - name: Read the initial task templates
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ sem_project.json.id }}/templates"
        method: GET
        headers:
          Cookie: "{{ sem_cookie }}"
        use_proxy: false
        status_code: 200
      register: sem_templates
      no_log: true

    - name: Require only task 00 and no autorun
      ansible.builtin.assert:
        that:
          - sem_templates.json | length == 1
          - sem_templates.json[0].name == '00-Обновить список задач'
          - sem_templates.json[0].autorun | default(false) == false
        fail_msg: Semaphore bootstrap must contain only task 00

    - name: Confirm fresh Semaphore initialization
      ansible.builtin.debug:
        msg: >-
          BOOTSTRAP_RUNNER=PASS; SITE={{ site_id }}; ONLY_TASK=00;
          URL=http://{{ runner_ip }}/
