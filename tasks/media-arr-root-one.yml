---
# Reconcile the selected Servarr app root through its official API.
- name: Allow native Servarr group to write only its managed library directory
  ansible.builtin.file:
    path: "{{ media_wire_arr.path }}"
    state: directory
    group: media_group
    mode: '2775'

- name: Require effective Servarr service can write its declared library root
  ansible.builtin.command:
    argv: [runuser, -u, "{{ media_wire_arr.slug }}", --, test, -w, "{{ media_wire_arr.path }}"]
  changed_when: false

- name: List current native Servarr library roots
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media_wire_arr.port }}/api/{{ media_wire_arr.version }}/rootfolder"
    headers:
      X-Api-Key: "{{ media_wire_arr_keys[media_wire_arr.slug] }}"
    status_code: 200
    return_content: true
    use_proxy: false
  register: media_wire_root_folders_before
  changed_when: false
  no_log: true

- name: Refuse any ambiguous duplicate managed root
  ansible.builtin.assert:
    that:
      - media_wire_root_folders_before.json is sequence
      - >-
        (media_wire_root_folders_before.json
         | selectattr('path', 'equalto', media_wire_arr.path)
         | list | length) <= 1
    fail_msg: MEDIA80_ARR_LIBRARY_ROOT_CONFLICT
  no_log: true

- name: Read Lidarr metadata and quality profiles only for a new music root
  ansible.builtin.uri:
    url: "http://127.0.0.1:8686/api/v1/{{ item }}"
    headers:
      X-Api-Key: "{{ media_wire_arr_keys.lidarr }}"
    status_code: 200
    return_content: true
    use_proxy: false
  loop: [metadataprofile, qualityprofile]
  register: media_lidarr_root_profiles
  changed_when: false
  when:
    - media_wire_arr.slug == 'lidarr'
    - >-
      (media_wire_root_folders_before.json
       | selectattr('path', 'equalto', media_wire_arr.path) | list | length) == 0
  no_log: true

- name: Use Lidarr native root-folder fields with existing default profiles
  ansible.builtin.set_fact:
    media_lidarr_root_payload:
      name: Music
      path: "{{ media_wire_arr.path }}"
      defaultMetadataProfileId: "{{ media_lidarr_root_profiles.results[0].json[0].id | int }}"
      defaultQualityProfileId: "{{ media_lidarr_root_profiles.results[1].json[0].id | int }}"
      defaultMonitorOption: all
      defaultNewItemMonitorOption: all
      defaultTags: []
  when:
    - media_wire_arr.slug == 'lidarr'
    - >-
      (media_wire_root_folders_before.json
       | selectattr('path', 'equalto', media_wire_arr.path) | list | length) == 0

- name: Add the missing declared ZFS root via the native Servarr API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media_wire_arr.port }}/api/{{ media_wire_arr.version }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ media_wire_arr_keys[media_wire_arr.slug] }}"
    body_format: json
    body: >-
      {{ media_lidarr_root_payload if media_wire_arr.slug == 'lidarr'
         else {'path': media_wire_arr.path} }}
    status_code: [200, 201]
    use_proxy: false
  when: >-
    (media_wire_root_folders_before.json
     | selectattr('path', 'equalto', media_wire_arr.path)
     | list | length) == 0
  no_log: true

- name: Verify exact ZFS library folder exists in Servarr
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media_wire_arr.port }}/api/{{ media_wire_arr.version }}/rootfolder"
    headers:
      X-Api-Key: "{{ media_wire_arr_keys[media_wire_arr.slug] }}"
    status_code: 200
    return_content: true
    use_proxy: false
  register: media_wire_root_folders_after
  changed_when: false
  no_log: true

- name: Refuse missing or duplicated ZFS root after reconciliation
  ansible.builtin.assert:
    that:
      - >-
        (media_wire_root_folders_after.json
         | selectattr('path', 'equalto', media_wire_arr.path)
         | list | length) == 1
    fail_msg: MEDIA80_ARR_ZFS_ROOT_NOT_VERIFIED
  no_log: true
