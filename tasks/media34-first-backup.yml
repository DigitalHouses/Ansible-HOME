---
# Explicit one-off acceptance backup, HOME serzhan only; no job or retention changes.
- name: Require selected running Uptime Kuma CT and its own PBS storage
  ansible.builtin.assert:
    that:
      - pbs34_site_id == 'serzhan-home'
      - pbs34_action == 'backup_test'
      - pbs34_pve_guest_candidates | length == 1
      - pbs34_pve_guest_candidates[0].name == 'uptimekuma'
      - pbs34_pve_guest_candidates[0].type == 'lxc'
      - pbs34_pve_guest_candidates[0].status == 'running'
      - pbs34_media.vmid | int != 200
      - (pbs34_pve_storages.stdout | from_json) | selectattr('storage','equalto','pbs-serzhan') | list | length == 1
    fail_msg: PBS34_BACKUP_TEST_UNEXPECTED_GUEST_OR_STORAGE

- name: Run exactly one manual snapshot backup without changing PVE jobs
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -i
      - /var/lib/semaphore/.ssh/id_ed25519
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      - -o
      - ConnectTimeout=7
      - "root@{{ pve.ipv4 }}"
      - /usr/bin/vzdump
      - '200'
      - --storage
      - pbs-serzhan
      - --mode
      - snapshot
      - --remove
      - '0'
  register: pbs34_backup_test_output
  changed_when: true

- name: Require vzdump to report a successful CT200 backup
  ansible.builtin.assert:
    that:
      - pbs34_backup_test_output.rc == 0
      - pbs34_backup_test_output.stdout is search('Finished Backup of VM 200')
    fail_msg: PBS34_FIRST_BACKUP_FAILED

- name: Read persisted PBS backup storage contents through PVE
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -i
      - /var/lib/semaphore/.ssh/id_ed25519
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      - -o
      - ConnectTimeout=7
      - "root@{{ pve.ipv4 }}"
      - /usr/bin/pvesh
      - get
      - "/nodes/{{ pbs34_pve_guest_candidates[0].node }}/storage/pbs-serzhan/content"
      - --content
      - backup
      - --output-format
      - json
  register: pbs34_backup_test_content
  changed_when: false

- name: Require at least one CT200 snapshot stored in the intended PBS
  ansible.builtin.assert:
    that:
      - >-
        ((pbs34_backup_test_content.stdout | from_json)
          | map(attribute='volid') | select('search', 'backup/ct/200/') | list | length) > 0
    fail_msg: PBS34_BACKUP_TEST_READBACK_MISSING

- name: Confirm the first source backup for future CORE Pull Sync
  ansible.builtin.debug:
    msg:
      - "PBS34_FIRST_BACKUP=SUCCESS VMID=200 type=lxc"
      - "PBS34_BACKUP_STORAGE=pbs-serzhan"
      - "PBS34_BACKUP_JOBS_UNCHANGED=true"
