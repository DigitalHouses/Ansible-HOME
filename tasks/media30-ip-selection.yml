---
# Task 30: HOME standard .223 / VM2223; explicit overrides are nonstandard.
# Canonical manifest network/gateway provide the /24 prefix; no Python helpers.
- name: Normalize media guest address from Semaphore Survey
  ansible.builtin.set_fact:
    media30_ip_choice: "{{ DH_MEDIA_IP | default('223', true) | string | trim }}"
    media30_manifest_ipv4: "{{ media_spec.network.ipv4 }}"
    media30_manifest_vmid: "{{ media_spec.vmid | int }}"

- name: Require IPv4 host address or last octet from Semaphore
  ansible.builtin.assert:
    that:
      - >-
        media30_ip_choice is match('^[0-9]{1,3}$')
        or media30_ip_choice is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - media30_manifest_ipv4 is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/24$')
      - media_spec.network.gateway is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: MEDIA30_IP_FORMAT_INVALID

- name: Expand the explicit selection without silently reusing a legacy manifest IP
  ansible.builtin.set_fact:
    media30_selected_ipv4: >-
      {{ (media_spec.network.gateway.split('.')[:3] + [media30_ip_choice]) | join('.')
         if media30_ip_choice is match('^[0-9]{1,3}$')
         else media30_ip_choice }}

- name: Require host to be a valid address in the declared LAN
  ansible.builtin.assert:
    that:
      - >-
        media30_selected_ipv4.split('.')[:3] ==
        media_spec.network.gateway.split('.')[:3]
      - >-
        media30_selected_ipv4.split('.')[:3] ==
        media30_manifest_ipv4.split('/')[0].split('.')[:3]
      - (media30_selected_ipv4.split('.')[3] | int) >= 1
      - (media30_selected_ipv4.split('.')[3] | int) <= 254
      - media30_selected_ipv4 != media_spec.network.gateway
      - media30_selected_ipv4 != pve.ipv4
      - media30_selected_ipv4.split('.') | map('int') | map('string') | join('.') == media30_selected_ipv4
    fail_msg: >-
      MEDIA30_IP_INVALID: select a valid host address in the declared
      LAN, different from the gateway and PVE host.

- name: Derive media VMID from the static IP's last octet
  ansible.builtin.set_fact:
    media30_selected_vmid: "{{ 2000 + (media30_selected_ipv4.split('.')[3] | int) }}"

- name: Require deterministic valid PVE VMID derived from media IP
  ansible.builtin.assert:
    that:
      - media30_selected_vmid | int >= 2001
      - media30_selected_vmid | int <= 2254
      - media30_selected_vmid | int == 2000 + (media30_selected_ipv4.split('.')[3] | int)
    fail_msg: MEDIA30_IP_TO_VMID_MAPPING_INVALID

- name: Inject selected IPv4 and matching VMID throughout task 30
  ansible.builtin.set_fact:
    media_spec: >-
      {{ media_spec | combine(
          {'network': {'ipv4': media30_selected_ipv4 ~ '/24'},
           'vmid': media30_selected_vmid | int},
          recursive=True) }}
