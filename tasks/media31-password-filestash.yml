---
# Filestash does not expose a password-change API for its config administrator.
# Reconcile only its root-owned bcrypt environment; retain Samba passthrough.
- name: Inspect protected Filestash admin environment
  ansible.builtin.stat:
    path: /etc/digitalhouses/filestash.env
    follow: false
  register: media31_filestash_env_stat
  no_log: true

- name: Require managed Filestash administrator hash ownership
  ansible.builtin.assert:
    that:
      - media31_filestash_env_stat.stat.isreg | default(false)
      - not media31_filestash_env_stat.stat.islnk | default(false)
      - media31_filestash_env_stat.stat.pw_name == 'root'
      - media31_filestash_env_stat.stat.mode == '0600'
    fail_msg: MEDIA31_FILESTASH_ADMIN_ENV_UNSAFE
  no_log: true

- name: Read protected Filestash administrator hash
  ansible.builtin.slurp:
    src: /etc/digitalhouses/filestash.env
  register: media31_filestash_env
  no_log: true

- name: Require native bcrypt-hash encoding
  ansible.builtin.assert:
    that:
      - (media31_filestash_env.content | b64decode | trim) is match('^ADMIN_PASSWORD=[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}$')
    fail_msg: MEDIA31_FILESTASH_BCRYPT_INVALID
  no_log: true

- name: Prepare protected temporary Apache bcrypt verification file
  ansible.builtin.tempfile:
    state: file
    suffix: -media31-filestash
  register: media31_filestash_htpasswd
  no_log: true

- name: Verify current Filestash bcrypt and apply requested change
  block:
    - name: Store existing hash only in a root-owned temporary verification file
      ansible.builtin.copy:
        dest: "{{ media31_filestash_htpasswd.path }}"
        content: "admin:{{ (media31_filestash_env.content | b64decode | trim).split('=', 1)[1] }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Verify committed owner password against current administrator hash
      ansible.builtin.command:
        argv: [htpasswd, -vi, "{{ media31_filestash_htpasswd.path }}", admin]
        stdin: "{{ media31_old_password }}"
        stdin_add_newline: true
      register: media31_filestash_old_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check whether Filestash hash already accepts the new password
      ansible.builtin.command:
        argv: [htpasswd, -vi, "{{ media31_filestash_htpasswd.path }}", admin]
        stdin: "{{ media31_new_password }}"
        stdin_add_newline: true
      register: media31_filestash_new_check
      changed_when: false
      failed_when: false
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Refuse mismatch with managed Filestash administrator
      ansible.builtin.assert:
        that:
          - >-
            media31_filestash_old_check.rc == 0 or
            (media_rotation_mode == 'apply' and (media31_filestash_new_check.rc | default(1)) == 0)
        fail_msg: MEDIA31_FILESTASH_ADMIN_PASSWORD_DRIFT
      no_log: true

    - name: Generate native bcrypt for changed Filestash administrator password
      ansible.builtin.command:
        argv: [htpasswd, -niB, -C, '12', '']
        stdin: "{{ media31_new_password }}"
        stdin_add_newline: false
      register: media31_filestash_new_hash
      changed_when: false
      when: media_rotation_mode == 'apply' and media31_filestash_new_check.rc != 0
      no_log: true

    - name: Require valid newly generated native bcrypt
      ansible.builtin.assert:
        that:
          - media31_filestash_new_hash.stdout is match('^:[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}$')
        fail_msg: MEDIA31_FILESTASH_NEW_BCRYPT_INVALID
      when: media_rotation_mode == 'apply' and media31_filestash_new_check.rc != 0
      no_log: true

    - name: Update only the protected Filestash admin hash
      ansible.builtin.copy:
        dest: /etc/digitalhouses/filestash.env
        content: "ADMIN_PASSWORD={{ media31_filestash_new_hash.stdout.split(':', 1)[1] }}\n"
        owner: root
        group: root
        mode: '0600'
      register: media31_filestash_changed
      when: media_rotation_mode == 'apply' and media31_filestash_new_check.rc != 0
      no_log: true

    - name: Restart Filestash after applying or resuming its protected hash
      ansible.builtin.systemd_service:
        name: filestash.service
        state: restarted
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Verify real Filestash configuration administrator login
      ansible.builtin.uri:
        url: http://127.0.0.1:8334/admin/api/session
        method: POST
        body_format: json
        body:
          password: "{{ media31_new_password }}"
        headers:
          Accept: application/json
          X-Requested-With: XmlHttpRequest
        status_code: 200
        return_content: true
        use_proxy: false
      register: media31_filestash_login
      retries: 20
      delay: 3
      until: >-
        media31_filestash_login.status == 200 and
        media31_filestash_login.json.status | default('') == 'ok'
      changed_when: false
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Verify actual Filestash administrator API with the current password
      ansible.builtin.uri:
        url: http://127.0.0.1:8334/admin/api/session
        method: POST
        body_format: json
        body:
          password: "{{ media31_old_password }}"
        headers:
          Accept: application/json
          X-Requested-With: XmlHttpRequest
        status_code: 200
        return_content: true
        use_proxy: false
      register: media31_filestash_preflight_login
      changed_when: false
      failed_when: >-
        media31_filestash_preflight_login.status != 200 or
        media31_filestash_preflight_login.json.status | default('') != 'ok'
      when: media_rotation_mode == 'preflight'
      no_log: true

  always:
    - name: Remove private Filestash bcrypt scratch file
      ansible.builtin.file:
        path: "{{ media31_filestash_htpasswd.path }}"
        state: absent
      no_log: true
