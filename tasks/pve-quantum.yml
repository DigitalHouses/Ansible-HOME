---
# FileBrowser Quantum administrative full-root view.
# Upstream discourages / sources because indexing the host is unsafe:
# global viewable=true explicitly disables indexing for this source.
- name: Require x86_64 for the pinned Quantum binary
  ansible.builtin.command: /usr/bin/uname -m
  register: pve_architecture
  changed_when: false

- name: Refuse an unsupported Quantum architecture
  ansible.builtin.assert:
    that: pve_architecture.stdout == 'x86_64'
    fail_msg: "No pinned Quantum binary for this PVE architecture"

- name: Inspect existing Quantum systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/digitalhouses-filebrowser.service
  register: quantum_service

- name: Inspect existing Quantum config
  ansible.builtin.stat:
    path: /etc/digitalhouses/filebrowser-quantum.yml
  register: quantum_config

- name: Check an existing upstream FileBrowser service
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, show, filebrowser.service, --property=LoadState, --value]
  register: upstream_filebrowser_service
  changed_when: false

# Adopt a verified existing service without restarting it. If its listener
# does not match the required management port/authentication, back up its unit,
# retire only that service and install the managed Quantum service. The old
# config/database/binary are never deleted.
- name: Read independent FileBrowser systemd status
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, is-active, filebrowser.service]
  register: quantum_legacy_active
  changed_when: false
  failed_when: false
  when: upstream_filebrowser_service.stdout == 'loaded'

- name: Inspect current FileBrowser health on the standard management address
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  register: quantum_existing_health
  changed_when: false
  failed_when: false
  when: upstream_filebrowser_service.stdout == 'loaded'

- name: Inspect current FileBrowser login requirement
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/api/users"
    use_proxy: false
    status_code: [401, 403]
    timeout: 5
  register: quantum_existing_auth
  changed_when: false
  failed_when: false
  when:
    - upstream_filebrowser_service.stdout == 'loaded'
    - quantum_existing_health.status | default(0) == 200

- name: Verify existing FileBrowser responds independently from the Runner
  ansible.builtin.uri:
    url: "http://{{ quantum_bind_ipv4 }}:8090/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  delegate_to: runner
  register: quantum_existing_lan
  changed_when: false
  failed_when: false
  when:
    - upstream_filebrowser_service.stdout == 'loaded'
    - quantum_existing_health.status | default(0) == 200

- name: Classify the FileBrowser installation
  ansible.builtin.set_fact:
    quantum_use_legacy: >-
      {{ upstream_filebrowser_service.stdout == 'loaded'
         and not quantum_service.stat.exists
         and quantum_legacy_active.stdout | default('') == 'active'
         and quantum_existing_health.status | default(0) == 200
         and quantum_existing_auth.status | default(0) in [401, 403]
         and quantum_existing_lan.status | default(0) == 200 }}
    quantum_replace_legacy: >-
      {{ upstream_filebrowser_service.stdout == 'loaded'
         and (quantum_service.stat.exists or
              quantum_legacy_active.stdout | default('') != 'active' or
              quantum_existing_health.status | default(0) != 200 or
              quantum_existing_auth.status | default(0) not in [401, 403] or
              quantum_existing_lan.status | default(0) != 200) }}

- name: Accept the operationally compatible existing FileBrowser installation
  ansible.builtin.debug:
    msg: >-
      QUANTUM=EXISTING_VERIFIED; service=filebrowser.service;
      management_ip={{ quantum_bind_ipv4 }}; auth=REQUIRED;
      existing users/database retained.
  when: quantum_use_legacy

- name: Report version-update limit for an existing independent FileBrowser
  ansible.builtin.debug:
    msg: >-
      QUANTUM_UPDATE=NOT_MANAGED_HERE; existing filebrowser.service retained
      with its original database. A forced replacement would need a separate
      credentials/database migration.
  when:
    - quantum_use_legacy
    - (requested_quantum_update | default('no')) == 'yes'

- name: Inspect original independent FileBrowser service file for backup
  ansible.builtin.stat:
    path: /etc/systemd/system/filebrowser.service
    follow: false
  register: quantum_legacy_unit
  when: quantum_replace_legacy

- name: Back up independent FileBrowser unit before takeover
  ansible.builtin.copy:
    src: /etc/systemd/system/filebrowser.service
    dest: /etc/systemd/system/filebrowser.service.dh-pre-adoption.bak
    remote_src: true
    owner: root
    group: root
    mode: '0600'
    force: false
  when:
    - quantum_replace_legacy
    - quantum_legacy_unit.stat.isreg | default(false)

- name: Report legacy FileBrowser replacement without deleting old data
  ansible.builtin.debug:
    msg: >-
      QUANTUM=REPLACING_LEGACY; original service will be disabled
      only after the replacement binary is ready;
      original data and binary retained on disk, new managed
      Quantum instance will be provisioned.
  when: quantum_replace_legacy

- name: Install or reconcile managed Quantum on the PVE management IP
  ansible.builtin.include_tasks: pve-quantum-managed.yml
  when: not quantum_use_legacy
