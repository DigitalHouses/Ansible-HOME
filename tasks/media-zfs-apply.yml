---
# Survey decision is the authorization: import preserves data, erase replaces it.
# Import never wipes or re-creates a pool. Erase touches only one non-root SATA disk.

- name: Check whether the selected ZFS pool is already imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ media_vm.storage.pool_name }}"]
  register: media_target_pool_present
  changed_when: false
  failed_when: false

- name: Import the requested existing ZFS pool without touching disk contents
  ansible.builtin.command:
    argv: >-
      {{ ['zpool', 'import', '-f']
         + (['-o', 'readonly=on'] if media_vm.storage.mode == 'readonly' else [])
         + [media_vm.storage.pool_name] }}
  changed_when: true
  when:
    - media_raw_disk_action == 'import'
    - media_target_pool_present.rc != 0

- name: Find physical SATA disks in the media guest for explicit erase
  ansible.builtin.command:
    argv: [lsblk, -J, -d, -o, 'PATH,TYPE,TRAN']
  register: media_sata_candidate_raw
  changed_when: false
  when: media_raw_disk_action == 'erase'

- name: Select SATA disks only, not the virtual VM system disk
  ansible.builtin.set_fact:
    media_sata_disks: >-
      {{ (media_sata_candidate_raw.stdout | from_json).blockdevices
         | selectattr('type', 'equalto', 'disk')
         | selectattr('tran', 'equalto', 'sata')
         | map(attribute='path') | list }}
  when: media_raw_disk_action == 'erase'

- name: Require one physical SATA disk before irreversible erase
  ansible.builtin.assert:
    that: media_sata_disks | length == 1
    fail_msg: >-
      MEDIA_ERASE_REQUIRES_ONE_SATA_DISK: select exactly one
      physical SATA disk for passthrough before erasing.
  when: media_raw_disk_action == 'erase'

- name: Select the SATA target for the requested erase
  ansible.builtin.set_fact:
    media_sata_disk: "{{ media_sata_disks[0] }}"
  when: media_raw_disk_action == 'erase'

- name: Read only the guest system volume before erase
  ansible.builtin.command:
    argv: [findmnt, -rn, -o, SOURCE, /]
  register: media_guest_root_source
  changed_when: false
  when: media_raw_disk_action == 'erase'

- name: Trace the guest root disk so it cannot be erased
  ansible.builtin.command:
    argv: [lsblk, -srn, -o, PATH, "{{ media_guest_root_source.stdout }}"]
  register: media_guest_root_parents
  changed_when: false
  when: media_raw_disk_action == 'erase'

- name: Exclude the running guest system disk from explicit erase
  ansible.builtin.assert:
    that: media_sata_disk not in media_guest_root_parents.stdout_lines
    fail_msg: MEDIA_ERASE_SYSTEM_DISK_REFUSED
  when: media_raw_disk_action == 'erase'

- name: Stop media consumers before requested erase
  ansible.builtin.service_facts:
  when: media_raw_disk_action == 'erase'

- name: Stop present media consumer services before erase
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop:
    - plexmediaserver.service
    - jellyfin.service
    - radarr.service
    - sonarr.service
    - prowlarr.service
    - qbittorrent.service
    - filestash.service
    - docker.service
    - smbd.service
    - nmbd.service
    - nfs-server.service
    - nginx.service
  when:
    - media_raw_disk_action == 'erase'
    - item in ansible_facts.services
    - ansible_facts.services[item].status | default('not-found') != 'not-found'

- name: Destroy the old named ZFS pool when erase was selected
  ansible.builtin.command:
    argv: [zpool, destroy, -f, "{{ media_vm.storage.pool_name }}"]
  changed_when: true
  when:
    - media_raw_disk_action == 'erase'
    - media_target_pool_present.rc == 0

- name: Remove old partition table and filesystem signatures from selected SATA disk
  ansible.builtin.command:
    argv: [wipefs, --all, --force, "{{ media_sata_disk }}"]
  changed_when: true
  when: media_raw_disk_action == 'erase'

- name: Erase the selected SATA disk partition table
  ansible.builtin.command:
    argv: [sgdisk, --zap-all, "{{ media_sata_disk }}"]
  changed_when: true
  when: media_raw_disk_action == 'erase'

- name: Create a fresh ZFS pool on the selected SATA disk
  ansible.builtin.command:
    argv:
      - zpool
      - create
      - -f
      - -o
      - ashift=12
      - -O
      - compression=zstd
      - -O
      - atime=off
      - -O
      - xattr=sa
      - -O
      - acltype=posixacl
      - "{{ media_vm.storage.pool_name }}"
      - "{{ media_sata_disk }}"
  changed_when: true
  when: media_raw_disk_action == 'erase'

- name: Read existing ZFS datasets
  ansible.builtin.command:
    argv: [zfs, list, -H, -o, name]
  register: media_zfs_datasets
  changed_when: false

- name: Create only absent declared datasets
  ansible.builtin.command:
    argv: [zfs, create, "{{ media_vm.storage.pool_name }}/{{ item }}"]
  loop: "{{ media_vm.storage.layout.datasets }}"
  when: >-
    (media_vm.storage.pool_name ~ '/' ~ item) not in media_zfs_datasets.stdout_lines

  changed_when: true
- name: Read dataset mount states
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, mounted, "{{ media_vm.storage.pool_name }}/{{ item }}"]
  loop: "{{ media_vm.storage.layout.datasets }}"
  register: media_zfs_mount_states
  changed_when: false

- name: Mount declared datasets that are not already mounted
  ansible.builtin.command:
    argv: [zfs, mount, "{{ media_vm.storage.pool_name }}/{{ item.item }}"]
  loop: "{{ media_zfs_mount_states.results }}"
  when: item.stdout != 'yes'

  changed_when: true
- name: Check that directories have not been replaced by symlinks
  ansible.builtin.stat:
    path: "/{{ media_vm.storage.pool_name }}/{{ item }}"
    follow: false
  loop: "{{ media_vm.storage.layout.directories }}"
  register: media_layout_paths
  changed_when: false

- name: Reject redirected media storage directories
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
    fail_msg: MEDIA_LAYOUT_SYMLINK_BLOCKED
  loop: "{{ media_layout_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure declared directories are present
  ansible.builtin.file:
    path: "/{{ media_vm.storage.pool_name }}/{{ item }}"
    state: directory
    mode: '2775'
  loop: "{{ media_vm.storage.layout.directories }}"

- name: Retire old Python-backed custom ZFS boot service when present
  ansible.builtin.stat:
    path: /etc/systemd/system/dh-media-zfs.service
  register: media_old_zfs_service

- name: Stop and disable old custom ZFS importer
  ansible.builtin.systemd_service:
    name: dh-media-zfs.service
    enabled: false
    state: stopped
  when: media_old_zfs_service.stat.exists

- name: Remove retired boot service definition
  ansible.builtin.file:
    path: /etc/systemd/system/dh-media-zfs.service
    state: absent
  when: media_old_zfs_service.stat.exists

- name: Enable native ZFS import and mount at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - zfs-import-cache.service
    - zfs-mount.service

- name: Confirm requested pool is imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ media_vm.storage.pool_name }}"]
  changed_when: false
