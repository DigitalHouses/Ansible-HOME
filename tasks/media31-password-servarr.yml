---
# Servarr Forms authentication uses native /login and host-config API.
- name: Read protected existing Servarr API key
  ansible.builtin.slurp:
    src: "/var/lib/{{ media31_arr.slug }}/config.xml"
  register: media31_arr_xml
  no_log: true

- name: Require one managed Servarr API key
  ansible.builtin.assert:
    that:
      - (media31_arr_xml.content | b64decode | regex_findall('<ApiKey>([^<]+)</ApiKey>')) | length == 1
    fail_msg: MEDIA31_SERVARR_API_KEY_UNAVAILABLE
  no_log: true

- name: Store native Servarr API key only in protected memory
  ansible.builtin.set_fact:
    media31_arr_key: "{{ (media31_arr_xml.content | b64decode | regex_findall('<ApiKey>([^<]+)</ApiKey>'))[0] }}"
  no_log: true

- name: Inspect current Servarr host authentication
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media31_arr.port }}/api/{{ media31_arr.version }}/config/host"
    headers:
      X-Api-Key: "{{ media31_arr_key }}"
    return_content: true
    status_code: 200
    use_proxy: false
  register: media31_arr_host
  changed_when: false
  no_log: true

- name: Require an existing owner-managed Servarr Forms configuration
  ansible.builtin.assert:
    that:
      - media31_arr_host.json.id | int >= 1
      - media31_arr_host.json.authenticationMethod | lower == 'forms'
      - media31_arr_host.json.authenticationRequired | lower == 'enabled'
      - media31_arr_host.json.username == media_site.owner_slug
    fail_msg: MEDIA31_SERVARR_UNMANAGED_AUTH
  no_log: true

- name: Verify current Servarr Forms login without following redirects
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media31_arr.port }}/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_old_password }}"
      rememberMe: 'off'
    status_code: [302, 303]
    follow_redirects: none
    use_proxy: false
  register: media31_arr_old_login
  changed_when: false
  no_log: true

- name: Check Servarr Forms login with the new password if applying
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media31_arr.port }}/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
      rememberMe: 'off'
    status_code: [302, 303]
    follow_redirects: none
    use_proxy: false
  register: media31_arr_new_login
  when: media_rotation_mode == 'apply'
  changed_when: false
  no_log: true

- name: Evaluate native Servarr Forms authentication results
  ansible.builtin.set_fact:
    media31_arr_old_valid: >-
      {{ media31_arr_old_login.status in [302, 303] and
         'loginFailed=true' not in (media31_arr_old_login.location | default('')) and
         'loginFailed' not in (media31_arr_old_login.location | default('')) }}
    media31_arr_new_valid: >-
      {{ media_rotation_mode == 'apply' and
         (media31_arr_new_login.status | default(0)) in [302, 303] and
         'loginFailed' not in (media31_arr_new_login.location | default('')) }}
  no_log: true

- name: Reject Servarr credential mismatch before native update
  ansible.builtin.assert:
    that:
      - media31_arr_old_valid | bool or media31_arr_new_valid | bool
    fail_msg: MEDIA31_SERVARR_OWNER_PASSWORD_DRIFT
  no_log: true

- name: Change only the native Servarr owner password through its host API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media31_arr.port }}/api/{{ media31_arr.version }}/config/host/{{ media31_arr_host.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ media31_arr_key }}"
    body_format: json
    body: >-
      {{ media31_arr_host.json | combine({
        'password': media31_new_password,
        'passwordConfirmation': media31_new_password
      }) }}
    status_code: [200, 202]
    use_proxy: false
    timeout: 30
  when: media_rotation_mode == 'apply' and not media31_arr_new_valid | bool
  no_log: true

- name: Verify requested Servarr Forms login on the actual listener
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ media31_arr.port }}/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
      rememberMe: 'off'
    status_code: [302, 303]
    follow_redirects: none
    use_proxy: false
  register: media31_arr_final_login
  retries: 10
  delay: 3
  until: >-
    media31_arr_final_login.status in [302, 303] and
    'loginFailed' not in (media31_arr_final_login.location | default(''))
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true
