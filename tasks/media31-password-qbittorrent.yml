---
# Verify the non-loopback LAN owner credential: loopback API auth bypass
# cannot serve as proof of a valid qBittorrent owner password.
- name: Authenticate qBittorrent owner against LAN with existing password
  ansible.builtin.uri:
    url: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/api/v2/auth/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_old_password }}"
    headers:
      Origin: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080"
      Referer: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/"
    status_code: [200, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_qbt_old_login
  changed_when: false
  no_log: true

- name: Check qBittorrent owner login with requested password
  ansible.builtin.uri:
    url: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/api/v2/auth/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
    headers:
      Origin: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080"
      Referer: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/"
    status_code: [200, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_qbt_new_login
  when: media_rotation_mode == 'apply'
  changed_when: false
  no_log: true

- name: Require known owner qBittorrent password before mutation
  ansible.builtin.assert:
    that:
      - >-
        (media31_qbt_old_login.status == 200 and media31_qbt_old_login.content | trim == 'Ok.')
        or (media_rotation_mode == 'apply' and
            (media31_qbt_new_login.status | default(0)) == 200 and
            (media31_qbt_new_login.content | default('') | trim) == 'Ok.')
    fail_msg: MEDIA31_QBITTORRENT_OWNER_PASSWORD_DRIFT
  no_log: true

- name: Update qBittorrent password through native loopback WebAPI
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/api/v2/app/setPreferences
    method: POST
    body_format: form-urlencoded
    body:
      json: "{{ {'web_ui_password': media31_new_password} | to_json }}"
    headers:
      Origin: http://127.0.0.1:8080
      Referer: http://127.0.0.1:8080/
    status_code: 200
    use_proxy: false
  when: >-
    media_rotation_mode == 'apply' and
    (media31_qbt_new_login.status | default(0) != 200 or
     media31_qbt_new_login.content | default('') | trim != 'Ok.')
  no_log: true

- name: Verify qBittorrent new owner credentials on the LAN listener
  ansible.builtin.uri:
    url: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/api/v2/auth/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
    headers:
      Origin: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080"
      Referer: "http://{{ media_spec.network.ipv4.split('/')[0] }}:8080/"
    status_code: 200
    return_content: true
    use_proxy: false
  register: media31_qbt_verified
  retries: 10
  delay: 2
  until: media31_qbt_verified.status == 200 and media31_qbt_verified.content | trim == 'Ok.'
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true
