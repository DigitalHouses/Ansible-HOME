---
- name: Connect to HOME Media VM holding the client PKCS12 package
  ansible.builtin.add_host:
    name: cf70_verify_media
    ansible_host: 192.168.11.223
    ansible_connection: ssh
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
    ansible_ssh_common_args: >-
      -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts -o ConnectTimeout=7
  changed_when: false

- name: Check PKCS12 integrity on Media using the DH-stored import password
  ansible.builtin.command:
    argv:
      - openssl
      - pkcs12
      - -in
      - /serzhan-pool/digitalhouses/cert/serzhan-home-ha-mtls.p12
      - -passin
      - file:/serzhan-pool/digitalhouses/cert/serzhan-home-ha-mtls-password.txt
      - -info
      - -noout
  delegate_to: cf70_verify_media
  become: true
  changed_when: false
  no_log: true

- name: Confirm Home Assistant origin is available from Media
  ansible.builtin.uri:
    url: http://192.168.11.222/
    status_code: 200
    timeout: 10
    use_proxy: false
  delegate_to: cf70_verify_media
  changed_when: false

- name: Report successful PKCS12 integrity and local HAOS reachability checks
  ansible.builtin.debug:
    msg: HA70_DH_PKCS12=VALID HA70_LOCAL_HAOS_HTTP=200

- name: Test authenticated public HAOS URL with the existing DH PKCS12
  ansible.builtin.shell: |
    set -euo pipefail
    cert=/serzhan-pool/digitalhouses/cert/serzhan-home-ha-mtls.p12
    passfile=/serzhan-pool/digitalhouses/cert/serzhan-home-ha-mtls-password.txt
    password="$(cat "$passfile")"
    printf 'cert = "%s:%s"\ncert-type = "P12"\n' "$cert" "$password" |
      curl --config - --noproxy '*' --silent --show-error --max-time 15 \
      --output /dev/null --write-out '%{http_code}' \
      https://serzhan-home-pve-ha-mtls.digitalhouses.vip/
  args:
    executable: /bin/bash
  become: true
  delegate_to: cf70_verify_media
  register: cf70_verify_https
  retries: 3
  delay: 3
  until: cf70_verify_https.rc == 0 and cf70_verify_https.stdout | trim in ['200', '401']
  changed_when: false
  failed_when: false
  no_log: true

- name: Report public mTLS result without exposing the client password
  ansible.builtin.debug:
    msg: "HA70_PUBLIC_MTLS_HTTP={{ cf70_verify_https.stdout | default('UNKNOWN') | trim }}"

- name: Require authenticated tunnel to reach the HAOS origin
  ansible.builtin.assert:
    that:
      - cf70_verify_https.rc == 0
      - cf70_verify_https.stdout | trim in ['200', '401']
    fail_msg: HA70_PUBLIC_MTLS_STILL_NOT_REACHING_HAOS
