---
# Task 33 | Install only the official restic executable, pinned to 0.19.1.
# No repository initialization, backup/restore, credentials or scheduled services.
- name: Require Debian amd64 for pinned upstream restic
  ansible.builtin.command:
    argv: [dpkg, --print-architecture]
  register: media33_restic_arch
  changed_when: false
  failed_when: media33_restic_arch.stdout | trim != 'amd64'

- name: Ensure bzip2 is available to unpack the official release
  ansible.builtin.apt:
    name: bzip2
    state: present

- name: Prepare restic release cache
  ansible.builtin.file:
    path: /var/cache/digitalhouses/restic
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download verified official restic 0.19.1 amd64 release
  ansible.builtin.get_url:
    url: https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
    dest: /var/cache/digitalhouses/restic/restic_0.19.1_linux_amd64.bz2
    checksum: sha256:f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
    owner: root
    group: root
    mode: '0644'

- name: Unpack restic executable in the release cache only if absent
  ansible.builtin.command:
    argv:
      - bzip2
      - -dk
      - /var/cache/digitalhouses/restic/restic_0.19.1_linux_amd64.bz2
    creates: /var/cache/digitalhouses/restic/restic_0.19.1_linux_amd64

- name: Verify decompressed restic executable integrity
  ansible.builtin.stat:
    path: /var/cache/digitalhouses/restic/restic_0.19.1_linux_amd64
    checksum_algorithm: sha256
    follow: false
  register: media33_restic_binary

- name: Reject unexpected or incomplete restic executable
  ansible.builtin.assert:
    that:
      - media33_restic_binary.stat.isreg | default(false)
      - not (media33_restic_binary.stat.islnk | default(false))
      - media33_restic_binary.stat.checksum | default('') == '20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639'
    fail_msg: MEDIA33_RESTIC_BINARY_CHECKSUM_MISMATCH

- name: Install upstream restic executable without modifying distro packages
  ansible.builtin.copy:
    src: /var/cache/digitalhouses/restic/restic_0.19.1_linux_amd64
    dest: /usr/local/bin/restic
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Verify executable reports exact pinned restic release
  ansible.builtin.command:
    argv: [/usr/local/bin/restic, version]
  register: media33_restic_version
  changed_when: false
  failed_when: >-
    media33_restic_version.rc != 0 or
    not media33_restic_version.stdout.startswith('restic 0.19.1 ')
