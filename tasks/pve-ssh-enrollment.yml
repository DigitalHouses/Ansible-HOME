---
# Task 10 apply only: commission key authentication on the already authenticated
# single-node PVE. For initial access, Ansible may use the root password kept
# by task 05. Never replace an existing Proxmox authorized_keys symlink.
- name: Confirm single-node SSH enrollment cannot affect cluster peers
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  register: enrollment_cluster

- name: Refuse an SSH root-key change on a clustered PVE
  ansible.builtin.assert:
    that: not enrollment_cluster.stat.exists
    fail_msg: "Clustered PVE requires cluster-wide SSH trust review"

- name: Read Runner's public SSH identity
  ansible.builtin.slurp:
    src: /var/lib/semaphore/.ssh/id_ed25519.pub
  register: runner_public_ssh
  delegate_to: runner

- name: Validate public SSH key format
  ansible.builtin.assert:
    that:
      - (runner_public_ssh.content | b64decode | trim) is match('^ssh-ed25519 [A-Za-z0-9+/=]+')
    fail_msg: "Runner public key is not a valid ED25519 key"

- name: Inspect the existing PVE root authorized-keys path without following links
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
    follow: false
  register: pve_auth_path

- name: Resolve the actual root authorized-keys file if Proxmox uses a symlink
  ansible.builtin.command:
    argv: [/usr/bin/readlink, -f, /root/.ssh/authorized_keys]
  register: resolved_auth_path
  changed_when: false
  when: pve_auth_path.stat.islnk | default(false)

- name: Refuse an unexpected PVE authorized-keys symlink
  ansible.builtin.assert:
    that: >-
      not (pve_auth_path.stat.islnk | default(false)) or
      resolved_auth_path.stdout == '/etc/pve/priv/authorized_keys'
    fail_msg: "Existing root authorized_keys points to an unexpected file"

- name: Select the real PVE authorized-keys destination
  ansible.builtin.set_fact:
    pve_authorized_key_target: >-
      {{ '/etc/pve/priv/authorized_keys'
         if (pve_auth_path.stat.islnk | default(false))
         else '/root/.ssh/authorized_keys' }}

- name: Ensure PVE root SSH directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Authorize the Runner from its exact management IP
  ansible.builtin.lineinfile:
    path: "{{ pve_authorized_key_target }}"
    line: >-
      restrict,from="{{ expected_runner_ipv4 }}" {{ runner_public_ssh.content | b64decode | trim }}
    state: present
    create: true
    # pmxcfs owns /etc/pve/priv permissions; chown/chgrp are not supported.
    owner: "{{ omit if pve_auth_path.stat.islnk | default(false) else 'root' }}"
    group: "{{ omit if pve_auth_path.stat.islnk | default(false) else 'root' }}"
    mode: "{{ omit if pve_auth_path.stat.islnk | default(false) else '0600' }}"
    unsafe_writes: true
  no_log: true

- name: Verify root key authentication succeeds without using a password
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -n
      - -i
      - /var/lib/semaphore/.ssh/id_ed25519
      - -o
      - BatchMode=yes
      - -o
      - PasswordAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      - "root@{{ original_pve_ipv4 }}"
      - /usr/bin/true
  delegate_to: runner
  register: ssh_key_test
  changed_when: false
  no_log: true

- name: Confirm PVE is enrolled for subsequent Ansible runs
  ansible.builtin.debug:
    msg: "PVE_SSH=ENROLLED (strict host key; source={{ expected_runner_ipv4 }})"
