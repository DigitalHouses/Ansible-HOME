---
# Native Samba password operations never pass passwords through argv or env.
- name: Create protected temporary SMB authentication file
  ansible.builtin.tempfile:
    state: file
    suffix: -media31-smb-old
  register: media31_smb_old_file
  no_log: true

- name: Verify and rotate Samba with protected temporary authentication files
  block:
    - name: Stage old SMB authentication outside the ZFS credential dataset
      ansible.builtin.copy:
        dest: "{{ media31_smb_old_file.path }}"
        content: "username = {{ media_site.owner_slug }}\npassword = {{ media31_old_password }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Verify the existing SMB owner login on an actual share
      ansible.builtin.command:
        argv: [smbclient, //127.0.0.1/Media, -A, "{{ media31_smb_old_file.path }}", -c, ls]
      register: media31_smb_old_auth
      changed_when: false
      failed_when: false
      no_log: true

    - name: Create protected temporary SMB candidate authentication file
      ansible.builtin.tempfile:
        state: file
        suffix: -media31-smb-new
      register: media31_smb_new_file
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Stage the candidate SMB password securely
      ansible.builtin.copy:
        dest: "{{ media31_smb_new_file.path }}"
        content: "username = {{ media_site.owner_slug }}\npassword = {{ media31_new_password }}\n"
        owner: root
        group: root
        mode: '0600'
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Check whether Samba has already accepted the new password
      ansible.builtin.command:
        argv: [smbclient, //127.0.0.1/Media, -A, "{{ media31_smb_new_file.path }}", -c, ls]
      register: media31_smb_new_auth
      changed_when: false
      failed_when: false
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Require the old or requested owner Samba credential is valid
      ansible.builtin.assert:
        that:
          - >-
            media31_smb_old_auth.rc == 0 or
            (media_rotation_mode == 'apply' and (media31_smb_new_auth.rc | default(1)) == 0)
        fail_msg: MEDIA31_SAMBA_CREDENTIAL_DRIFT
      no_log: true

    - name: Update only the managed Samba owner's password
      ansible.builtin.command:
        argv: [smbpasswd, -s, "{{ media_site.owner_slug }}"]
        stdin: "{{ media31_new_password }}\n{{ media31_new_password }}"
        stdin_add_newline: true
      when: media_rotation_mode == 'apply' and media31_smb_new_auth.rc != 0
      changed_when: true
      no_log: true

    - name: Require native Samba login succeeds with the requested password
      ansible.builtin.command:
        argv: [smbclient, //127.0.0.1/Media, -A, "{{ media31_smb_new_file.path }}", -c, ls]
      changed_when: false
      when: media_rotation_mode == 'apply'
      no_log: true

  always:
    - name: Remove old SMB authentication scratch file
      ansible.builtin.file:
        path: "{{ media31_smb_old_file.path }}"
        state: absent
      no_log: true
    - name: Remove candidate SMB authentication scratch file
      ansible.builtin.file:
        path: "{{ media31_smb_new_file.path }}"
        state: absent
      when: media31_smb_new_file.path is defined
      no_log: true
