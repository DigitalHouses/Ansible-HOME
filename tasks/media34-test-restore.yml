---
# Disposable restore test: CORE namespace or preserved local PBS after OS recreate.
# Only --source selection differs. Never starts a restored workload.
- name: Confirm approved HOME Proxmox host before any recovery test
  ansible.builtin.command:
    argv: [hostname, -s]
  register: home34_test_hostname
  changed_when: false

- name: Reject incorrect destination PVE host
  ansible.builtin.assert:
    that:
      - home34_test_hostname.stdout | trim == home34_expected_pve
      - home34_action in ['restore-check', 'restore-test', 'local-check', 'local-test']
    fail_msg: HOME34_RESTORE_TEST_WRONG_HOST

- name: Choose exact PBS source based on the requested action
  ansible.builtin.set_fact:
    home34_test_is_local: "{{ home34_action in ['local-check', 'local-test'] }}"
    home34_test_storage_id: >-
      {{ home34_local_storage if home34_action in ['local-check', 'local-test']
         else 'pbs-core-restore' }}
    home34_test_expected_host: >-
      {{ home34_local_pbs_ip if home34_action in ['local-check', 'local-test']
         else home34_core_ip }}
    home34_test_expected_datastore: >-
      {{ home34_local_storage if home34_action in ['local-check', 'local-test']
         else home34_core_store }}

- name: Read exact approved PVE PBS storage definition
  ansible.builtin.command:
    argv: [pvesh, get, "/storage/{{ home34_test_storage_id }}", --output-format, json]
  register: home34_test_storage
  changed_when: false

- name: Require exact local root namespace or CORE namespace and backup-only storage
  ansible.builtin.assert:
    that:
      - (home34_test_storage.stdout | from_json).type == 'pbs'
      - (home34_test_storage.stdout | from_json).server == home34_test_expected_host
      - (home34_test_storage.stdout | from_json).datastore == home34_test_expected_datastore
      - >-
        ((home34_test_storage.stdout | from_json).namespace | default('', true)) in
        ([''] if home34_test_is_local else [home34_site.id])
      - "'backup' in (home34_test_storage.stdout | from_json).content.split(',')"
    fail_msg: HOME34_TEST_RESTORE_WRONG_SOURCE_STORAGE

- name: Require the remote CORE PBS storage to be online from HOME PVE
  ansible.builtin.command:
    argv: [pvesm, status, --storage, "{{ home34_test_storage_id }}"]
  register: home34_test_status
  changed_when: false
  failed_when: >-
    home34_test_status.rc != 0 or
    home34_test_status.stdout is not search((home34_test_storage_id | regex_escape) ~ '\\s+pbs\\s+active')

- name: Read actual backup inventory through HOME PVE and the selected PBS token
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ home34_expected_pve }}/storage/{{ home34_test_storage_id }}/content"
      - --content
      - backup
      - --output-format
      - json
  register: home34_test_backup_list
  changed_when: false

- name: Filter actual CT snapshots from exactly the selected PBS storage
  ansible.builtin.set_fact:
    home34_test_ct_list: >-
      {{ (home34_test_backup_list.stdout | from_json)
         | selectattr('format', 'equalto', 'pbs-ct')
         | selectattr('volid', 'match', '^' ~ (home34_test_storage_id | regex_escape) ~ ':backup/ct/[0-9]+/[0-9TZ:-]+$')
         | list }}
    home34_test_ctid: 99834

- name: Require a verified-origin CT snapshot is available for real recovery
  ansible.builtin.assert:
    that:
      - home34_test_ct_list | length > 0
    fail_msg: HOME34_RESTORE_TEST_NO_CT_BACKUPS_IN_SELECTED_STORAGE

- name: Read fresh media guest boot epoch to prove locally restored backups predate recreate
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ home34_media_vmid }}", --, cat, /proc/stat]
  register: home34_test_media_boot
  changed_when: false
  when: home34_test_is_local

- name: Require actual guest timestamp was returned by QEMU Guest Agent
  ansible.builtin.assert:
    that:
      - home34_test_media_boot.rc == 0
      - (home34_test_media_boot.stdout | from_json).exitcode | int == 0
      - >-
        ((home34_test_media_boot.stdout | from_json)['out-data']
         | regex_findall('(?m)^btime ([0-9]+)$') | length) == 1
    fail_msg: HOME34_LOCAL_PBS_RECREATE_BOOT_EPOCH_NOT_VERIFIED
  when: home34_test_is_local

- name: Limit local recovery source to snapshots created before new VM boot
  ansible.builtin.set_fact:
    home34_test_recreate_boot_epoch: >-
      {{ ((home34_test_media_boot.stdout | from_json)['out-data']
          | regex_findall('(?m)^btime ([0-9]+)$') | first) | int }}
  when: home34_test_is_local

- name: Choose only snapshots from the preserved local PBS before VM recreation
  ansible.builtin.set_fact:
    home34_test_eligible_ct_list: >-
      {{ (home34_test_ct_list
          | selectattr('ctime', 'lt', home34_test_recreate_boot_epoch | int) | list)
         if home34_test_is_local else home34_test_ct_list }}

- name: Require preserved older-than-recreate local PBS CT snapshots
  ansible.builtin.assert:
    that:
      - home34_test_eligible_ct_list | length > 0
    fail_msg: HOME34_LOCAL_PBS_NO_PRE_RECREATE_CT_SNAPSHOT

- name: Select a small and recent eligible CT snapshot without guessing its volid
  ansible.builtin.set_fact:
    home34_test_latest: "{{ (home34_test_eligible_ct_list | map(attribute='ctime') | max) | int }}"

- name: Choose smallest CT backup among snapshots from the last 24h of the source
  ansible.builtin.set_fact:
    home34_test_candidate: >-
      {{ ((home34_test_eligible_ct_list
         | selectattr('ctime', 'ge', (home34_test_latest | int - 86400))
         | list) | sort(attribute='size') | first) }}

- name: Check candidate's original container config directly from selected PBS backup
  ansible.builtin.command:
    argv: [pvesm, extractconfig, "{{ home34_test_candidate.volid }}"]
  register: home34_test_source_config
  changed_when: false

- name: Require a simple container root filesystem without external mount points
  ansible.builtin.assert:
    that:
      - home34_test_source_config.rc == 0
      - home34_test_source_config.stdout is search('(?m)^rootfs:')
      - home34_test_source_config.stdout is not search('(?m)^mp[0-9]+:')
      - home34_test_source_config.stdout is not search('(?m)^hookscript:')
    fail_msg: HOME34_RESTORE_TEST_COMPLEX_SOURCE_SELECT_ANOTHER_CT

- name: Query current PVE CT and VM IDs before allocating a test CT
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
  register: home34_test_resources
  changed_when: false

- name: Read active HOME PVE storages suitable for CT root filesystems
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ home34_expected_pve }}/storage"
      - --content
      - rootdir
      - --output-format
      - json
  register: home34_test_local_stores
  changed_when: false

- name: Choose an active local PVE CT filesystem target
  ansible.builtin.set_fact:
    home34_test_target_options: >-
      {{ (home34_test_local_stores.stdout | from_json)
         | selectattr('storage', 'in', ['local-lvm', 'local-zfs', 'local'])
         | selectattr('active', 'equalto', 1)
         | selectattr('enabled', 'equalto', 1)
         | list }}
    home34_test_existing_vmids: >-
      {{ (home34_test_resources.stdout | from_json)
         | map(attribute='vmid') | map('int') | list }}

- name: Confirm intended local storage has adequate free space
  ansible.builtin.assert:
    that:
      - home34_test_target_options | length > 0
      - >-
        (home34_test_target_options
         | selectattr('avail', 'ge', 4294967296) | list | length) > 0
    fail_msg: HOME34_RESTORE_TEST_ID_OR_LOCAL_SPACE_UNAVAILABLE

- name: Prefer Proxmox's managed local thin storage for disposable CT
  ansible.builtin.set_fact:
    home34_test_target: >-
      {{ (home34_test_target_options
         | selectattr('avail', 'ge', 4294967296)
         | sort(attribute='storage') | first).storage }}

- name: Inspect a reserved CT from an interrupted test without modifying it
  ansible.builtin.command:
    argv: [pct, config, "{{ home34_test_ctid }}"]
  register: home34_test_resume_config
  changed_when: false
  when: home34_test_ctid | int in home34_test_existing_vmids

- name: Check an interrupted test CT is still powered off
  ansible.builtin.command:
    argv: [pct, status, "{{ home34_test_ctid }}"]
  register: home34_test_resume_status
  changed_when: false
  when: home34_test_ctid | int in home34_test_existing_vmids

- name: Refuse to adopt or delete any CT other than the tagged disposable test
  ansible.builtin.assert:
    that:
      - home34_test_resume_config.rc == 0
      - home34_test_resume_status.rc == 0
      - "home34_test_resume_status.stdout | trim == 'status: stopped'"
      - >-
        home34_test_resume_config.stdout is search('(?m)^hostname: dh-restore-test$')
      - >-
        home34_test_resume_config.stdout is search('(?m)^rootfs: ' ~ home34_test_target ~ ':')
      - >-
        home34_test_resume_config.stdout is not search('(?m)^onboot: 1$')
    fail_msg: HOME34_RESTORE_TEST_EXISTING_CT_NOT_OWNED_BY_THIS_TEST
  when: home34_test_ctid | int in home34_test_existing_vmids

- name: Refuse an orphaned existing volume owned by the reserved test CTID
  ansible.builtin.command:
    argv: [pvesm, list, "{{ home34_test_target }}", --vmid, "{{ home34_test_ctid }}"]
  register: home34_test_existing_disks
  changed_when: false

- name: Require test CT has no pre-existing disk and source is reasonably small
  ansible.builtin.assert:
    that:
      - home34_test_existing_disks.rc == 0
      - >-
        (home34_test_ctid | int in home34_test_existing_vmids) or
        (home34_test_existing_disks.stdout_lines | length <= 1)
      - home34_test_candidate.size | int > 0
      - home34_test_candidate.size | int <= 8589934592
    fail_msg: HOME34_RESTORE_TEST_PREEXISTING_DATA_OR_OVERSIZED_BACKUP

- name: Report recovery test plan and safety checks before any restore
  ansible.builtin.debug:
    msg:
      - "HOME34_RESTORE_TEST_ACTION={{ home34_action }}"
      - "HOME34_RESTORE_TEST_STORAGE={{ home34_test_storage_id }}"
      - "HOME34_RESTORE_TEST_SOURCE={{ home34_test_candidate.volid }}"
      - "HOME34_RESTORE_TEST_SNAPSHOT_EPOCH={{ home34_test_candidate.ctime }}"
      - "HOME34_RESTORE_TEST_SOURCE_SIZE_BYTES={{ home34_test_candidate.size }}"
      - "HOME34_RESTORE_TEST_TARGET_STORAGE={{ home34_test_target }}"
      - "HOME34_RESTORE_TEST_TEMP_CTID={{ home34_test_ctid }}"
      - HOME34_RESTORE_TEST_EXISTING_VMS=UNCHANGED
      - "HOME34_RESTORE_TEST_RESUMED={{ home34_test_ctid | int in home34_test_existing_vmids }}"
      - "HOME34_LOCAL_BACKUP_PREDATES_RECREATE={{ (home34_test_candidate.ctime | int) < (home34_test_recreate_boot_epoch | int) if home34_test_is_local else 'NOT_APPLICABLE' }}"
  changed_when: false

- name: Restore and validate a disposable powered-off CT from selected PBS backup
  when: home34_action in ['restore-test', 'local-test']
  block:
    - name: Restore verified CT snapshot to a fresh ID with auto-start disabled
      ansible.builtin.command:
        argv:
          - pct
          - restore
          - "{{ home34_test_ctid }}"
          - "{{ home34_test_candidate.volid }}"
          - --storage
          - "{{ home34_test_target }}"
          - --hostname
          - dh-restore-test
          - --onboot
          - '0'
          - --unique
          - '1'
          - --protection
          - '0'
      register: home34_test_restore
      changed_when: true
      when: home34_test_ctid | int not in home34_test_existing_vmids

    - name: Verify restored CT exists and is powered off
      ansible.builtin.command:
        argv: [pct, status, "{{ home34_test_ctid }}"]
      register: home34_test_post_status
      changed_when: false
      failed_when: >-
        home34_test_post_status.stdout | trim != 'status: stopped'

    - name: Verify the recovered CT root filesystem was registered
      ansible.builtin.command:
        argv: [pct, config, "{{ home34_test_ctid }}"]
      register: home34_test_post_config
      changed_when: false
      failed_when: >-
        home34_test_post_config.rc != 0 or
        home34_test_post_config.stdout is not search('(?m)^rootfs:') or
        home34_test_post_config.stdout is not search('(?m)^hostname: dh-restore-test')

    - name: Mount restored CT filesystem only for read-only content validation
      ansible.builtin.command:
        argv: [pct, mount, "{{ home34_test_ctid }}"]
      register: home34_test_mount
      changed_when: true

    - name: Inspect restored OS identity file without starting the container
      ansible.builtin.stat:
        path: "/var/lib/lxc/{{ home34_test_ctid }}/rootfs/etc/os-release"
        follow: true
      register: home34_test_os_file

    - name: Inspect recovered user database inside the mounted CT rootfs
      ansible.builtin.stat:
        path: "/var/lib/lxc/{{ home34_test_ctid }}/rootfs/etc/passwd"
        follow: false
      register: home34_test_passwd_file

    - name: Require recovered CT contains a real Linux root filesystem
      ansible.builtin.assert:
        that:
          - home34_test_os_file.stat.isreg | default(false)
          - home34_test_os_file.stat.size | int > 0
          - home34_test_passwd_file.stat.isreg | default(false)
          - home34_test_passwd_file.stat.size | int > 0
        fail_msg: HOME34_RESTORE_TEST_OS_FILE_NOT_RECOVERED

  always:
    - name: Unmount disposable test CT if it was mounted
      ansible.builtin.command:
        argv: [pct, unmount, "{{ home34_test_ctid }}"]
      register: home34_test_unmount
      failed_when: false
      changed_when: true
      when: home34_test_mount is defined and home34_test_mount.rc | default(1) == 0

- name: Clear protection inherited from source only on verified disposable test CT
  ansible.builtin.command:
    argv: [pct, set, "{{ home34_test_ctid }}", --protection, '0']
  register: home34_test_clear_protection
  changed_when: true
  when:
    - home34_action in ['restore-test', 'local-test']
    - home34_test_os_file is defined
    - home34_test_os_file.stat.isreg | default(false)
    - home34_test_passwd_file is defined
    - home34_test_passwd_file.stat.isreg | default(false)
    - home34_test_unmount is defined
    - home34_test_unmount.rc == 0

- name: Delete only the exact disposable CT after verified recovery
  ansible.builtin.command:
    argv: [pct, destroy, "{{ home34_test_ctid }}", --purge, '1']
  register: home34_test_delete
  changed_when: true
  when:
    - home34_action == 'restore-test'
    - home34_test_os_file is defined
    - home34_test_os_file.stat.isreg | default(false)
    - home34_test_unmount is defined
    - home34_test_unmount.rc == 0
    - home34_test_clear_protection is defined
    - home34_test_clear_protection.rc == 0

- name: Require clean removal of disposable test container
  ansible.builtin.command:
    argv: [pct, status, "{{ home34_test_ctid }}"]
  register: home34_test_after_delete
  failed_when: false
  changed_when: false
  when: home34_action in ['restore-test', 'local-test']

- name: Report completed recovery test and cleanup
  ansible.builtin.debug:
    msg:
      - HOME34_TEST_RESTORE=SUCCESS
      - "HOME34_TEST_RESTORE_STORAGE={{ home34_test_storage_id }}"
      - "HOME34_TEST_RESTORE_SNAPSHOT_EPOCH={{ home34_test_candidate.ctime }}"
      - "HOME34_TEST_RESTORE_PREDATES_RECREATE={{ (home34_test_candidate.ctime | int) < (home34_test_recreate_boot_epoch | int) if home34_test_is_local else 'NOT_APPLICABLE' }}"
      - "HOME34_TEST_RESTORE_SOURCE={{ home34_test_candidate.volid }}"
      - "HOME34_TEST_RESTORE_TEMP_CTID={{ home34_test_ctid }}"
      - "HOME34_TEST_RESTORE_CONTENT=OS_RELEASE_VERIFIED"
      - HOME34_TEST_RESTORE_STARTED=false
      - "HOME34_TEST_RESTORE_CLEANUP={{ 'COMPLETE' if home34_test_after_delete.rc | default(0) != 0 else 'INCOMPLETE' }}"
      - HOME34_EXISTING_VMS=UNCHANGED
  when: home34_action in ['restore-test', 'local-test']

- name: Fail recovery acceptance if disposable CT still exists after cleanup
  ansible.builtin.assert:
    that:
      - home34_test_delete is defined
      - home34_test_delete.rc == 0
      - home34_test_after_delete.rc != 0
    fail_msg: HOME34_RESTORE_TEST_CLEANUP_REQUIRES_REVIEW
  when: home34_action in ['restore-test', 'local-test']
