---
# Repair is the same idempotent CA setup used by ordinary HOME maintenance,
# followed by an end-to-end mTLS check with the existing DH client certificate.
- name: Require existing HOME identity and connector
  ansible.builtin.assert:
    that:
      - site_id == 'serzhan-home'
      - pve.ipv4 == '192.168.11.220'
      - cf70_tunnel.id == '6a04d9cd-0b17-48f3-8366-9f86ea08cb24'
      - cf70_tunnel.config_src == 'cloudflare'
    fail_msg: HA70_REPAIR_NOT_HOME_TUNNEL

- name: Restore or refresh public Proxmox CA for cloudflared only when necessary
  ansible.builtin.include_tasks: cf70-pve-ca-ensure.yml

- name: Verify existing DH PKCS12 and client-authenticated public HAOS HTTP
  ansible.builtin.include_tasks: cf70-ha-client-verify.yml
