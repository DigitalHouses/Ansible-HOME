---
# The root password comes exclusively from task 05 native Semaphore secrets.
# Task 30 applies it to the Linux root account of this VM (also PBS root@pam).
# This is not the PVE root, Samba owner or Webmin-only credential.
- name: Validate supplied Linux root password for this media VM
  ansible.builtin.assert:
    that:
      - media_root_password is string
      - media_root_password | length >= 8
      - media_root_password | length <= 128
    fail_msg: MEDIA30_ROOT_PASSWORD_INVALID
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Converge only the Linux root password from task 05
  ansible.builtin.user:
    name: root
    password: >-
      {{ media_root_password | password_hash('sha512',
         ((media_site.id ~ ':' ~ (media_spec.vmid | string)) | hash('sha256'))[:16],
         rounds=656000) }}
    update_password: always
    state: present
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Observe Linux root password status after task 05 secret was applied
  ansible.builtin.command:
    argv: [passwd, -S, root]
  register: media30_root_status
  changed_when: false
  when: media_root_password | default('', true) | length > 0
  no_log: true

- name: Require an unlocked Linux root for PBS PAM authentication
  ansible.builtin.assert:
    that:
      - media30_root_status.stdout.split()[1] == 'P'
    fail_msg: MEDIA30_ROOT_PASSWORD_STILL_LOCKED
  when: media_root_password | default('', true) | length > 0
  no_log: true
