---
# Native WebAPI integration across the already installed media applications.
# Existing connections are never rewritten; unknown configurations fail closed.
- name: Require all declared integration applications and shared ZFS root
  ansible.builtin.assert:
    that:
      - media_spec.applications.radarr | bool
      - media_spec.applications.sonarr | bool
      - media_spec.applications.prowlarr | bool
      - media_spec.applications.qbittorrent | bool
      - media_spec.downloads.mode == 'shared-zfs'
      - media_spec.downloads.path == '/' ~ media_spec.storage.media_dataset ~ '/downloads'
    fail_msg: MEDIA80_ARR_WIRING_DECLARATION_INCOMPLETE

- name: Create only approved ZFS download-category destinations
  ansible.builtin.file:
    path: "{{ media_spec.downloads.path }}/complete/{{ item }}"
    owner: qbittorrent
    group: media_group
    mode: '2775'
    state: directory
  loop: "{{ ['movies', 'series', 'prowlarr'] + (['music'] if media_spec.applications.lidarr | default(false) | bool else []) }}"

- name: Read effective native qBittorrent save and incomplete download paths
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/api/v2/app/preferences
    headers:
      Origin: http://127.0.0.1:8080
      Referer: http://127.0.0.1:8080/
    status_code: 200
    return_content: true
    use_proxy: false
  register: media_wire_qbt_preferences
  changed_when: false
  no_log: true

- name: Reject wrong qBittorrent download mount or LAN bypass
  ansible.builtin.assert:
    that:
      - (media_wire_qbt_preferences.json.save_path | regex_replace('/+$', '')) == media_spec.downloads.path
      - (media_wire_qbt_preferences.json.temp_path | regex_replace('/+$', '')) == media_spec.downloads.path ~ '/incomplete'
      - media_wire_qbt_preferences.json.temp_path_enabled | bool
      - media_wire_qbt_preferences.json.bypass_local_auth | bool
      - not media_wire_qbt_preferences.json.bypass_auth_subnet_whitelist_enabled | bool
    fail_msg: MEDIA80_QBT_DOWNLOAD_ROOT_OR_LAN_ACCESS_DRIFT
  no_log: true

- name: Reconcile native qBittorrent categories without changing any torrents
  ansible.builtin.include_tasks: media-qbt-category-one.yml
  loop:
    - {name: radarr, subdir: complete/movies}
    - {name: tv-sonarr, subdir: complete/series}
    - {name: prowlarr, subdir: complete/prowlarr}
    - {name: lidarr, subdir: complete/music}
  when: media_qbt_category_item.name != 'lidarr' or media_spec.applications.lidarr | default(false) | bool
  loop_control:
    loop_var: media_qbt_category_item
    label: "{{ media_qbt_category_item.name }}"
  vars:
    media_qbt_category: >-
      {{ media_qbt_category_item
         | combine({'path': media_spec.downloads.path ~ '/' ~ media_qbt_category_item.subdir}) }}

- name: Read native API keys generated by installed Servarr apps
  ansible.builtin.include_tasks: media-arr-key-one.yml
  loop: "{{ media_active_arr_releases }}"
  loop_control:
    loop_var: media_wire_arr
    label: "{{ media_wire_arr.slug }}"

- name: Reconcile only the missing movie, TV and music ZFS root folders
  ansible.builtin.include_tasks: media-arr-root-one.yml
  loop: "{{ media_active_arr_releases | rejectattr('slug', 'equalto', 'prowlarr') | list }}"
  loop_control:
    loop_var: media_wire_arr_declared
    label: "{{ media_wire_arr_declared.slug }}"
  vars:
    media_wire_arr: >-
      {{ media_wire_arr_declared
         | combine({'path': '/' ~ media_spec.storage.media_dataset ~ '/'
           ~ ('movies' if media_wire_arr_declared.slug == 'radarr' else 'tvshows' if media_wire_arr_declared.slug == 'sonarr' else 'music')}) }}

- name: Configure one qBittorrent provider per selected native Arr application
  ansible.builtin.include_tasks: media-arr-qbt-provider-one.yml
  loop: "{{ media_active_arr_releases }}"
  loop_control:
    loop_var: media_wire_arr
    label: "{{ media_wire_arr.slug }}"

- name: Preserve canonical Plex-compatible names for future Radarr and Sonarr imports
  ansible.builtin.include_tasks: media-arr-naming-one.yml
  loop: "{{ media_active_arr_releases | selectattr('slug', 'in', ['radarr', 'sonarr']) | list }}"
  loop_control:
    loop_var: media_wire_arr
    label: "{{ media_wire_arr.slug }}"

- name: Create only the missing Prowlarr links to Radarr, Sonarr and Lidarr
  ansible.builtin.include_tasks: media-prowlarr-application-one.yml
  loop: "{{ media_active_arr_releases | rejectattr('slug', 'equalto', 'prowlarr') | list }}"
  loop_control:
    loop_var: media_wire_app
    label: "{{ media_wire_app.slug }}"

- name: Add selected public Russian-language indexers using the official Prowlarr API
  ansible.builtin.include_tasks: media-prowlarr-public-indexers.yml
  when: media_spec.prowlarr_public_indexers | default([]) | length > 0

- name: Report completed Arr integration
  ansible.builtin.debug:
    msg: MEDIA80_ARR_INTEGRATION=API_CONFIGURED
