---
- name: Authenticate current owner against native Jellyfin
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/Users/AuthenticateByName
    method: POST
    headers:
      Authorization: 'MediaBrowser Client="DigitalHouses", Device="MediaServer", DeviceId="dh-media31", Version="1.0"'
    body_format: json
    body:
      Username: "{{ media_site.owner_slug }}"
      Pw: "{{ media31_old_password }}"
    status_code: [200, 400, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_jf_old_login
  changed_when: false
  no_log: true

- name: Check whether Jellyfin owner already has the requested password
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/Users/AuthenticateByName
    method: POST
    headers:
      Authorization: 'MediaBrowser Client="DigitalHouses", Device="MediaServer", DeviceId="dh-media31", Version="1.0"'
    body_format: json
    body:
      Username: "{{ media_site.owner_slug }}"
      Pw: "{{ media31_new_password }}"
    status_code: [200, 400, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_jf_new_login
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true

- name: Require native Jellyfin authentication before changing anything
  ansible.builtin.assert:
    that:
      - >-
        (media31_jf_old_login.status == 200 and
         media31_jf_old_login.json.AccessToken | default('') | length >= 16)
        or (media_rotation_mode == 'apply' and
            (media31_jf_new_login.status | default(0)) == 200 and
            media31_jf_new_login.json.AccessToken | default('') | length >= 16)
    fail_msg: MEDIA31_JELLYFIN_OWNER_CREDENTIAL_DRIFT
  no_log: true

- name: Update the managed Jellyfin owner password through native user API
  ansible.builtin.uri:
    url: "http://127.0.0.1:8096/Users/{{ media31_jf_old_login.json.User.Id }}/Password"
    method: POST
    headers:
      Authorization: >-
        MediaBrowser Client="DigitalHouses", Device="MediaServer",
        DeviceId="dh-media31", Version="1.0",
        Token="{{ media31_jf_old_login.json.AccessToken }}"
    body_format: json
    body:
      CurrentPw: "{{ media31_old_password }}"
      NewPw: "{{ media31_new_password }}"
      ResetPassword: false
    status_code: [200, 204]
    use_proxy: false
  when: media_rotation_mode == 'apply' and (media31_jf_new_login.status | default(0)) != 200
  no_log: true

- name: Verify requested Jellyfin password after native change
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/Users/AuthenticateByName
    method: POST
    headers:
      Authorization: 'MediaBrowser Client="DigitalHouses", Device="MediaServer", DeviceId="dh-media31", Version="1.0"'
    body_format: json
    body:
      Username: "{{ media_site.owner_slug }}"
      Pw: "{{ media31_new_password }}"
    status_code: 200
    return_content: true
    use_proxy: false
  register: media31_jf_verified
  retries: 5
  delay: 2
  until: media31_jf_verified.json.AccessToken | default('') | length >= 16
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true
