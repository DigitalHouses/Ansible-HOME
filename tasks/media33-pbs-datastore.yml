---
# Task 33: register only the owner-specific PBS datastore on the exact,
# already mounted ZFS filesystem prepared by media33-pbs-dataset.yml.
# No backup jobs, prune/GC schedule, ACL, tokens, cloud sync or quota changes.
- name: Require the selected datastore matches only the approved PBS dataset
  ansible.builtin.assert:
    that:
      - media33_pbs_dataset == media_spec.storage.pool_name ~ '/pbs-' ~ media_site.owner_slug
      - media33_pbs_path == '/' ~ media33_pbs_dataset
      - media33_pbs_atime_readback.stdout | trim == 'on'
    fail_msg: MEDIA33_PBS_DATASTORE_PATH_MISMATCH

- name: Read configured PBS datastores as structured JSON
  ansible.builtin.command:
    argv: [proxmox-backup-manager, datastore, list, --output-format, json]
  register: media33_pbs_datastores_raw
  changed_when: false

- name: Identify the exact datastore name and any conflicting path
  ansible.builtin.set_fact:
    media33_pbs_configured: >-
      {{ (media33_pbs_datastores_raw.stdout | from_json)
         | selectattr('name', 'equalto', 'pbs-' ~ media_site.owner_slug) | list }}
    media33_pbs_path_owners: >-
      {{ (media33_pbs_datastores_raw.stdout | from_json)
         | selectattr('path', 'equalto', media33_pbs_path) | list }}

- name: Reject a reused datastore name or path pointing elsewhere
  ansible.builtin.assert:
    that:
      - media33_pbs_configured | length <= 1
      - media33_pbs_path_owners | length <= 1
      - >-
        media33_pbs_configured | length == 0 or
        media33_pbs_configured[0].path == media33_pbs_path
      - >-
        media33_pbs_path_owners | length == 0 or
        media33_pbs_path_owners[0].name == 'pbs-' ~ media_site.owner_slug
    fail_msg: MEDIA33_PBS_DATASTORE_CONFLICT

- name: Inspect contents only if the named PBS datastore does not exist yet
  ansible.builtin.find:
    paths: "{{ media33_pbs_path }}"
    file_type: any
    hidden: true
    recurse: false
  register: media33_pbs_initial_contents
  when: media33_pbs_configured | length == 0

- name: Refuse to initialize PBS over unknown existing dataset files
  ansible.builtin.assert:
    that:
      - media33_pbs_initial_contents.matched == 0
    fail_msg: >-
      MEDIA33_PBS_DATASTORE_NONEMPTY: do not overwrite or automatically
      adopt an unregistered datastore; inspect it separately.
  when: media33_pbs_configured | length == 0

- name: Set PBS backup service ownership on the empty mountpoint only
  ansible.builtin.file:
    path: "{{ media33_pbs_path }}"
    state: directory
    owner: backup
    group: backup
    mode: '0755'
    follow: false
  when: media33_pbs_configured | length == 0

- name: Register the PBS datastore on the exact mounted ZFS path once
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - create
      - "pbs-{{ media_site.owner_slug }}"
      - "{{ media33_pbs_path }}"
  when: media33_pbs_configured | length == 0
  changed_when: true

- name: Verify named datastore exists in PBS after registration
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - show
      - "pbs-{{ media_site.owner_slug }}"
      - --output-format
      - json
  register: media33_pbs_datastore_readback
  changed_when: false

- name: Require PBS uses only the intended ZFS path
  ansible.builtin.assert:
    that:
      - media33_pbs_datastore_readback.rc == 0
      - (media33_pbs_datastore_readback.stdout | from_json).path == media33_pbs_path
    fail_msg: MEDIA33_PBS_DATASTORE_READBACK_MISMATCH
