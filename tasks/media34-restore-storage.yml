---
# A dedicated PVE PBS storage for reading CORE copies. No vzdump job targets CORE.
- name: Verify this is the pinned existing HOME PVE
  ansible.builtin.command:
    argv: [hostname, -s]
  register: home34_pve_hostname
  changed_when: false
  failed_when: home34_pve_hostname.stdout | trim != home34_expected_pve

- name: Require CORE-issued read-only restore token and trusted CORE TLS fingerprint
  ansible.builtin.assert:
    that:
      - DH_CORE_PBS_RESTORE_AUTH_ID | default('', true) is match('^[A-Za-z0-9_.-]+@(pbs|pam)![A-Za-z0-9_.-]+$')
      - DH_CORE_PBS_RESTORE_TOKEN_SECRET | default('', true) | length >= 24
      - DH_CORE_PBS_FINGERPRINT | default('', true) | lower is match('^([a-f0-9]{2}:){31}[a-f0-9]{2}$')
      - DH_CORE_PBS_FINGERPRINT | lower == hostvars['home34_pbs'].home34_observed_fingerprint
    fail_msg: HOME34_RESTORE_CREDENTIALS_REQUIRED_FROM_CORE50
  no_log: true

- name: Verify Tailscale routing from HOME PVE to CORE PBS
  ansible.builtin.command:
    argv: [ip, -4, route, get, "{{ home34_core_ip }}"]
  register: home34_pve_route
  changed_when: false

- name: Reject PVE restore storage configured over overlapping LAN
  ansible.builtin.assert:
    that: "'dev tailscale0' in home34_pve_route.stdout"
    fail_msg: HOME34_PVE_RESTORE_ROUTE_NOT_TAILSCALE

- name: Read existing PVE storages
  ansible.builtin.command:
    argv: [pvesh, get, /storage, --output-format, json]
  register: home34_pve_storage_raw
  changed_when: false

- name: Read existing backup jobs to prevent CORE from becoming a backup destination
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/backup, --output-format, json]
  register: home34_pve_backup_jobs
  changed_when: false

- name: Select only the designated restore storage
  ansible.builtin.set_fact:
    home34_restore_storage_id: pbs-core-restore
    home34_pve_existing_restore: >-
      {{ (home34_pve_storage_raw.stdout | from_json)
         | selectattr('storage', 'equalto', 'pbs-core-restore') | list }}

- name: Refuse an existing PVE job targeting CORE or an unrelated restore storage
  ansible.builtin.assert:
    that:
      - home34_pve_existing_restore | length <= 1
      - >-
        (home34_pve_backup_jobs.stdout | from_json)
        | selectattr('storage', 'equalto', 'pbs-core-restore') | list | length == 0
      - >-
        home34_pve_existing_restore | length == 0 or
        (home34_pve_existing_restore[0].type == 'pbs' and
         home34_pve_existing_restore[0].server == home34_core_ip and
         home34_pve_existing_restore[0].datastore == home34_core_store and
         home34_pve_existing_restore[0].namespace == home34_site.id and
         home34_pve_existing_restore[0].username == DH_CORE_PBS_RESTORE_AUTH_ID)
    fail_msg: HOME34_RESTORE_STORAGE_OR_BACKUP_JOB_CONFLICT

- name: Add read-only CORE PBS restore target without a credential in CLI args
  ansible.builtin.command:
    argv:
      - script
      - -q
      - -e
      - -c
      - >-
        pvesm add pbs pbs-core-restore
        --server {{ home34_core_ip }}
        --datastore {{ home34_core_store }}
        --namespace {{ home34_site.id }}
        --username {{ DH_CORE_PBS_RESTORE_AUTH_ID }}
        --fingerprint {{ DH_CORE_PBS_FINGERPRINT | lower }}
        --content backup --password
      - /dev/null
    stdin: "{{ DH_CORE_PBS_RESTORE_TOKEN_SECRET }}"
    stdin_add_newline: true
  when: home34_pve_existing_restore | length == 0
  no_log: true

- name: Verify native PVE storage configuration after adoption or creation
  ansible.builtin.command:
    argv: [pvesh, get, /storage/pbs-core-restore, --output-format, json]
  register: home34_pve_restored_config
  changed_when: false

- name: Require the intended read-only restore namespace and TLS fingerprint
  ansible.builtin.assert:
    that:
      - (home34_pve_restored_config.stdout | from_json).type == 'pbs'
      - (home34_pve_restored_config.stdout | from_json).server == home34_core_ip
      - (home34_pve_restored_config.stdout | from_json).datastore == home34_core_store
      - (home34_pve_restored_config.stdout | from_json).namespace == home34_site.id
      - (home34_pve_restored_config.stdout | from_json).username == DH_CORE_PBS_RESTORE_AUTH_ID
      - (home34_pve_restored_config.stdout | from_json).fingerprint | lower == DH_CORE_PBS_FINGERPRINT | lower
    fail_msg: HOME34_RESTORE_STORAGE_READBACK_CONFLICT
  no_log: true

- name: Check CORE restore-only PBS storage is accessible from HOME PVE
  ansible.builtin.command:
    argv: [pvesm, status, --storage, pbs-core-restore]
  register: home34_pve_restore_status
  changed_when: false

- name: Require online CORE storage for read-only restore operations
  ansible.builtin.assert:
    that:
      - home34_pve_restore_status.rc == 0
      - home34_pve_restore_status.stdout is search('pbs-core-restore\\s+pbs\\s+active')
    fail_msg: HOME34_CORE_RESTORE_STORAGE_NOT_ACTIVE

- name: Report restore-only connection, not an executed VM restore
  ansible.builtin.debug:
    msg:
      - "HOME34_RESTORE_STORAGE=pbs-core-restore NAMESPACE={{ home34_site.id }}"
      - HOME34_BACKUP_JOBS_CHANGED=false
      - HOME34_TEST_RESTORE=NOT_RUN
