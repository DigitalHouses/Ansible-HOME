---
- name: Prepare local media portal document root
  ansible.builtin.file:
    path: /var/www/dh-media-portal
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Publish owner-facing media service directory
  ansible.builtin.template:
    src: "{{ playbook_dir | dirname }}/templates/media-portal.html.j2"
    dest: /var/www/dh-media-portal/index.html
    owner: root
    group: root
    mode: '0644'

- name: Publish DigitalHouses media favicon
  ansible.builtin.copy:
    src: "{{ playbook_dir | dirname }}/templates/media-portal-icon.svg"
    dest: /var/www/dh-media-portal/favicon.svg
    owner: root
    group: root
    mode: '0644'

- name: Install minimal LAN-only nginx virtual host
  ansible.builtin.template:
    src: "{{ playbook_dir | dirname }}/templates/media-portal-nginx.conf.j2"
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  register: media_portal_nginx

- name: Verify nginx syntax before reloading
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false

- name: Enable media homepage on port 80
  ansible.builtin.systemd_service:
    name: nginx.service
    enabled: true
    state: "{{ 'restarted' if media_portal_nginx.changed else 'started' }}"

- name: Verify portal responds with a successful HTML page
  ansible.builtin.uri:
    url: http://127.0.0.1/
    return_content: true
    status_code: 200
  register: media_portal_response
  changed_when: false

- name: Verify published media favicon is served as SVG
  ansible.builtin.uri:
    url: http://127.0.0.1/favicon.svg
    status_code: 200
    return_content: true
  register: media_portal_favicon
  changed_when: false

- name: Require the live portal favicon and protected password instructions
  ansible.builtin.assert:
    that:
      - "'<svg' in media_portal_favicon.content"
      - "'/favicon.svg' in media_portal_response.content"
      - "'qm guest exec' in media_portal_response.content"
      - "'Смена пароля' in media_portal_response.content"
      - "'target=\"_blank\" rel=\"noopener noreferrer\"' in media_portal_response.content"
      - "'Windows' in media_portal_response.content"
      - "'macOS' in media_portal_response.content"
      - "'Documents' in media_portal_response.content"
      - "'https://' ~ media_spec.network.ipv4.split('/')[0] ~ ':10000/' in media_portal_response.content"
      - "'http://' ~ media_spec.network.ipv4.split('/')[0] ~ ':5580/login?url=' in media_portal_response.content"
      - "'https://' ~ media_spec.network.ipv4.split('/')[0] ~ ':8007/' in media_portal_response.content"
      - "'-pve-mediaserver-admin.digitalhouses.vip' not in media_portal_response.content"
    fail_msg: MEDIA30_PORTAL_IDENTITY_OR_CREDENTIAL_GUIDE_MISSING

- name: Verify portal lists every configured application
  ansible.builtin.assert:
    that:
      - "'DigitalHouses' in media_portal_response.content"
      - "'Plex' in media_portal_response.content"
      - not media_spec.applications.jellyfin | default(false) or 'Jellyfin' in media_portal_response.content
      - not media_spec.applications.radarr | default(false) or 'Radarr' in media_portal_response.content
      - not media_spec.applications.sonarr | default(false) or 'Sonarr' in media_portal_response.content
      - not media_spec.applications.lidarr | default(false) or 'Lidarr' in media_portal_response.content
      - not media_spec.applications.prowlarr | default(false) or 'Prowlarr' in media_portal_response.content
      - not media_spec.applications.qbittorrent | default(false) or 'qBittorrent' in media_portal_response.content
      - not media_spec.applications.filestash | default(false) or 'Filestash' in media_portal_response.content
      - not media_spec.applications.sambee | default(false) or 'Sambee' in media_portal_response.content
    fail_msg: MEDIA80_PORTAL_MISSING_SERVICE_LINKS
