---
# Single owner secret, all existing native app APIs. A protected journal permits
# deterministic forward resume after interruption; no password in task logs.
- name: Resolve root-only owner password transaction paths
  ansible.builtin.set_fact:
    media31_creds_dir: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials"
    media31_owner_file: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials/{{ media_site.owner_slug }}.txt"
    media31_request_file: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials/.dh-media-password-request"
    media31_journal_file: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials/.dh-media-password-rotation.json"
    media31_lock_path: "/{{ media_spec.storage.pool_name }}/digitalhouses/credentials/.dh-media-password-rotation.lock"

- name: Require the managed ZFS pool and owner passport
  ansible.builtin.stat:
    path: "{{ media31_owner_file }}"
    follow: false
  register: media31_owner_stat
  no_log: true

- name: Refuse unsafe or uninitialized owner identity
  ansible.builtin.assert:
    that:
      - media31_owner_stat.stat.isreg | default(false)
      - not media31_owner_stat.stat.islnk | default(false)
      - media31_owner_stat.stat.pw_name == 'root'
      - media31_owner_stat.stat.mode in ['0600', '0640']
    fail_msg: MEDIA31_OWNER_PASSPORT_UNSAFE
  no_log: true

- name: Read protected owner passport
  ansible.builtin.slurp:
    src: "{{ media31_owner_file }}"
  register: media31_passport
  no_log: true

- name: Validate protected owner credentials
  ansible.builtin.assert:
    that:
      - (media31_passport.content | b64decode).splitlines() | length == 2
      - (media31_passport.content | b64decode).splitlines()[0] == 'username=' ~ media_site.owner_slug
      - (media31_passport.content | b64decode).splitlines()[1] is match('^password=[A-Za-z0-9]{6,8}$')
    fail_msg: MEDIA31_OWNER_PASSPORT_INVALID
  no_log: true

- name: Inspect protected rotation journal before touching any account
  ansible.builtin.stat:
    path: "{{ media31_journal_file }}"
    follow: false
  register: media31_journal_stat
  no_log: true

- name: Reject foreign or readable transaction state
  ansible.builtin.assert:
    that:
      - not media31_journal_stat.stat.exists or media31_journal_stat.stat.isreg
      - not (media31_journal_stat.stat.islnk | default(false))
      - not media31_journal_stat.stat.exists or media31_journal_stat.stat.pw_name == 'root'
      - not media31_journal_stat.stat.exists or media31_journal_stat.stat.mode == '0600'
      - media_rotation_mode != 'preflight' or not media31_journal_stat.stat.exists
    fail_msg: MEDIA31_ROTATION_PENDING_OR_JOURNAL_UNSAFE
  no_log: true

- name: Reuse committed owner secret for read-only preflight
  ansible.builtin.set_fact:
    media31_old_password: "{{ (media31_passport.content | b64decode).splitlines()[1][9:] }}"
    media31_new_password: "{{ (media31_passport.content | b64decode).splitlines()[1][9:] }}"
  no_log: true
  when: media_rotation_mode == 'preflight'

- name: Acquire exclusive owner rotation lock
  ansible.builtin.command:
    argv: [mkdir, -m, '0700', "{{ media31_lock_path }}"]
  when: media_rotation_mode == 'apply'
  changed_when: true
  no_log: true

- name: Preflight or durably reconcile native owner passwords
  block:
    - name: Read root-owned requested password only for a new transaction
      ansible.builtin.stat:
        path: "{{ media31_request_file }}"
        follow: false
      register: media31_request_stat
      when: media_rotation_mode == 'apply' and not media31_journal_stat.stat.exists
      no_log: true

    - name: Require protected new-password request on first apply
      ansible.builtin.assert:
        that:
          - media31_request_stat.stat.isreg | default(false)
          - not media31_request_stat.stat.islnk | default(false)
          - media31_request_stat.stat.pw_name == 'root'
          - media31_request_stat.stat.mode == '0600'
        fail_msg: MEDIA31_NEW_PASSWORD_REQUEST_REQUIRED
      when: media_rotation_mode == 'apply' and not media31_journal_stat.stat.exists
      no_log: true

    - name: Read protected requested new owner password
      ansible.builtin.slurp:
        src: "{{ media31_request_file }}"
      register: media31_request
      when: media_rotation_mode == 'apply' and not media31_journal_stat.stat.exists
      no_log: true

    - name: Validate new password is distinct and complies with client policy
      ansible.builtin.assert:
        that:
          - (media31_request.content | b64decode).splitlines() | length == 1
          - (media31_request.content | b64decode).splitlines()[0] is match('^password=[A-Za-z0-9]{6,8}$')
          - (media31_request.content | b64decode).splitlines()[0][9:] != (media31_passport.content | b64decode).splitlines()[1][9:]
        fail_msg: MEDIA31_NEW_PASSWORD_INVALID
      when: media_rotation_mode == 'apply' and not media31_journal_stat.stat.exists
      no_log: true

    - name: Create a durable root-only forward-recovery journal before changes
      ansible.builtin.copy:
        dest: "{{ media31_journal_file }}"
        content: >-
          {{ {'schema': 1, 'owner': media_site.owner_slug,
              'old_password': (media31_passport.content | b64decode).splitlines()[1][9:],
              'new_password': (media31_request.content | b64decode).splitlines()[0][9:]}
             | to_json }}
        owner: root
        group: root
        mode: '0600'
        force: false
      when: media_rotation_mode == 'apply' and not media31_journal_stat.stat.exists
      no_log: true

    - name: Read the durable transaction record for initial or resumed operation
      ansible.builtin.slurp:
        src: "{{ media31_journal_file }}"
      register: media31_journal
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Require exact journal schema and known owner
      ansible.builtin.assert:
        that:
          - (media31_journal.content | b64decode | from_json).schema == 1
          - (media31_journal.content | b64decode | from_json).owner == media_site.owner_slug
          - (media31_journal.content | b64decode | from_json).old_password is match('^[A-Za-z0-9]{6,8}$')
          - (media31_journal.content | b64decode | from_json).new_password is match('^[A-Za-z0-9]{6,8}$')
          - (media31_journal.content | b64decode | from_json).old_password != (media31_journal.content | b64decode | from_json).new_password
          - >-
            (media31_passport.content | b64decode).splitlines()[1][9:]
            in [(media31_journal.content | b64decode | from_json).old_password,
                (media31_journal.content | b64decode | from_json).new_password]
        fail_msg: MEDIA31_ROTATION_JOURNAL_INVALID
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Load old and requested password in protected Ansible memory
      ansible.builtin.set_fact:
        media31_old_password: "{{ (media31_journal.content | b64decode | from_json).old_password }}"
        media31_new_password: "{{ (media31_journal.content | b64decode | from_json).new_password }}"
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Verify and reconcile owner SMB password
      ansible.builtin.include_tasks: media31-password-samba.yml

    - name: Verify and reconcile native Jellyfin password
      ansible.builtin.include_tasks: media31-password-jellyfin.yml
      when: media_spec.applications.jellyfin | bool

    - name: Verify and reconcile native Sambee password
      ansible.builtin.include_tasks: media31-password-sambee.yml
      when: media_spec.applications.sambee | bool

    - name: Verify and reconcile Servarr Forms passwords
      ansible.builtin.include_tasks: media31-password-servarr.yml
      loop:
        - {slug: radarr, port: 7878, version: v3}
        - {slug: sonarr, port: 8989, version: v3}
        - {slug: lidarr, port: 8686, version: v1}
        - {slug: prowlarr, port: 9696, version: v1}
      loop_control:
        loop_var: media31_arr
        label: "{{ media31_arr.slug }}"
      when: media_spec.applications[media31_arr.slug] | default(false) | bool

    - name: Verify and reconcile LAN qBittorrent password
      ansible.builtin.include_tasks: media31-password-qbittorrent.yml
      when: media_spec.applications.qbittorrent | bool

    - name: Verify and reconcile protected Filestash administrator password
      ansible.builtin.include_tasks: media31-password-filestash.yml
      when: media_spec.applications.filestash | bool

    - name: Persist the shared owner passport only after all logins are verified
      ansible.builtin.copy:
        dest: "{{ media31_owner_file }}"
        content: "username={{ media_site.owner_slug }}\npassword={{ media31_new_password }}\n"
        owner: root
        group: admin_group
        mode: '0640'
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Delete successfully consumed password request
      ansible.builtin.file:
        path: "{{ media31_request_file }}"
        state: absent
      when: media_rotation_mode == 'apply'
      no_log: true

    - name: Clear recovery journal only after completed owner passport commit
      ansible.builtin.file:
        path: "{{ media31_journal_file }}"
        state: absent
      when: media_rotation_mode == 'apply'
      no_log: true

  rescue:
    - name: Preserve interrupted rotation journal for controlled resume
      ansible.builtin.debug:
        msg: MEDIA31_ROTATION_PAUSED_RESUME_REQUIRED

    - name: Refuse partial password-rotation success
      ansible.builtin.fail:
        msg: MEDIA31_ROTATION_INCOMPLETE
  always:
    - name: Release exclusive rotation lock on normal exit
      ansible.builtin.file:
        path: "{{ media31_lock_path }}"
        state: absent
      when: media_rotation_mode == 'apply'
      no_log: true

- name: Report only nonsecret rotation completion
  ansible.builtin.debug:
    msg: "{{ 'MEDIA31_PREFLIGHT=PASS' if media_rotation_mode == 'preflight' else 'MEDIA31_ROTATION=PASS' }}"
