---
- name: Identify existing HAOS mTLS hostname and origin
  ansible.builtin.set_fact:
    cf70_ha_name: "{{ site_id }}-pve-ha-mtls.{{ cf70_zone_name }}"
    cf70_ha_ip: "{{ pve.ipv4.rsplit('.', 1)[0] ~ '.222' }}"

- name: Select existing HAOS ingress and exact Access application
  ansible.builtin.set_fact:
    cf70_ha_ingress: "{{ cf70_config.json.result.config.ingress | selectattr('hostname','defined') | selectattr('hostname','equalto',cf70_ha_name) | list }}"
    cf70_ha_apps: "{{ cf70_access.json.result | selectattr('domain','defined') | selectattr('domain','equalto',cf70_ha_name) | list }}"

- name: Read current WAF rules for mTLS hostname
  ansible.builtin.uri:
    url: "{{ cf70_api }}/zones/{{ cf70_zone_id }}/rulesets/phases/http_request_firewall_custom/entrypoint"
    headers: "{{ cf70_headers }}"
    use_proxy: false
    status_code: [200, 403, 404]
  register: cf70_ha_waf
  changed_when: false
  no_log: true

- name: Read only HAOS DNS record metadata
  ansible.builtin.uri:
    url: "{{ cf70_api }}/zones/{{ cf70_zone_id }}/dns_records?name={{ cf70_ha_name }}&per_page=100"
    headers: "{{ cf70_headers }}"
    use_proxy: false
    status_code: 200
  register: cf70_ha_dns
  changed_when: false
  no_log: true

- name: Read existing client certificate metadata
  ansible.builtin.uri:
    url: "{{ cf70_api }}/zones/{{ cf70_zone_id }}/client_certificates?per_page=100"
    headers: "{{ cf70_headers }}"
    use_proxy: false
    status_code: [200, 403]
  register: cf70_ha_certs
  changed_when: false
  no_log: true

- name: Report existing HAOS mTLS edge protection
  ansible.builtin.debug:
    msg:
      - "HA70_NAME={{ cf70_ha_name }} TARGET=http://{{ cf70_ha_ip }}:80"
      - "HA70_INGRESS={{ cf70_ha_ingress | map(attribute='service') | list }}"
      - "HA70_DNS={{ cf70_ha_dns.json.result | map(attribute='type') | list }}"
      - "HA70_EXACT_ACCESS={{ cf70_ha_apps | map(attribute='id') | list }}"
      - "HA70_WAF_HTTP={{ cf70_ha_waf.status }} WAF={{ (cf70_ha_waf.json.result.rules | default([])) | map(attribute='expression') | list if cf70_ha_waf.status == 200 else 'UNREADABLE' }}"
      - "HA70_CERT_HTTP={{ cf70_ha_certs.status }} COUNT={{ (cf70_ha_certs.json.result | length) if cf70_ha_certs.status == 200 else 'UNREADABLE' }}"

- name: Read exact HAOS Access application policies
  ansible.builtin.uri:
    url: "{{ cf70_api }}/accounts/{{ cf70_account_id }}/access/apps/{{ cf70_ha_apps[0].id }}/policies"
    headers: "{{ cf70_headers }}"
    use_proxy: false
    status_code: [200, 403]
  register: cf70_ha_access_policies
  changed_when: false
  no_log: true
  when: cf70_ha_apps | length == 1

- name: Report only HAOS host certificate and routing metadata
  ansible.builtin.debug:
    msg:
      - "HA70_TUNNEL={{ cf70_tunnel.id }}"
      - "HA70_DNS_CNAME={{ cf70_ha_dns.json.result | selectattr('type', 'equalto', 'CNAME') | map(attribute='content') | list }}"
      - "HA70_ACCESS_DECISIONS={{ cf70_ha_access_policies.json.result | map(attribute='decision') | list if cf70_ha_access_policies is not skipped and cf70_ha_access_policies.status == 200 else 'UNKNOWN' }}"
      - "HA70_CERT_NAMES={{ cf70_ha_certs.json.result | map(attribute='common_name') | list if cf70_ha_certs.status == 200 else 'UNKNOWN' }}"
      - "HA70_CERT_EXPIRES={{ cf70_ha_certs.json.result | map(attribute='expires_on') | list if cf70_ha_certs.status == 200 else 'UNKNOWN' }}"
      - "HA70_CERT_STATUS={{ cf70_ha_certs.json.result | map(attribute='status') | list if cf70_ha_certs.status == 200 else 'UNKNOWN' }}"

- name: Check former HAOS mTLS client certificate kit on HOME PVE without reading keys
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -i
      - /var/lib/semaphore/.ssh/id_ed25519
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      - -o
      - ConnectTimeout=5
      - "root@{{ pve.ipv4 }}"
      - /bin/sh
      - -c
      - 'test -s /root/digitalhouses/delivery/serzhan-home/for-clients/serzhan-home-standard.p12 && echo CERT_PRESENT || echo CERT_NOT_PRESENT; qm agent 2222 ping >/dev/null 2>&1 && echo HAOS_QGA_READY || echo HAOS_QGA_UNAVAILABLE'
  register: cf70_ha_cert_presence
  changed_when: false

- name: Report mTLS client-kit and HAOS guest agent availability
  ansible.builtin.debug:
    msg: "{{ cf70_ha_cert_presence.stdout_lines }}"

- name: Locate live HAOS configuration from the existing QEMU guest agent
  ansible.builtin.command:
    argv:
      - /usr/bin/ssh
      - -i
      - /var/lib/semaphore/.ssh/id_ed25519
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      - -o
      - ConnectTimeout=5
      - "root@{{ pve.ipv4 }}"
      - >-
        qm guest exec 2222 -- /bin/sh -c 'grep -nE "^(http:|[[:space:]]*use_x_forwarded_for:|[[:space:]]*trusted_proxies:)" /mnt/data/supervisor/homeassistant/configuration.yaml || :; command -v ha || :'
  register: cf70_haos_guest_probe
  changed_when: false
  failed_when: false

- name: Report HAOS QEMU guest exec read-only probe
  ansible.builtin.debug:
    msg: "HA70_QGA_RC={{ cf70_haos_guest_probe.rc }} RESULT={{ cf70_haos_guest_probe.stdout | trim }}"
