---
# Task 08 is solely the DEV integration; Cloudflare is read-only here.
# A site has one Tunnel named owner-object, never a Semaphore-only Tunnel.
- name: Require Cloudflare audit mode and a configured credential
  ansible.builtin.assert:
    that:
      - sem_cf_action == 'audit'
      - sem_cf_token | length > 0
      - sem_cf_tunnel_name == dev_site_id
    fail_msg: "Task 08 Cloudflare supports read-only audit on the site Tunnel"
  no_log: true

- name: Check local Semaphore HTTP is healthy before Cloudflare audit
  ansible.builtin.uri:
    url: http://127.0.0.1/api/ping
    use_proxy: false
    status_code: 200
    return_content: true
  register: sem_origin
  changed_when: false

- name: Require a healthy local Semaphore origin
  ansible.builtin.assert:
    that: sem_origin.content | trim == 'pong'
    fail_msg: "Semaphore HTTP origin is unavailable on local port 80"

- name: Read the exact Cloudflare account zone
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones?name=digitalhouses.vip&per_page=50"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
  register: sem_zone
  changed_when: false
  no_log: true

- name: Require the canonical Cloudflare zone to be accessible
  ansible.builtin.set_fact:
    sem_exact_zones: "{{ sem_zone.json.result | selectattr('name', 'equalto', 'digitalhouses.vip') | list }}"

- name: Refuse an ambiguous Cloudflare account zone
  ansible.builtin.assert:
    that:
      - sem_zone.json.success | bool
      - sem_exact_zones | length == 1

- name: Read the one owner-object site Tunnel
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_exact_zones[0].account.id }}/cfd_tunnel?name={{ sem_cf_tunnel_name }}&per_page=50"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
  register: sem_site_tunnels
  changed_when: false
  no_log: true

- name: Select exactly the shared site Tunnel
  ansible.builtin.set_fact:
    sem_site_tunnel: >-
      {{ sem_site_tunnels.json.result | selectattr('name', 'equalto', sem_cf_tunnel_name)
         | selectattr('deleted_at', 'none') | list }}

- name: Require the active remotely managed site Tunnel
  ansible.builtin.assert:
    that:
      - sem_site_tunnels.json.success | bool
      - sem_site_tunnel | length == 1
      - sem_site_tunnel[0].config_src == 'cloudflare'

- name: Read existing site ingress without modifying routes
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/accounts/{{ sem_exact_zones[0].account.id }}/cfd_tunnel/{{ sem_site_tunnel[0].id }}/configurations"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
  register: sem_site_ingress
  changed_when: false
  no_log: true

- name: Find only the existing Semaphore route
  ansible.builtin.set_fact:
    sem_route_matches: >-
      {{ sem_site_ingress.json.result.config.ingress
         | selectattr('hostname', 'defined')
         | selectattr('hostname', 'equalto', sem_cf_hostname) | list }}

- name: Read the exact Semaphore DNS record
  ansible.builtin.uri:
    url: "{{ sem_cf_api }}/zones/{{ sem_exact_zones[0].id }}/dns_records?name={{ sem_cf_hostname }}&per_page=100"
    headers: "{{ sem_cf_headers }}"
    use_proxy: false
    status_code: 200
  register: sem_site_dns
  changed_when: false
  no_log: true

- name: Report Semaphore route on the shared site Tunnel
  ansible.builtin.debug:
    msg:
      - "SEMAPHORE_CF_MODE=AUDIT_ONLY"
      - "SITE_TUNNEL={{ sem_cf_tunnel_name }}"
      - "SITE_TUNNEL_STATUS={{ sem_site_tunnel[0].status }}"
      - "SEMAPHORE_ROUTE_PRESENT={{ sem_route_matches | length == 1 }}"
      - "SEMAPHORE_ROUTE_ORIGIN={{ sem_route_matches[0].service if sem_route_matches | length == 1 else 'absent' }}"
      - "SEMAPHORE_DNS_TARGET={{ (sem_site_dns.json.result | first | default({})).content | default('absent') }}"
      - "SITE_TUNNEL_UUID={{ sem_site_tunnel[0].id }}"
