---
- name: Authenticate owner with current Sambee password
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/auth/token
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_old_password }}"
    status_code: [200, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_sambee_old
  changed_when: false
  no_log: true

- name: Authenticate owner with candidate Sambee password
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/auth/token
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
    status_code: [200, 401, 403]
    return_content: true
    use_proxy: false
  register: media31_sambee_new
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true

- name: Refuse unknown Sambee owner identity
  ansible.builtin.assert:
    that:
      - >-
        (media31_sambee_old.status == 200 and
         media31_sambee_old.json.access_token | default('') | length >= 16)
        or (media_rotation_mode == 'apply' and
            (media31_sambee_new.status | default(0)) == 200 and
            media31_sambee_new.json.access_token | default('') | length >= 16)
    fail_msg: MEDIA31_SAMBEE_OWNER_CREDENTIAL_DRIFT
  no_log: true

- name: Rotate Sambee owner through the official change-password API
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/auth/change-password
    method: POST
    headers:
      Authorization: "Bearer {{ media31_sambee_old.json.access_token }}"
    body_format: json
    body:
      current_password: "{{ media31_old_password }}"
      new_password: "{{ media31_new_password }}"
    status_code: [200, 204]
    use_proxy: false
  when: media_rotation_mode == 'apply' and (media31_sambee_new.status | default(0)) != 200
  no_log: true

- name: Verify owner Sambee login after rotation
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/auth/token
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_site.owner_slug }}"
      password: "{{ media31_new_password }}"
    status_code: 200
    return_content: true
    use_proxy: false
  register: media31_sambee_verified
  retries: 6
  delay: 2
  until: media31_sambee_verified.json.access_token | default('') | length >= 16
  changed_when: false
  when: media_rotation_mode == 'apply'
  no_log: true
