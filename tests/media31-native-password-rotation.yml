---
- name: Validate native password rotation safety contract without secrets or network
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    task_dir: "{{ playbook_dir }}/../tasks"
    playbook: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/media-password-rotate.yml') | from_yaml }}"
    main_task: "{{ lookup('ansible.builtin.file', task_dir ~ '/media31-password-rotation.yml') | from_yaml }}"
    deployment: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/media-server-deploy.yml') | from_yaml }}"
    adapters:
      - media31-password-samba.yml
      - media31-password-jellyfin.yml
      - media31-password-sambee.yml
      - media31-password-servarr.yml
      - media31-password-qbittorrent.yml
      - media31-password-filestash.yml
  tasks:
    - name: Require separate password playbook and no custom Python modules
      ansible.builtin.assert:
        that:
          - playbook | length == 2
          - playbook[0].hosts == 'runner'
          - playbook[1].hosts == 'media31_guest'
          - "'DH_MEDIA_ROTATION_MODE' in (lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/media-password-rotate.yml'))"
          - "'media_rotation_mode in' in (lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/media-password-rotate.yml'))"
          - "'ansible.builtin.include_tasks' in (lookup('ansible.builtin.file', task_dir ~ '/media31-password-rotation.yml'))"
          - "'/usr/bin/python' not in (lookup('ansible.builtin.file', task_dir ~ '/media31-password-rotation.yml'))"

    - name: Locate required journal, lock, and passport-commit operations
      ansible.builtin.set_fact:
        lock_step: "{{ main_task | selectattr('name', 'equalto', 'Acquire exclusive owner rotation lock') | first }}"
        rotation: "{{ main_task | selectattr('name', 'equalto', 'Preflight or durably reconcile native owner passwords') | first }}"
        app_task_steps: "{{ (deployment | selectattr('hosts', 'equalto', 'media80_guest') | first).tasks }}"

    - name: Require fail-closed journal and last-write-wins owner passport
      ansible.builtin.assert:
        that:
          - lock_step['ansible.builtin.command'].argv[0] == 'mkdir'
          - lock_step.no_log | bool
          - rotation.block | selectattr('name', 'equalto', 'Create a durable root-only forward-recovery journal before changes') | length == 1
          - rotation.block | selectattr('name', 'equalto', 'Persist the shared owner passport only after all logins are verified') | length == 1
          - rotation.block | selectattr('name', 'equalto', 'Clear recovery journal only after completed owner passport commit') | length == 1
          - rotation.rescue | length >= 1
          - rotation.always | length >= 1
          - app_task_steps | selectattr('name', 'equalto', 'Block ordinary media apply while owner-password rotation is pending') | length == 0

    - name: Check that every adapter is native and protects credential-bearing operations
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.uri:' in lookup('ansible.builtin.file', task_dir ~ '/' ~ item) or item == 'media31-password-samba.yml'"
          - "'no_log: true' in lookup('ansible.builtin.file', task_dir ~ '/' ~ item)"
          - "'media_rotation_mode ==' in lookup('ansible.builtin.file', task_dir ~ '/' ~ item)"
          - "'ansible.builtin.script:' not in lookup('ansible.builtin.file', task_dir ~ '/' ~ item)"
          - "'shell:' not in lookup('ansible.builtin.file', task_dir ~ '/' ~ item)"
      loop: "{{ adapters }}"
      loop_control:
        label: "{{ item }}"
