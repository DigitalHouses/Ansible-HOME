---
- name: Verify native HOME task 70 ownership and explicit update defaults
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    task_catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    cf70_src: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/cloudflare-home.yml') }}"
    cf70_route: "{{ lookup('ansible.builtin.file', root ~ '/tasks/cf70-publish-route.yml') }}"
    agents60_src: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/digitalhouses-agents.yml') }}"
    agent_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-agent.yml') }}"
    quantum_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-quantum-managed.yml') }}"
  tasks:
    - name: Require audit-only Cloudflare default and no implicit upgrades
      ansible.builtin.assert:
        that:
          - >-
            (task_catalog.tasks | selectattr('name','equalto','70-Cloudflare') |
             first).survey_vars[0].default_value == 'audit'
          - >-
            (task_catalog.tasks | selectattr('name','equalto','10-Настроить PVE') |
             first).survey_vars | selectattr('name','equalto','DH_PVE_QUANTUM_UPDATE') |
             first | json_query('default_value') == 'no'
          - >-
            (task_catalog.tasks | selectattr('name','equalto','60-DigitalHouses Agents') |
             first).survey_vars | selectattr('name','equalto','DH_AGENTS_UPDATE') |
             first | json_query('default_value') == 'no'

    - name: Ensure selected routes reuse the existing site Tunnel
      ansible.builtin.assert:
        that:
          - "'cf70_tunnel.id' in cf70_route"
          - "'cf70_tunnel.id' in cf70_src"
          - "'CF70_CONCURRENT_TUNNEL_CONFIGURATION_CHANGE' in cf70_route"
          - "'cf70-publish-route.yml' not in cf70_src"
          - "'requested_agent_update' in agent_src"
          - "'requested_agent_update' in agents60_src"
          - "'requested_quantum_update' in quantum_src"
