---
- name: Preserve Cloudflare's default config and every existing route
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    initial_config:
      ingress:
        - service: http_status:404
      warp-routing: {enabled: false}
    saved_config:
      ingress:
        - hostname: serzhan-home-pve.digitalhouses.vip
          service: https://192.168.11.220:8006
        - hostname: serzhan-home-pve-filebrowser.digitalhouses.vip
          service: http://192.168.11.220:8090
        - hostname: serzhan-home-router.digitalhouses.vip
          service: http://192.168.11.1
        - hostname: serzhan-home-pve-ha-mtls.digitalhouses.vip
          service: http://192.168.11.33:80
        - service: http_status:404
      warp-routing: {enabled: false}
    desired_pve:
      hostname: serzhan-home-pve.digitalhouses.vip
      service: https://192.168.11.220:8006
      originRequest: {caPool: /etc/cloudflared/dh-pve-ca.pem, noTLSVerify: false}
    desired_quantum:
      hostname: serzhan-home-pve-filebrowser.digitalhouses.vip
      service: http://192.168.11.220:8090
  tasks:
    - name: Preserve original foreign routes while changing managed PVE routes
      ansible.builtin.set_fact:
        foreign_ingress: >-
          {{ saved_config.ingress | selectattr('hostname', 'defined')
             | rejectattr('hostname', 'in', [desired_pve.hostname,
                                            desired_quantum.hostname]) | list }}

    - name: Reconstruct ingress and preserve other tunnel configuration
      ansible.builtin.set_fact:
        new_config: >-
          {{ saved_config | combine({'ingress': [desired_pve, desired_quantum]
             + foreign_ingress + [{'service': 'http_status:404'}]}) }}

    - name: Confirm no existing site application or setting was lost
      ansible.builtin.assert:
        that:
          - new_config.ingress | length == saved_config.ingress | length
          - new_config.ingress[0].originRequest.noTLSVerify is sameas false
          - new_config.ingress[2:] == saved_config.ingress[2:]
          - new_config['warp-routing'] == saved_config['warp-routing']
          - >-
            initial_config.ingress in [[], [{'service': 'http_status:404'}]]
