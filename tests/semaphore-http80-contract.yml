---
# Offline regression: one native Semaphore HTTP 80 and public Cloudflare HTTPS.
- name: Verify the minimal Semaphore HTTP80 contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sem_bootstrap: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../bootstrap/runner.yml') }}"
    sem_dev: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/configure-dev-semaphore.yml') }}"
    sem_catalog: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/update-task-catalog.yml') }}"
    sem_credentials: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/obtain-site-credentials.yml') }}"
    cf70_admin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/cf70-admin-actions.yml') }}"
    sem_dev_curl: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../bootstrap/tasks/dev-access.yml') }}"
  tasks:
    - name: Require native HTTP80 bootstrap and no self-signed certificate
      ansible.builtin.assert:
        that:
          - sem_bootstrap is search('port:.*:80')
          - "'AmbientCapabilities=CAP_NET_BIND_SERVICE' in sem_bootstrap"
          - "'enabled: false' in sem_bootstrap"
          - sem_bootstrap is search('web_host:')
          - "'port: 3000' not in sem_bootstrap"
          - "'/etc/semaphore/tls.crt' not in sem_bootstrap"

    - name: Require task 00, 05 and 08 to use the same local API
      ansible.builtin.assert:
        that:
          - "'http://127.0.0.1/api' in sem_catalog"
          - "'http://127.0.0.1/api' in sem_credentials"
          - "'http://127.0.0.1/api' in sem_dev"
          - sem_dev is search('dev_api_url:.*http://')
          - "'dev_transfer_cert' not in sem_dev"
          - "'dev_cert_path' not in sem_dev"

    - name: Require token-only DEV HTTP configuration without CA bundle
      ansible.builtin.assert:
        that:
          - sem_dev_curl is search('proto.*=http')
          - "'cacert =' not in sem_dev_curl"

    - name: Require Cloudflare publication only in task 70
      ansible.builtin.assert:
        that:
          - "'DH_SEMAPHORE_CF_ACTION' not in sem_dev"
          - "'semaphore-cloudflare.yml' not in sem_dev"
          - "'-pve-semaphore.' in cf70_admin"
          - "'/api/ping' in cf70_admin"
          - "'cf70-publish-route.yml' in cf70_admin"
