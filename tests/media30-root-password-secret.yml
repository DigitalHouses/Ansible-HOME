---
- name: Validate media VM root credential integration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base: "{{ playbook_dir | dirname }}"
    catalog: "{{ lookup('ansible.builtin.file', base ~ '/catalog/tasks.yml') | from_yaml }}"
    source: "{{ lookup('ansible.builtin.file', base ~ '/playbooks/obtain-site-credentials.yml') | from_yaml }}"
    deploy: "{{ lookup('ansible.builtin.file', base ~ '/playbooks/media-server-deploy.yml') | from_yaml }}"
    root_tasks: "{{ lookup('ansible.builtin.file', base ~ '/tasks/media30-root-password.yml') | from_yaml }}"
  tasks:
    - name: Find credential input and root update
      ansible.builtin.set_fact:
        survey: "{{ catalog.tasks | selectattr('name', 'equalto', '05-Ввести и проверить credentials') | first }}"
        media_survey: "{{ catalog.tasks | selectattr('name', 'equalto', '30-Медиасервер') | first }}"
        root_apply: "{{ root_tasks | selectattr('name', 'equalto', 'Converge only the Linux root password from task 05') | first }}"

    - name: Assert secret intake, native user module and no plaintext output
      ansible.builtin.assert:
        that:
          - >-
            survey.survey_vars | selectattr('name', 'equalto', 'DH_INPUT_MEDIA_ROOT_PASSWORD')
            | selectattr('type', 'equalto', 'secret') | list | length == 1
          - "'DH_MEDIA_ROOT_PASSWORD' in source[0].vars.secret_names"
          - "'DH_MEDIA_ROOT_PASSWORD' in source[0].vars.provided"
          - >-
            media_survey.survey_vars | selectattr('name', 'equalto', 'DH_MEDIA_ROOT_PASSWORD_ON_RUN')
            | list | length == 0
          - "'DH_MEDIA_ROOT_PASSWORD' in deploy[0].vars.media_root_password"
          - "'DH_MEDIA_ROOT_PASSWORD_ON_RUN' not in deploy[0].vars.media_root_password"
          - >-
            source[0].tasks | selectattr('name', 'equalto',
              'Validate the media VM Linux root password before saving it') | list | length == 1
          - >-
            deploy[0].tasks | selectattr('name', 'equalto',
              'Require stored task 05 Linux root password before VM create/recreate')
            | list | length == 1
          - root_apply['ansible.builtin.user'].name == 'root'
          - root_apply['ansible.builtin.user'].update_password == 'always'
          - root_apply['ansible.builtin.user'].password is search('password_hash')
          - root_apply.no_log | bool
          - root_apply.when is search('media_root_password')
          - >-
            root_tasks | selectattr('name', 'equalto',
              'Require an unlocked Linux root for PBS PAM authentication') | list | length == 1
