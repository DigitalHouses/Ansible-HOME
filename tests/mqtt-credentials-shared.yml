---
- name: Confirm task 05 is the sole MQTT endpoint and credentials source
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    credentials_src: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/obtain-site-credentials.yml') }}"
    agents_src: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/digitalhouses-agents.yml') }}"
    media_agent_src: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media-native-plex-agent.yml') }}"
    pve_agent_tasks: "{{ lookup('ansible.builtin.file', root ~ '/tasks/pve-agent.yml') | from_yaml }}"
    media_vm: {name: mediaserver-test}
    media_mqtt_host: 192.168.22.33
    media_mqtt_username: testuser
    media_mqtt_password: test-password
    requested_mqtt_host: "{{ media_mqtt_host }}"
    requested_mqtt_user: "{{ media_mqtt_username }}"
    requested_mqtt_password: "{{ media_mqtt_password }}"
    media_rendered: "{{ lookup('ansible.builtin.template', root ~ '/templates/digitalhouses-plex-agent.conf.j2') }}"
    pve_rendered: "{{ lookup('ansible.builtin.template', root ~ '/templates/pve-agent.conf.j2') }}"
    task05: >-
      {{ catalog.tasks | selectattr('name', 'equalto',
         '05-Ввести и проверить credentials') | first }}
  tasks:
    - name: Verify task 05 already exposes all three MQTT values
      ansible.builtin.assert:
        that:
          - "'DH_INPUT_MQTT_BROKER_HOST' in (task05.survey_vars | map(attribute='name') | list)"
          - "'DH_INPUT_MQTT_USERNAME' in (task05.survey_vars | map(attribute='name') | list)"
          - "'DH_INPUT_MQTT_PASSWORD' in (task05.survey_vars | map(attribute='name') | list)"
          - "'DH_MQTT_BROKER_HOST' in agents_src"
          - "'requested_mqtt_host' in agents_src"
          - "'media_mqtt_host' in agents_src"
          - "'media_spec.plex_agent.mqtt' not in media_agent_src"
      no_log: true

    - name: Verify both agents receive the exact same customer MQTT settings
      ansible.builtin.assert:
        that:
          - "'host = 192.168.22.33' in media_rendered"
          - "'port = 1883' in media_rendered"
          - "'username = testuser' in media_rendered"
          - "'password = test-password' in media_rendered"
          - "'host = 192.168.22.33' in pve_rendered"
          - "'port = 1883' in pve_rendered"
          - "'username = testuser' in pve_rendered"
          - "'password = test-password' in pve_rendered"
          - "'192.168.11.233' not in media_rendered"
          - "'192.168.11.233' not in pve_rendered"
      no_log: true

    - name: Verify existing PVE Agent is updated without replacing other settings
      ansible.builtin.assert:
        that:
          - >-
            (pve_agent_tasks | selectattr('name', 'equalto',
             'Reconcile only existing PVE Agent MQTT settings from task 05')
             | first)['ansible.builtin.lineinfile'].path
            == '/etc/digitalhouses_pve_agent/digitalhouses_pve_agent.conf'
          - >-
            (pve_agent_tasks | selectattr('name', 'equalto',
             'Reconcile only existing PVE Agent MQTT settings from task 05')
             | first).loop | map(attribute='key') | list
            == ['host', 'username', 'password']
          - >-
            (pve_agent_tasks | selectattr('name', 'equalto',
             'Confirm agent is enabled and started')
             | first)['ansible.builtin.systemd_service'].state
            is search('restarted')
