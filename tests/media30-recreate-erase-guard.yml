---
# Survey disk action is authoritative. Test the two minimal native paths.
- name: Verify disk choices execute independently and erase never targets guest root
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deploy: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../playbooks/media-server-deploy.yml') }}"
    vm_apply: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/media-vm-apply.yml') }}"
    zfs_apply: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/media-zfs-apply.yml') | from_yaml }}"
    zfs_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/media-zfs-apply.yml') }}"
  tasks:
    - name: Require VM lifecycle and verified image before explicit recreate
      ansible.builtin.assert:
        that:
          - "'media_vm_action in [' in deploy"
          - "'media_disk_action in [' in deploy"
          - "'media30-recreate-preflight.yml' not in deploy"
          - deploy.find('media30-image-prestage.yml') < deploy.find('media-vm-apply.yml')
          - "'cloud.debian.org' not in vm_apply"
          - "'media30_image_sha512_preflight' in vm_apply"

    - name: Check import uses native ZFS only and never chooses a disk to erase
      ansible.builtin.assert:
        that:
          - >-
            (zfs_apply | selectattr('name', 'equalto',
             'Import the requested existing ZFS pool without touching disk contents')
             | first).when[0] == "media_raw_disk_action == 'import'"
          - "'zpool' in zfs_source"
          - "'import_pool_guid' not in zfs_source"
          - "'media_import_scan' not in zfs_source"
          - "'MEDIA30_IMPORT_EXPECTED_POOL_NOT_FOUND' not in zfs_source"
          - "'media_sata_pci_vendor' not in zfs_source"

    - name: Check erase uses only the explicitly selected physical SATA disk
      ansible.builtin.assert:
        that:
          - "'MEDIA_ERASE_REQUIRES_ONE_SATA_DISK' in zfs_source"
          - "'MEDIA_ERASE_SYSTEM_DISK_REFUSED' in zfs_source"
          - >-
            (zfs_apply | selectattr('name', 'equalto',
             'Create a fresh ZFS pool on the selected SATA disk')
             | first).when == "media_raw_disk_action == 'erase'"
          - >-
            (zfs_apply | selectattr('name', 'equalto',
             'Erase the selected SATA disk partition table')
             | first).when == "media_raw_disk_action == 'erase'"
          - "'wipefs' in zfs_source"
          - "'sgdisk' in zfs_source"
          - "'zpool, destroy' in zfs_source"

    - name: Simulate one SATA drive plus one virtual root disk
      ansible.builtin.set_fact:
        physical_sata_disks: >-
          {{ [{'path': '/dev/sda', 'type': 'disk', 'tran': 'sata'},
              {'path': '/dev/sdb', 'type': 'disk', 'tran': ''}]
             | selectattr('type', 'equalto', 'disk')
             | selectattr('tran', 'equalto', 'sata')
             | map(attribute='path') | list }}

    - name: Confirm only the SATA disk may be erased
      ansible.builtin.assert:
        that:
          - physical_sata_disks == ['/dev/sda']
          - "'/dev/sda' not in ['/dev/mapper/root', '/dev/sdb']"
