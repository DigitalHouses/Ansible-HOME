---
# Native Ansible regression: Prowlarr masks API keys and omits values on optional fields.
- name: Verify safe Prowlarr readback and native application test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    expected:
      prowlarrUrl: http://127.0.0.1:9696
      baseUrl: http://127.0.0.1:7878
      apiKey: fixture-secret
    link:
      - name: DigitalHouses Radarr
        implementation: Radarr
        fields:
          - {name: prowlarrUrl, value: 'http://127.0.0.1:9696'}
          - {name: baseUrl, value: 'http://127.0.0.1:7878'}
          - {name: apiKey, value: '********'}
          - {name: authUsername}
          - {name: authPassword}
  tasks:
    - name: Inspect actual native Prowlarr readback and test tasks
      ansible.builtin.set_fact:
        papp_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/media-prowlarr-application-one.yml') | from_yaml }}"

    - name: Select source tasks without inspecting protected values
      ansible.builtin.set_fact:
        papp_readback_task: >-
          {{ papp_tasks
             | selectattr('name', 'equalto',
                 'Read existing Prowlarr link field values without printing API keys')
             | first }}
        papp_test_task: >-
          {{ papp_tasks
             | selectattr('name', 'equalto',
                 'Test persisted Prowlarr application connection without changing credentials')
             | first }}

    - name: Require native sparse readback and side-effect-free connection test
      ansible.builtin.assert:
        that:
          - "'selectattr' in papp_readback_task['ansible.builtin.set_fact'].media_wire_papp_existing_fields"
          - "'defined' in papp_readback_task['ansible.builtin.set_fact'].media_wire_papp_existing_fields"
          - papp_readback_task.no_log | bool
          - papp_test_task['ansible.builtin.uri'].method == 'POST'
          - papp_test_task.changed_when == false
          - papp_test_task.no_log | bool

    - name: Reconcile sparse native provider values with a masked secret
      ansible.builtin.set_fact:
        actual: >-
          {{ link[0].fields | selectattr('value', 'defined')
             | items2dict(key_name='name', value_name='value') }}
      no_log: true

    - name: Require public values to match and secret to remain protected
      ansible.builtin.assert:
        that:
          - item.key in actual
          - >-
            (item.key == 'apiKey' and actual[item.key] in ['********', item.value])
            or (item.key != 'apiKey' and actual[item.key] == item.value)
      loop: "{{ expected | dict2items }}"
      no_log: true

    - name: Ensure optional fields with no value are omitted
      ansible.builtin.assert:
        that:
          - "'authUsername' not in actual"
          - "'authPassword' not in actual"
      no_log: true
