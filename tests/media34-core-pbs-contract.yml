---
- name: Verify HOME PBS native Push and restore-only contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir | dirname }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    pb: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/media34-core-pbs.yml') | from_yaml }}"
    prepare: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media34-push-prepare.yml') | from_yaml }}"
    restore: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media34-restore-storage.yml') | from_yaml }}"
    recovery_test: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media34-test-restore.yml') | from_yaml }}"
    creds: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/obtain-site-credentials.yml') | from_yaml }}"
    entries: "{{ catalog.tasks | selectattr('name', 'equalto', '34-HOME PBS для CORE') | list }}"
    entry05: "{{ catalog.tasks | selectattr('name', 'equalto', '05-Ввести и проверить credentials') | list }}"
  tasks:
    - name: Require safe default action and no legacy CORE Pull token action
      ansible.builtin.assert:
        that:
          - entries | length == 1
          - entries[0].playbook == 'playbooks/media34-core-pbs.yml'
          - entries[0].survey_vars[0].default_value == 'audit'
          - entries[0].survey_vars[0]['values'] | map(attribute='value') | list == ['audit','prepare','push','restore-storage','restore-check','restore-test','local-check','local-test']
          - entries[0].survey_vars[0]['values'][0].name is search('01.*Проверить')
          - entries[0].survey_vars[0]['values'][1].name is search('02.*НЕ отправлять')
          - entries[0].survey_vars[0]['values'][2].name is search('03.*ОТПРАВИТЬ')
          - entries[0].survey_vars[0]['values'][3].name is search('04.*восстановления')
          - entries[0].survey_vars[0]['values'][4].name is search('05.*Проверить')
          - entries[0].survey_vars[0]['values'][5].name is search('06.*RESTORE')
          - entries[0].survey_vars[0]['values'][6].name is search('07.*локального PBS')
          - entries[0].survey_vars[0]['values'][7].name is search('08.*ВОССТАНОВИТЬ')
          - entries[0].survey_vars[0].default_value == 'audit'
          - pb | length == 3
          - "'DH_CORE_PBS_PUSH_TOKEN_SECRET' in (creds | to_json)"
          - "'DH_CORE_PBS_RESTORE_TOKEN_SECRET' in (creds | to_json)"
          - "'DH_INPUT_CORE_PBS_FINGERPRINT' in (entry05[0].survey_vars | to_json)"
          - "'media34-core-pull-token.yml' not in (pb | to_json)"
          - "'core-pull' not in (pb | to_json)"
          - "'100.97.126.67' in (pb | to_json)"
          - "'pbs-core' in (pb | to_json)"

    - name: Require matching source/target, explicit direction and disabled deletion
      ansible.builtin.assert:
        that:
          - prepare | to_json is search('api2/json/config/remote')
          - prepare | to_json is search('ansible.builtin.env')
          - prepare | to_json is search('DH_CORE_PBS_PUSH_AUTH_ID')
          - prepare | to_json is search('DH_CORE_PBS_FINGERPRINT')
          - restore | to_json is search('ansible.builtin.env')
          - restore | to_json is search('DH_CORE_PBS_RESTORE_AUTH_ID')
          - prepare | to_json is search('api2/json/config/sync')
          - prepare | to_json is search('PBSAuthCookie')
          - prepare | to_json is search('sync-direction')
          - prepare | to_json is search('push')
          - prepare | to_json is search('remove-vanished')
          - prepare | to_json is search('HOME34_PUSH_EXECUTED=false')
          - prepare | to_json is not search('schedule:.*02:')
          - pb | to_json is search('sync-job')
          - restore | to_json is search('pbs-core-restore')
          - restore | to_json is search('BACKUP_JOBS_CHANGED=false')
          - restore | to_json is search('script')
          - restore | to_json is not search('vzdump')

    - name: Require test Restore to use fresh disposable stopped CT without modifying backups
      ansible.builtin.assert:
        that:
          - pb | to_json is search('media34-test-restore.yml')
          - recovery_test | to_json is search('pbs-core-restore')
          - recovery_test | to_json is search('pct')
          - recovery_test | to_json is search('restore')
          - recovery_test | to_json is search('99834')
          - recovery_test | to_json is search('pct.*destroy')
          - recovery_test | to_json is search('pct.*mount')
          - recovery_test | to_json is search('pct.*unmount')
          - recovery_test | to_json is search('OS_RELEASE_VERIFIED')
          - recovery_test | to_json is not search('pct, start')
          - recovery_test | to_json is not search('vzdump')

    - name: Require local PBS source is pinned and backups predate recreated media guest boot
      ansible.builtin.assert:
        that:
          - "'local-check' in (pb | to_json)"
          - "'local-test' in (pb | to_json)"
          - "'home34_local_storage' in (pb | to_json)"
          - "'home34_local_pbs_ip' in (pb | to_json)"
          - "'home34_test_is_local' in (recovery_test | to_json)"
          - "'home34_test_expected_host' in (recovery_test | to_json)"
          - "'home34_test_recreate_boot_epoch' in (recovery_test | to_json)"
          - "'HOME34_LOCAL_PBS_NO_PRE_RECREATE_CT_SNAPSHOT' in (recovery_test | to_json)"
          - "'HOME34_LOCAL_BACKUP_PREDATES_RECREATE' in (recovery_test | to_json)"
          - "'HOME34_TEST_RESTORE_PREDATES_RECREATE' in (recovery_test | to_json)"
          - "'protection' in (recovery_test | to_json)"
          - "'pct' in (recovery_test | to_json)"
