---
# HOME 34: native PBS Push Sync to CORE through Tailscale + restore-only PVE storage.
# No CORE modifications, no changes to existing HOME PVE backups, ZFS or local PBS datastore.
- name: "34 | Resolve the approved HOME PBS and PVE"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    home34_action: "{{ DH_PBS_CORE_ACTION | default('audit', true) }}"
    home34_site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    home34_profile: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile', errors='ignore') | default('home', true) | trim }}"
  tasks:
    - name: Require HOME identity, explicit action and existing site inventory credential
      ansible.builtin.assert:
        that:
          - home34_profile == 'home'
          - home34_site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - home34_action in ['audit', 'prepare', 'push', 'restore-storage', 'restore-check', 'restore-test']
          - DH_GITHUB_PROVISION_TOKEN | default('', true) | length > 0
          - pve.node | length > 0
          - pve.ipv4 is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
        fail_msg: HOME34_INVALID_SITE_OR_ACTION
      no_log: true

    - name: Read canonical site and media guest inventories
      ansible.builtin.uri:
        url: "https://api.github.com/repos/DigitalHouses/site-{{ home34_site_id }}/contents/inventories/{{ home34_site_id }}/{{ item }}?ref=main"
        headers:
          Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
          Accept: application/vnd.github+json
        use_proxy: false
        status_code: 200
      loop: [site.yml, media_vm.yml]
      register: home34_inventory
      changed_when: false
      no_log: true

    - name: Decode exact HOME site and PBS-hosting guest
      ansible.builtin.set_fact:
        home34_site: "{{ (home34_inventory.results[0].json.content | b64decode | from_yaml).site }}"
        home34_media: "{{ (home34_inventory.results[1].json.content | b64decode | from_yaml).media_vm }}"
      no_log: true

    - name: Refuse mismatched site, unknown guest or source storage
      ansible.builtin.assert:
        that:
          - home34_site.id == home34_site_id
          - home34_media.name == 'mediaserver-' ~ home34_site.owner_slug
          - home34_media.storage.pool_name == home34_site.owner_slug ~ '-pool'
          - home34_media.network.ipv4 is match('^[0-9]+(\\.[0-9]+){3}/24$')
          - home34_media.vmid | int > 0
        fail_msg: HOME34_SITE_PBS_INVENTORY_CONFLICT

    - name: Require existing pinned SSH for the PBS guest
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/media80_known_hosts
        follow: false
      register: home34_pin

    - name: Refuse untrusted PBS SSH
      ansible.builtin.assert:
        that:
          - home34_pin.stat.isreg | default(false)
          - home34_pin.stat.mode == '0600'
          - home34_pin.stat.pw_name == 'semaphore'
        fail_msg: HOME34_PINNED_PBS_SSH_REQUIRED

    - name: Register exactly the approved HOME PBS guest
      ansible.builtin.add_host:
        name: home34_pbs
        groups: home34_pbs_hosts
        ansible_host: "{{ home34_media.network.ipv4.split('/')[0] }}"
        ansible_connection: ssh
        ansible_user: debian
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/media80_known_hosts
          -o ConnectTimeout=10
        home34_site: "{{ home34_site }}"
        home34_media: "{{ home34_media }}"
        home34_action: "{{ home34_action }}"
        home34_store: "pbs-{{ home34_site.owner_slug }}"
        home34_remote: "core-{{ home34_site_id }}"
        home34_job: "push-{{ home34_site_id }}"
        home34_core_ip: 100.97.126.67
        home34_core_store: pbs-core
      changed_when: false
      no_log: true

    - name: Register existing HOME PVE only for explicit restore operations
      ansible.builtin.add_host:
        name: home34_pve
        groups: home34_pve_hosts
        ansible_host: "{{ pve.ipv4 }}"
        ansible_connection: ssh
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
          -o ConnectTimeout=10
        home34_site: "{{ home34_site }}"
        home34_action: "{{ home34_action }}"
        home34_expected_pve: "{{ pve.node }}"
        home34_core_ip: 100.97.126.67
        home34_core_store: pbs-core
      when: home34_action in ['restore-storage', 'restore-check', 'restore-test']
      changed_when: false
      no_log: true

- name: "34 | Audit source PBS and optionally configure/run Push Sync"
  hosts: home34_pbs_hosts
  gather_facts: false
  become: true
  tasks:
    - name: Require exactly the approved running PBS media guest
      ansible.builtin.command:
        argv: [hostname, -s]
      register: home34_hostname
      changed_when: false
      failed_when: home34_hostname.stdout | trim != home34_media.name

    - name: Read configured PBS source datastore
      ansible.builtin.command:
        argv: [proxmox-backup-manager, datastore, show, "{{ home34_store }}", --output-format, json]
      register: home34_source
      changed_when: false

    - name: Require the existing exact HOME PBS ZFS datastore path
      ansible.builtin.assert:
        that: (home34_source.stdout | from_json).path == '/' ~ home34_media.storage.pool_name ~ '/' ~ home34_store
        fail_msg: HOME34_LOCAL_DATASTORE_CHANGED

    - name: Verify Tailscale is connected without changing its configuration
      ansible.builtin.command:
        argv: [tailscale, status, --json]
      register: home34_ts
      changed_when: false

    - name: Require joined HOME PBS and effective safe Tailscale settings
      ansible.builtin.assert:
        that: (home34_ts.stdout | from_json).BackendState == 'Running'
        fail_msg: HOME34_TAILSCALE_NOT_RUNNING

    - name: Check only the transport route toward CORE PBS
      ansible.builtin.command:
        argv: [ip, -4, route, get, "{{ home34_core_ip }}"]
      register: home34_route
      changed_when: false

    - name: Require private Tailscale interface rather than same-LAN shortcut
      ansible.builtin.assert:
        that: "'dev tailscale0' in home34_route.stdout"
        fail_msg: HOME34_CORE_ROUTE_NOT_TAILSCALE

    - name: Read CORE PBS HTTPS certificate fingerprint over Tailscale
      ansible.builtin.shell: >-
        set -o pipefail;
        openssl s_client -connect {{ home34_core_ip }}:8007 -showcerts </dev/null 2>/dev/null
        | openssl x509 -noout -fingerprint -sha256
      args:
        executable: /bin/bash
      register: home34_core_cert
      changed_when: false

    - name: Extract observed CORE TLS SHA256 without mistaking it for trusted configuration
      ansible.builtin.set_fact:
        home34_observed_fingerprint: "{{ home34_core_cert.stdout.split('=')[-1] | trim | lower }}"

    - name: Require CORE TLS certificate is readable
      ansible.builtin.assert:
        that: home34_observed_fingerprint is match('^([a-f0-9]{2}:){31}[a-f0-9]{2}$')
        fail_msg: HOME34_CORE_TLS_FINGERPRINT_UNREADABLE

    - name: List existing HOME PBS remotes
      ansible.builtin.command:
        argv: [proxmox-backup-manager, remote, list, --output-format, json]
      register: home34_remotes_raw
      changed_when: false
      no_log: true

    - name: List existing HOME PBS sync jobs without changing them
      ansible.builtin.command:
        argv: [proxmox-backup-manager, sync-job, list, --sync-direction, all, --output-format, json]
      register: home34_jobs_raw
      changed_when: false

    - name: Identify only this HOME's managed Remote and Push job
      ansible.builtin.set_fact:
        home34_existing_remote: >-
          {{ (home34_remotes_raw.stdout | from_json)
             | selectattr('name', 'equalto', home34_remote) | list }}
        home34_existing_job: >-
          {{ (home34_jobs_raw.stdout | from_json)
             | selectattr('id', 'equalto', home34_job) | list }}
      no_log: true

    - name: Refuse a conflicting existing CORE Remote or sync job
      ansible.builtin.assert:
        that:
          - home34_existing_remote | length <= 1
          - home34_existing_job | length <= 1
          - >-
            home34_existing_remote | length == 0 or
            (home34_existing_remote[0].host == home34_core_ip and
             home34_existing_remote[0]['auth-id'] | length > 0 and
             home34_existing_remote[0].fingerprint | lower == home34_observed_fingerprint)
          - >-
            home34_existing_job | length == 0 or
            (home34_existing_job[0].store == home34_store and
             home34_existing_job[0].remote == home34_remote and
             home34_existing_job[0]['remote-store'] == home34_core_store and
             home34_existing_job[0]['remote-ns'] == home34_site.id and
             home34_existing_job[0]['sync-direction'] == 'push' and
             not home34_existing_job[0]['remove-vanished'] | default(false) | bool)
        fail_msg: HOME34_EXISTING_REMOTE_OR_SYNC_CONFLICT

    - name: Report HOME PBS preflight without creating jobs or sending backups
      ansible.builtin.debug:
        msg:
          - "HOME34_ACTION={{ home34_action }}"
          - "HOME34_PBS={{ home34_hostname.stdout | trim }} STORE={{ home34_store }}"
          - "HOME34_ROUTE={{ home34_route.stdout | trim }}"
          - "HOME34_CORE_CERT_OBSERVED={{ home34_observed_fingerprint }}"
          - "HOME34_REMOTE_EXISTS={{ home34_existing_remote | length == 1 }}"
          - "HOME34_PUSH_JOB_EXISTS={{ home34_existing_job | length == 1 }}"
          - "HOME34_NO_PVE_BACKUP_JOB_CHANGES=true"

    - name: Configure only this HOME native Push Remote and manual sync job
      ansible.builtin.include_tasks: ../tasks/media34-push-prepare.yml
      when: home34_action == 'prepare'

    - name: Require existing configured Push job before any transfer
      ansible.builtin.assert:
        that:
          - home34_existing_remote | length == 1
          - home34_existing_job | length == 1
        fail_msg: HOME34_PREPARE_REMOTE_AND_PUSH_JOB_FIRST
      when: home34_action == 'push'

    - name: Manually execute only the existing HOME-owned native Push job
      ansible.builtin.command:
        argv: [proxmox-backup-manager, sync-job, run, "{{ home34_job }}"]
      register: home34_push_run
      changed_when: true
      when: home34_action == 'push'

    - name: Report native Push request result, not remote Restore acceptance
      ansible.builtin.debug:
        msg:
          - "HOME34_PUSH={{ home34_job }} REQUESTED=true"
          - "HOME34_PUSH_RC={{ home34_push_run.rc }}"
          - "HOME34_PUSH_OUTPUT={{ home34_push_run.stdout_lines | default([]) | last | default('') }}"
      when: home34_action == 'push'

- name: "34 | Configure a CORE restore-only PVE storage when explicitly requested"
  hosts: home34_pve_hosts
  gather_facts: false
  tasks:
    - name: Register a second PBS source for recovery without touching backup jobs
      ansible.builtin.include_tasks: ../tasks/media34-restore-storage.yml
      when: home34_action == 'restore-storage'

    - name: Audit or test a disposable CORE-to-HOME container restore
      ansible.builtin.include_tasks: ../tasks/media34-test-restore.yml
      when: home34_action in ['restore-check', 'restore-test']
