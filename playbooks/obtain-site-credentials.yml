---
# One operator task: store only submitted fields in Semaphore's native Variable
# Group and verify credentials supported without custom Python or insecure TLS.
- name: 05 - Obtain and verify site credentials
  hosts: runner
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    sem_api: http://127.0.0.1/api
    site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    provided:
      DH_PVE_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_ROOT_PASSWORD') }}"
      DH_MEDIA_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MEDIA_ROOT_PASSWORD') }}"
      DH_GITHUB_PROVISION_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_GITHUB_PROVISION_TOKEN') }}"
      DH_CLOUDFLARE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_API_TOKEN') }}"
      DH_MQTT_BROKER_HOST: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_BROKER_HOST') }}"
      DH_MQTT_USERNAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_USERNAME') }}"
      DH_MQTT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_PASSWORD') }}"
      DH_PBS_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PBS_ADMIN_PASSWORD') }}"
      DH_B2_KEY_ID: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_KEY_ID') }}"
      DH_B2_APPLICATION_KEY: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_APPLICATION_KEY') }}"
      DH_PVE_SNMP_COMMUNITY: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_SNMP_COMMUNITY') }}"
      DH_PVE_SNMP_USERNAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_SNMP_USERNAME') }}"
      DH_PVE_SNMP_AUTH_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_SNMP_AUTH_PASSWORD') }}"
      DH_PVE_SNMP_PRIV_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_SNMP_PRIV_PASSWORD') }}"
    secret_names:
      - DH_PVE_ROOT_PASSWORD
      - DH_MEDIA_ROOT_PASSWORD
      - DH_GITHUB_PROVISION_TOKEN
      - DH_CLOUDFLARE_API_TOKEN
      - DH_MQTT_PASSWORD
      - DH_PBS_ADMIN_PASSWORD
      - DH_B2_KEY_ID
      - DH_B2_APPLICATION_KEY
      - DH_PVE_SNMP_COMMUNITY
      - DH_PVE_SNMP_AUTH_PASSWORD
      - DH_PVE_SNMP_PRIV_PASSWORD
  tasks:
    - name: Select only supplied nonempty values
      ansible.builtin.set_fact:
        supplied: "{{ provided | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"
      no_log: true

    - name: Validate the media VM Linux root password before saving it
      ansible.builtin.assert:
        that:
          - supplied.DH_MEDIA_ROOT_PASSWORD | length >= 8
          - supplied.DH_MEDIA_ROOT_PASSWORD | length <= 128
        fail_msg: MEDIA05_ROOT_PASSWORD_INVALID
      when: "'DH_MEDIA_ROOT_PASSWORD' in supplied"
      no_log: true

    - name: Update native Semaphore Variable Group when fields were supplied
      when: supplied | length > 0
      block:
        - name: Read existing local catalog API token
          ansible.builtin.slurp:
            src: /etc/semaphore/catalog-token
          register: token_file
          no_log: true

        - name: Find the current site project
          ansible.builtin.uri:
            url: "{{ sem_api }}/projects"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            use_proxy: false
            status_code: 200
          register: projects
          no_log: true

        - name: Select the site project
          ansible.builtin.set_fact:
            matches: "{{ projects.json | selectattr('name', 'equalto', site_id) | list }}"
          no_log: true

        - name: Require exactly one site project
          ansible.builtin.assert:
            that: matches | length == 1
            fail_msg: Current site project not found

        - name: Read the current project's Variable Groups
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment?sort=name&order=asc"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            use_proxy: false
            status_code: 200
          register: sem_groups
          no_log: true

        - name: Select the bootstrap Variable Group
          ansible.builtin.set_fact:
            native_groups: "{{ sem_groups.json | selectattr('name', 'equalto', 'Empty') | list }}"
          no_log: true

        - name: Require exactly one bootstrap Variable Group
          ansible.builtin.assert:
            that: native_groups | length == 1
            fail_msg: Missing native Semaphore Variable Group

        - name: Load the native Variable Group
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment/{{ native_groups[0].id }}"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            use_proxy: false
            status_code: 200
          register: group_info
          no_log: true

        - name: Preserve existing values and prepare submitted updates
          ansible.builtin.set_fact:
            existing_env: "{{ group_info.json.env | from_json }}"
            secret_ops: []
          no_log: true

        - name: Prepare only submitted native secret upserts
          ansible.builtin.set_fact:
            secret_ops: >-
              {{ secret_ops + [
                {'name': item, 'type': 'var',
                 'secret': supplied[item],
                 'operation': 'update' if current | length else 'create'}
                 | combine({'id': current[0].id} if current | length else {})
              ] }}
          vars:
            current: "{{ group_info.json.secrets | default([]) | selectattr('name', 'equalto', item) | list }}"
          loop: "{{ secret_names }}"
          when: item in supplied
          no_log: true

        - name: Merge only submitted nonsecret MQTT settings
          ansible.builtin.set_fact:
            updated_env: >-
              {{ existing_env
                 | combine({'DH_MQTT_BROKER_HOST': supplied.DH_MQTT_BROKER_HOST}
                           if 'DH_MQTT_BROKER_HOST' in supplied else {})
                 | combine({'DH_MQTT_USERNAME': supplied.DH_MQTT_USERNAME}
                           if 'DH_MQTT_USERNAME' in supplied else {})
                 | combine({'DH_PVE_SNMP_USERNAME': supplied.DH_PVE_SNMP_USERNAME}
                           if 'DH_PVE_SNMP_USERNAME' in supplied else {}) }}
          no_log: true

        - name: Save submitted credentials without clearing other fields
          ansible.builtin.uri:
            url: "{{ sem_api }}/project/{{ matches[0].id }}/environment/{{ native_groups[0].id }}"
            method: PUT
            body_format: json
            body:
              id: "{{ native_groups[0].id }}"
              project_id: "{{ matches[0].id }}"
              name: Empty
              json: "{{ group_info.json.json }}"
              env: "{{ updated_env | to_json }}"
              secrets: "{{ secret_ops }}"
            headers:
              Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
            use_proxy: false
            status_code: [200, 204]
          no_log: true

    - name: Select submitted or previously stored PVE password
      ansible.builtin.set_fact:
        pve_password: "{{ supplied.DH_PVE_ROOT_PASSWORD | default(DH_PVE_ROOT_PASSWORD | default(''), true) }}"
        pve_ready: false
        login_data: {}
      no_log: true

    - name: Authenticate root to PVE with verified CA and stdin-only curl config
      ansible.builtin.command:
        argv: [/usr/bin/curl, --config, "-"]
        stdin: |
          silent
          show-error
          fail-with-body
          cacert = "{{ pve.ca_file }}"
          url = "https://{{ pve.ipv4 }}:8006/api2/json/access/ticket"
          request = "POST"
          header = "Content-Type: application/x-www-form-urlencoded"
          data = "username=root%40pam&password={{ pve_password | urlencode }}"
      register: pve_login
      changed_when: false
      failed_when: false
      when: pve_password | length > 0
      no_log: true

    - name: Decode successful PVE login
      ansible.builtin.set_fact:
        login_data: "{{ pve_login.stdout | from_json }}"
      when: pve_login is not skipped and pve_login.rc == 0
      no_log: true

    - name: Verify access to the expected PVE node
      ansible.builtin.command:
        argv: [/usr/bin/curl, --config, "-"]
        stdin: |
          silent
          show-error
          fail-with-body
          cacert = "{{ pve.ca_file }}"
          url = "https://{{ pve.ipv4 }}:8006/api2/json/nodes"
          header = "Cookie: PVEAuthCookie={{ login_data.data.ticket }}"
      register: pve_nodes
      changed_when: false
      failed_when: false
      when: (login_data.data | default({})).ticket | default('') | length > 0
      no_log: true

    - name: Confirm that the actual PVE node is accessible
      ansible.builtin.set_fact:
        pve_ready: >-
          {{ (pve_nodes.stdout | from_json).data
             | selectattr('node', 'equalto', pve.node) | list | length > 0 }}
      when: pve_nodes is not skipped and pve_nodes.rc == 0
      no_log: true

    - name: Select submitted or previously stored cloud credentials
      ansible.builtin.set_fact:
        github_token: "{{ supplied.DH_GITHUB_PROVISION_TOKEN | default(DH_GITHUB_PROVISION_TOKEN | default(''), true) }}"
        cloudflare_token: "{{ supplied.DH_CLOUDFLARE_API_TOKEN | default(DH_CLOUDFLARE_API_TOKEN | default(''), true) }}"
        github_status: NOT_CONFIGURED
        cloudflare_status: NOT_CONFIGURED
      no_log: true

    - name: Verify GitHub token identity without provisioning a repository
      ansible.builtin.uri:
        url: https://api.github.com/user
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: application/vnd.github+json
        return_content: true
        status_code: [200, 401, 403]
        timeout: 12
        use_proxy: false
      register: github_result
      failed_when: false
      changed_when: false
      when: github_token | length > 0
      no_log: true

    - name: Record GitHub verification status
      ansible.builtin.set_fact:
        github_status: >-
          {{ 'VERIFIED_TOKEN' if
             (github_result.status | default(0) == 200 and
              github_result.json.login | default('') == 'DigitalHouses')
             else 'UNVERIFIED' }}
      when: github_result is not skipped
      no_log: true

    - name: Verify Cloudflare API token without modifying DNS or tunnels
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/user/tokens/verify
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      register: cloudflare_result
      failed_when: false
      changed_when: false
      when: cloudflare_token | length > 0
      no_log: true

    - name: Record Cloudflare token verification status
      ansible.builtin.set_fact:
        cloudflare_status: >-
          {{ 'VERIFIED_TOKEN_SCOPE_UNVERIFIED' if
             (cloudflare_result.status | default(0) == 200
              and (cloudflare_result.json | default({})).get('success', false)
              and ((cloudflare_result.json | default({})).get('result')
                   | default({}, true)).get('status') == 'active')
             else 'UNVERIFIED' }}
      when: cloudflare_result is not skipped
      no_log: true

    - name: Verify Cloudflare zone read scope without making changes
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/zones?name=digitalhouses.vip&per_page=50
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      register: cf_zone_probe
      failed_when: false
      changed_when: false
      when: cloudflare_status == 'VERIFIED_TOKEN_SCOPE_UNVERIFIED'
      no_log: true

    - name: Identify exactly one canonical Cloudflare zone
      ansible.builtin.set_fact:
        cf_zone_matches: >-
          {{ cf_zone_probe.json.result | default([])
             | selectattr('name', 'equalto', 'digitalhouses.vip') | list }}
      when:
        - cf_zone_probe.status | default(0) == 200
        - cf_zone_probe.json.success | default(false)
      no_log: true

    - name: Probe Cloudflare DNS Tunnel and Access read permissions
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_token }}"
        return_content: true
        status_code: [200, 400, 401, 403, 429]
        timeout: 12
        use_proxy: false
      loop:
        - name: dns
          url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_matches[0].id }}/dns_records?per_page=1"
        - name: tunnel
          url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_zone_matches[0].account.id }}/cfd_tunnel?per_page=1"
        - name: access
          url: "https://api.cloudflare.com/client/v4/accounts/{{ cf_zone_matches[0].account.id }}/access/apps?per_page=1"
      register: cf_read_scopes
      failed_when: false
      changed_when: false
      when:
        - cf_zone_matches | default([]) | length == 1
        - cf_zone_matches[0].id is match('^[a-f0-9]{32}$')
        - cf_zone_matches[0].account.id is match('^[a-f0-9]{32}$')
      no_log: true

    - name: Summarize Cloudflare read scopes without reporting API objects
      ansible.builtin.set_fact:
        cf_scope_report: >-
          {{ dict(
            (cf_read_scopes.results | default([]))
            | map(attribute='item.name')
            | zip((cf_read_scopes.results | default([]))
                  | map(attribute='status', default=0))
            ) }}
      when:
        - cf_read_scopes.results | default([]) | length == 3
      no_log: true

    - name: Report credential readiness without printing values
      ansible.builtin.debug:
        msg:
          - "PVE={{ 'VERIFIED' if pve_ready else 'NOT_READY' }}"
          - "GitHub={{ github_status }}"
          - "Cloudflare={{ cloudflare_status }}"
          - "Cloudflare_HTTP={{ cloudflare_result.status | default('NOT_RUN') }}"
          - "Cloudflare_Zone_Read_HTTP={{ cf_zone_probe.status | default('NOT_RUN') }}"
          - "Cloudflare_Zone_Exact={{ cf_zone_matches | default([]) | length == 1 }}"
          - "Cloudflare_DNS_Read_HTTP={{ (cf_scope_report | default({})).get('dns', 'NOT_RUN') }}"
          - "Cloudflare_Tunnel_Read_HTTP={{ (cf_scope_report | default({})).get('tunnel', 'NOT_RUN') }}"
          - "Cloudflare_Access_Read_HTTP={{ (cf_scope_report | default({})).get('access', 'NOT_RUN') }}"
          - "Cloudflare_Write_Scope=UNVERIFIED"
          - "MQTT/PBS/B2: service authentication not yet verified"
          - "UPS SNMP: credentials saved if supplied; connectivity checked by task 10"

    - name: Require verified PVE root access before infrastructure tasks
      ansible.builtin.assert:
        that: pve_ready
        fail_msg: "PVE credential is missing or cannot authenticate to the expected node. Check task 05 input."
