---
# 33 | rclone, restic, PBS and owner-specific PBS dataset on an existing VM; no VM/disk lifecycle.
- name: "33 | Resolve canonical media site and pinned guest access"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    media_site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    media_github_base: "https://api.github.com/repos/DigitalHouses/site-{{ media_site_id }}/contents/inventories/{{ media_site_id }}"
  tasks:
    - name: Require declared site and GitHub provisioning credential
      ansible.builtin.assert:
        that:
          - media_site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - DH_GITHUB_PROVISION_TOKEN | default('', true) | length > 0
        fail_msg: MEDIA33_SITE_OR_CREDENTIAL_INVALID
      no_log: true

    - name: Read canonical media site declaration
      ansible.builtin.uri:
        url: "{{ media_github_base }}/site.yml?ref=main"
        headers:
          Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
          Accept: application/vnd.github+json
        use_proxy: false
        status_code: 200
      register: media33_site_json
      changed_when: false
      no_log: true

    - name: Read canonical media VM declaration
      ansible.builtin.uri:
        url: "{{ media_github_base }}/media_vm.yml?ref=main"
        headers:
          Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
          Accept: application/vnd.github+json
        use_proxy: false
        status_code: 200
      register: media33_vm_json
      changed_when: false
      no_log: true

    - name: Decode exact media site and VM settings
      ansible.builtin.set_fact:
        media_site: "{{ (media33_site_json.json.content | b64decode | from_yaml).site }}"
        media_spec: "{{ (media33_vm_json.json.content | b64decode | from_yaml).media_vm }}"
      no_log: true

    - name: Reject mismatched canonical existing VM declaration
      ansible.builtin.assert:
        that:
          - media_site.id == media_site_id
          - media_site.owner_slug is match('^[a-z][a-z0-9-]*$')
          - media_spec.name == 'mediaserver-' ~ media_site.owner_slug
          - media_spec.network.ipv4 is match('^[0-9]+(\\.[0-9]+){3}/24$')
          - media_spec.vmid | int >= 100
          - media_spec.storage.pool_name == media_site.owner_slug ~ '-pool'
        fail_msg: MEDIA33_SITE_GUEST_MISMATCH

    - name: Verify existing known-hosts trust anchor from task 30
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/media80_known_hosts
        follow: false
      register: media33_guest_pin

    - name: Reject untrusted or mis-owned guest pin
      ansible.builtin.assert:
        that:
          - media33_guest_pin.stat.isreg | default(false)
          - media33_guest_pin.stat.pw_name == 'semaphore'
          - media33_guest_pin.stat.mode == '0600'
        fail_msg: MEDIA33_PINNED_MEDIA_GUEST_REQUIRED

    - name: Register only the authenticated existing Debian media guest
      ansible.builtin.add_host:
        name: media33_guest
        groups: media33_existing_guest
        ansible_host: "{{ media_spec.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_connection: ssh
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/media80_known_hosts
        media_site: "{{ media_site }}"
        media_spec: "{{ media_spec }}"
      changed_when: false
      no_log: true

    - name: Register site PVE with the pinned Semaphore SSH identity
      ansible.builtin.add_host:
        name: media33_pve
        groups: media33_existing_pve
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
          -o ConnectTimeout=10
        media_site: "{{ media_site }}"
        media_spec: "{{ media_spec }}"
      changed_when: false
      no_log: true

- name: "33 | Install backup tools and prepare named PBS ZFS dataset without backup jobs"
  hosts: media33_existing_guest
  gather_facts: false
  become: true
  tasks:
    - name: Verify existing VM hostname before changes
      ansible.builtin.command:
        argv: [hostname, -s]
      register: media33_hostname
      changed_when: false
      failed_when: media33_hostname.stdout | trim != media_spec.name

    - name: Verify managed media owner already exists
      ansible.builtin.command:
        argv: [id, "-u", "{{ media_site.owner_slug }}"]
      changed_when: false

    - name: Require existing media portal and SMB group
      ansible.builtin.stat:
        path: /var/www/dh-media-portal/index.html
      register: media33_portal_stat

    - name: Reject uncommissioned media guest
      ansible.builtin.assert:
        that:
          - media33_portal_stat.stat.isreg | default(false)
        fail_msg: MEDIA33_EXISTING_MEDIA_PORTAL_REQUIRED

    - name: Install only official rclone and its protected GUI service
      ansible.builtin.include_tasks: ../tasks/media30-rclone-apply.yml

    - name: Install only the official restic 0.19.1 executable
      ansible.builtin.include_tasks: ../tasks/media33-restic-apply.yml

    - name: Install native Proxmox Backup Server 4.2 or newer
      ansible.builtin.include_tasks: ../tasks/media30-pbs-apply.yml

    - name: Prepare the owner-specific PBS ZFS filesystem on the existing media pool
      ansible.builtin.include_tasks: ../tasks/media33-pbs-dataset.yml

    - name: Register the owner-specific PBS datastore on the prepared ZFS dataset
      ansible.builtin.include_tasks: ../tasks/media33-pbs-datastore.yml

    - name: Prepare restricted local PVE API token in PBS
      ansible.builtin.include_tasks: ../tasks/media33-pbs-pve-token.yml

    - name: Configure dedicated noninteractive PBS file client identity
      ansible.builtin.include_tasks: ../tasks/media33-pbs-file-client.yml

    - name: Schedule 30 daily restores points with daily prune and weekly GC and verify
      ansible.builtin.include_tasks: ../tasks/media33-pbs-maintenance.yml

    - name: Update only the existing static media portal page
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/media-portal.html.j2"
        dest: /var/www/dh-media-portal/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Verify upstream rclone version without changing state
      ansible.builtin.command:
        argv: [rclone, version]
      register: media33_rclone_version
      changed_when: false
      failed_when: not media33_rclone_version.stdout.startswith('rclone v1.76.0')

    - name: Verify Web GUI systemd is active and enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, --, dh-rclone-gui.service]
      register: media33_service_enabled
      changed_when: false
      failed_when: media33_service_enabled.stdout | trim != 'enabled'

    - name: Report the LAN-only GUI URL and protected password location
      ansible.builtin.debug:
        msg:
          status: MEDIA33_LOCAL_PBS_DATASTORE_READY
          rclone_version: v1.76.0
          restic_version: 0.19.1
          pbs_version: "{{ media_pbs_version.stdout | trim }}"
          pbs_zfs_dataset: "{{ media33_pbs_dataset }}"
          pbs_mountpoint: "{{ media33_pbs_path }}"
          pbs_datastore: "pbs-{{ media_site.owner_slug }}"
          pve_storage: "pbs-{{ media_site.owner_slug }}"
          pbs_url: "https://{{ media_spec.network.ipv4.split('/')[0] }}:8007/"
          gui: "http://{{ media_spec.network.ipv4.split('/')[0] }}:5580/"
          api: "http://{{ media_spec.network.ipv4.split('/')[0] }}:5572/"
          password_file: /etc/digitalhouses/rclone-gui.env

- name: "33 | Register owner-local PBS Backup Storage on its own PVE"
  hosts: media33_existing_pve
  gather_facts: false
  become: false
  tasks:
    - name: Attach registered PBS datastore to PVE with restricted API token
      ansible.builtin.include_tasks: ../tasks/media33-pve-pbs-storage.yml

    - name: Schedule daily PVE backups excluding the PBS hosting VM
      ansible.builtin.include_tasks: ../tasks/media33-pve-daily-backup.yml

    - name: Report ready local PBS backup and restore target
      ansible.builtin.debug:
        msg:
          status: MEDIA33_LOCAL_PBS_SCHEDULE_READY
          pve_storage: "pbs-{{ media_site.owner_slug }}"
          datastore: "pbs-{{ media_site.owner_slug }}"
          pbs_server: "{{ media_spec.network.ipv4.split('/')[0] }}:8007"
          backup_job: "dh-local-pbs-{{ media_site.owner_slug }}"
          backup_schedule: '02:00'
          keep_daily: 30
          prune_schedule: '04:00'
          gc_schedule: 'sat 06:00'
          verify_schedule: 'sun 07:00'
