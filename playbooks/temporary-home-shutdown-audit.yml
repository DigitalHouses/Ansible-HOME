---
- name: Connect to HOME PVE for read-only audit
  hosts: runner
  connection: local
  gather_facts: false
  vars_files: [/etc/digitalhouses/pve.yml]
  tasks:
    - ansible.builtin.add_host:
        name: audit_pve
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      changed_when: false
- name: Read HOME shutdown evidence
  hosts: audit_pve
  gather_facts: false
  tasks:
    - ansible.builtin.shell: |
        echo '=== FSD SOURCE / POLICY SERVICES ==='
        systemctl list-units --all --no-pager | grep -Ei 'ups|nut|power' | head -50
        echo '=== UPS POLICY LOGS ==='
        for boot in -2 -1; do journalctl -b "$boot" --since '2026-11-25 19:45:00' --no-pager -o short-iso | grep -Ei 'dh-pve-ups|ups-policy|battery.*threshold|upsmon -c|runtime.*threshold|power.fail|low battery' | head -100; done
        echo '=== POLICY CONFIG PATHS ==='
        find /etc/digitalhouses /opt/digitalhouses/dh_pve_app -maxdepth 3 -type f \( -iname '*ups*' -o -iname '*policy*' \) 2>/dev/null | head -50
        echo '=== POLICY CODE ==='
        grep -RInE --include='*.py' --include='*.sh' --include='dh-pve-ups-policy*' 'upsmon.*fsd|battery_charge_threshold|battery_runtime_threshold|shutdown_threshold|shutdown_on_battery' /opt/digitalhouses/dh_pve_app 2>/dev/null | cut -c1-400 | head -60
        echo '=== CURRENT HAOS ==='
        qm status 2222
        timeout 10 qm guest cmd 2222 network-get-interfaces
        curl -sS -m 5 -o /dev/null -w 'HA HTTP %{http_code}\n' http://192.168.11.222:8123/
      register: audit
      changed_when: false
      failed_when: false
    - ansible.builtin.debug:
        msg: "{{ audit.stdout_lines }}"
