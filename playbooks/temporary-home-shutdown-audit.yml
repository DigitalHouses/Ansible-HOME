---
- name: Connect to HOME PVE for read-only audit
  hosts: runner
  connection: local
  gather_facts: false
  vars_files: [/etc/digitalhouses/pve.yml]
  tasks:
    - ansible.builtin.add_host:
        name: audit_pve
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
      changed_when: false
- name: Read HOME shutdown evidence
  hosts: audit_pve
  gather_facts: false
  tasks:
    - ansible.builtin.shell: |
        echo '=== FIRST SHUTDOWN: NUT, AGENT, POWER EVENTS ==='
        journalctl -b -2 --since '2026-11-25 19:20:00' --no-pager -o short-iso | grep -Ei 'upsmon|nut-|FSD|LOWBATT|on battery|on line|battery|power key|power button|shutdown|digitalhouses_pve_agent' | grep -vE 'systemd\[1\]: (Stopped|Stopping|Reached|Removed|Closed|Deactivated|Unmounted)' | tail -100
        echo '=== SECOND SHUTDOWN: NUT AND AGENT ==='
        journalctl -b -1 --no-pager -o short-iso | grep -Ei 'upsmon|FSD|LOWBATT|on battery|digitalhouses_pve_agent|upssched' | tail -70
        echo '=== UPS POLICY ==='
        grep -hE '^(NOTIFYCMD|NOTIFYFLAG|SHUTDOWNCMD|POWERDOWNFLAG|FINALDELAY|HOSTSYNC|MINSUPPLIES|DEADTIME|AT |CMDSCRIPT|PIPEFN|LOCKFN)' /etc/nut/upsmon.conf /etc/nut/upssched.conf 2>/dev/null || true
        echo '=== UPS STATUS ==='
        for ups in $(upsc -l 127.0.0.1 2>/dev/null); do upsc "$ups@127.0.0.1" 2>/dev/null | grep -E '^(ups.status|ups.load|battery.charge|battery.runtime|battery.charge.low|battery.runtime.low|input.voltage):'; done
        echo '=== HAOS ==='
        qm status 2222
        qm guest cmd 2222 ping
        curl -sS -m 5 -o /dev/null -w 'HA HTTP %{http_code}\n' http://192.168.11.222:8123/
      register: audit
      changed_when: false
      failed_when: false
    - ansible.builtin.debug:
        msg: "{{ audit.stdout_lines }}"
