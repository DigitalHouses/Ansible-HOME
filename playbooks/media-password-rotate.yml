---
# 31 | Dedicated native media-password rotation. No Python helpers.
# Apply requires a root-owned 0600 request already staged on the ZFS guest.
# Never pass the new password as Semaphore survey text or command-line argv.
- name: "31 | Resolve protected media site"
  hosts: runner
  connection: local
  gather_facts: false
  vars:
    media_rotation_mode: "{{ DH_MEDIA_ROTATION_MODE | default('preflight', true) }}"
    media_rotation_site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    media_rotation_repo: "https://api.github.com/repos/DigitalHouses/site-{{ media_rotation_site_id }}/contents/inventories/{{ media_rotation_site_id }}"
  tasks:
    - name: Require explicit supported password rotation action
      ansible.builtin.assert:
        that:
          - media_rotation_mode in ['preflight', 'apply']
          - media_rotation_site_id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
        fail_msg: MEDIA31_MODE_OR_SITE_INVALID

    - name: Read owner declaration from protected site inventory
      ansible.builtin.uri:
        url: "{{ media_rotation_repo }}/site.yml?ref=main"
        headers:
          Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
          Accept: application/vnd.github+json
        status_code: 200
        use_proxy: false
      register: media_rotation_site_api
      no_log: true

    - name: Read exact VM declaration from protected site inventory
      ansible.builtin.uri:
        url: "{{ media_rotation_repo }}/media_vm.yml?ref=main"
        headers:
          Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
          Accept: application/vnd.github+json
        status_code: 200
        use_proxy: false
      register: media_rotation_vm_api
      no_log: true

    - name: Decode owner and guest identity without disclosing private inventory
      ansible.builtin.set_fact:
        media_site: "{{ (media_rotation_site_api.json.content | b64decode | from_yaml).site }}"
        media_spec: "{{ (media_rotation_vm_api.json.content | b64decode | from_yaml).media_vm }}"
      no_log: true

    - name: Require exact managed media identity
      ansible.builtin.assert:
        that:
          - media_site.id == media_rotation_site_id
          - media_spec.name == 'mediaserver-' ~ media_site.owner_slug
          - media_spec.storage.pool_name == media_site.owner_slug ~ '-pool'
          - media_site.owner_slug is match('^[a-z][a-z0-9_]*$')
        fail_msg: MEDIA31_GUEST_IDENTITY_MISMATCH

    - name: Require already pinned guest SSH identity from task 30
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/media80_known_hosts
        follow: false
      register: media_rotation_known_hosts

    - name: Reject untrusted guest host-key registration
      ansible.builtin.assert:
        that:
          - media_rotation_known_hosts.stat.isreg | default(false)
          - media_rotation_known_hosts.stat.pw_name == 'semaphore'
          - media_rotation_known_hosts.stat.mode == '0600'
        fail_msg: MEDIA31_PINNED_MEDIA_GUEST_REQUIRED

    - name: Register only the trusted existing media guest
      ansible.builtin.add_host:
        name: media_rotation_guest
        groups: media31_guest
        ansible_host: "{{ media_spec.network.ipv4.split('/')[0] }}"
        ansible_connection: ssh
        ansible_user: debian
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/media80_known_hosts
        media_site: "{{ media_site }}"
        media_spec: "{{ media_spec }}"
        media_rotation_mode: "{{ media_rotation_mode }}"
      changed_when: false
      no_log: true

- name: "31 | Read-only credential preflight or controlled protected rotation"
  hosts: media31_guest
  gather_facts: false
  become: true
  tasks:
    - name: Run dedicated native media credential lifecycle
      ansible.builtin.include_tasks: ../tasks/media31-password-rotation.yml
