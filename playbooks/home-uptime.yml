---
- name: "36 | Identify HOME PVE for Uptime Kuma"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files: [/etc/digitalhouses/pve.yml]
  tasks:
    - name: Require HOME PVE identity
      ansible.builtin.assert:
        that: (pve.ipv4.split('.') | last | int) == 220
        fail_msg: HOME36_PVE_IDENTITY_MISMATCH

    - name: Register only existing HOME PVE
      ansible.builtin.add_host:
        name: home36_pve
        groups: home36_managed
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        home_lxc_id: "1237"
        home_lxc_hostname: "{{ 'uptime-' ~ (lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim) }}"
        home_lxc_ip: "{{ pve.ipv4.rsplit('.', 1)[0] ~ '.237' }}"
        home_lxc_cores: "1"
        home_lxc_memory: "1024"
        home_lxc_swap: "512"
        home_lxc_disk_gb: "12"
      changed_when: false

- name: "36 | Create HOME Uptime Kuma only when absent; preserve monitoring database"
  hosts: home36_managed
  gather_facts: false
  become: true
  tasks:
    - name: Ensure dedicated Uptime LXC
      ansible.builtin.include_tasks: ../tasks/home-lxc-ensure.yml

    - name: Inspect required native packages
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, dpkg-query, -W, "-f=${Status}", nodejs, npm, git, curl, iputils-ping]
      register: home36_deps
      changed_when: false
      failed_when: false

    - name: Refresh apt index when prerequisites are missing
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, apt-get, update]
      changed_when: true
      when: home36_deps.rc != 0

    - name: Install Node.js, npm, Git, curl and ping only when missing
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, apt-get, install, -y, nodejs, npm, git, curl, iputils-ping]
      changed_when: true
      when: home36_deps.rc != 0

    - name: Check existing Uptime Kuma source directory
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, test, -f, /opt/uptime-kuma/server/server.js]
      register: home36_source
      changed_when: false
      failed_when: false

    - name: Check dedicated Uptime account
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, getent, passwd, uptime-kuma]
      register: home36_account
      changed_when: false
      failed_when: false

    - name: Create dedicated Uptime account only when absent
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, useradd, --system, --user-group, --home-dir, /var/lib/uptime-kuma, --shell, /usr/sbin/nologin, uptime-kuma]
      changed_when: true
      when: home36_account.rc != 0

    - name: Check persistent Uptime data directory
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, test, -d, /var/lib/uptime-kuma]
      register: home36_data_dir
      changed_when: false
      failed_when: false

    - name: Create persistent Uptime data directory only when missing
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, install, -d, -o, uptime-kuma, -g, uptime-kuma, -m, "0750", /var/lib/uptime-kuma]
      changed_when: true
      when: home36_data_dir.rc != 0

    - name: Clone pinned official Uptime Kuma v2 source only if missing
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, git, clone, --depth, "1", --branch, "2.5.11", https://github.com/louislam/uptime-kuma.git, /opt/uptime-kuma]
      changed_when: true
      when: home36_source.rc != 0

    - name: Give the dedicated service account its application files
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, chown, -R, uptime-kuma:uptime-kuma, /opt/uptime-kuma]
      changed_when: true
      when: home36_source.rc != 0

    - name: Check official upstream setup completion
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, test, -f, /opt/uptime-kuma/.dh-setup-complete]
      register: home36_setup
      changed_when: false
      failed_when: false

    - name: Finish or retry upstream setup if interrupted
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, runuser, -u, uptime-kuma, --, sh, -c, "cd /opt/uptime-kuma && npm run setup"]
      changed_when: true
      when: home36_setup.rc != 0

    - name: Mark successfully completed upstream setup
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, touch, /opt/uptime-kuma/.dh-setup-complete]
      changed_when: true
      when: home36_setup.rc != 0

    - name: Automatically choose SQLite on first install without replacing an existing database
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ home_lxc_id }}"
          - --
          - sh
          - -c
          - >-
            set -eu;
            d=/var/lib/uptime-kuma/data;
            install -d -o uptime-kuma -g uptime-kuma -m 0750 "$d";
            if [ ! -e "$d/db-config.json" ] && [ ! -e "$d/kuma.db" ]; then
              printf '%s\n' '{"type":"sqlite"}' > "$d/db-config.json";
              chown uptime-kuma:uptime-kuma "$d/db-config.json";
              chmod 0600 "$d/db-config.json";
              echo SQLITE_CONFIG_CREATED;
            else
              echo SQLITE_CONFIG_PRESERVED;
            fi
      register: home36_sqlite_config
      changed_when: "'SQLITE_CONFIG_CREATED' in home36_sqlite_config.stdout"

    - name: Inspect existing native Uptime Kuma systemd unit
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, cat, /etc/systemd/system/uptime-kuma.service]
      register: home36_unit
      changed_when: false
      failed_when: false

    - name: Install native systemd unit if absent
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, sh, -c, "cat > /etc/systemd/system/uptime-kuma.service"]
        stdin: |
          [Unit]
          Description=Uptime Kuma HOME
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=uptime-kuma
          Group=uptime-kuma
          WorkingDirectory=/opt/uptime-kuma
          Environment=NODE_ENV=production
          Environment=DATA_DIR=/var/lib/uptime-kuma/data
          Environment=UPTIME_KUMA_HOST=0.0.0.0
          Environment=UPTIME_KUMA_PORT=3001
          ExecStart=/usr/bin/node /opt/uptime-kuma/server/server.js
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
      changed_when: true
      when: home36_unit.rc != 0

    - name: Reload systemd only when installing unit
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, systemctl, daemon-reload]
      changed_when: true
      when: home36_unit.rc != 0

    - name: Inspect Uptime Kuma service state
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, systemctl, is-active, uptime-kuma]
      register: home36_active
      changed_when: false
      failed_when: false

    - name: Read Uptime startup policy
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, systemctl, is-enabled, uptime-kuma]
      register: home36_enabled
      changed_when: false
      failed_when: false

    - name: Start and enable Uptime Kuma when needed
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, systemctl, enable, --now, uptime-kuma]
      changed_when: true
      when: home36_active.stdout | trim != 'active' or home36_enabled.stdout | trim != 'enabled'

    - name: Verify local authenticated-ready Uptime Kuma web server
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, curl, -s, -o, /dev/null, -w, "%{http_code}", http://127.0.0.1:3001/]
      register: home36_http
      changed_when: false
      until: home36_http.rc == 0 and home36_http.stdout in ['200', '302']
      retries: 12
      delay: 5

    - name: Verify guest-side Socket.IO client and stdin execution path
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, bash, -lc, "cd /opt/uptime-kuma && node -"]
        stdin: "console.log(require('socket.io-client').io ? 'SOCKET_IO_READY' : 'MISSING')"
      register: home36_socket_client
      changed_when: false
      failed_when: home36_socket_client.rc != 0 or 'SOCKET_IO_READY' not in home36_socket_client.stdout

    - name: Enable ICMP ping for all users inside HOME Uptime LXC
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ home_lxc_id }}"
          - --
          - sh
          - -ec
          - |
            desired="0 65535"
            file=/etc/sysctl.d/90-dh-uptime-icmp.conf
            line="net.ipv4.ping_group_range = $desired"
            if [ ! -f "$file" ] || [ "$(cat "$file")" != "$line" ]; then
              printf '%s\n' "$line" > "$file"
              echo CONFIG_CHANGED
            fi
            if [ "$(awk '{print $1 " " $2}' /proc/sys/net/ipv4/ping_group_range)" != "$desired" ]; then
              printf '%s\n' "$desired" > /proc/sys/net/ipv4/ping_group_range
              echo RUNTIME_CHANGED
            fi
      register: home36_icmp_policy
      changed_when: "'CHANGED' in home36_icmp_policy.stdout"

    - name: Verify PVE ping as Uptime Kuma user
      ansible.builtin.command:
        argv: [pct, exec, "{{ home_lxc_id }}", --, runuser, -u, uptime-kuma, --, ping, -n, -c, "1", -W, "2", "{{ home_lxc_ip.rsplit('.', 1)[0] ~ '.220' }}"]
      changed_when: false

    - name: Pilot — create only HOME PVE monitor and optional Telegram via authenticated Socket.IO
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ home_lxc_id }}"
          - --
          - bash
          - -lc
          - "cd /opt/uptime-kuma && node -"
        stdin: |-
          const cfg = {{ {'username': DH_UPTIME_ADMIN_USERNAME, 'password': DH_UPTIME_ADMIN_PASSWORD, 'telegramBotToken': DH_UPTIME_TELEGRAM_BOT_TOKEN | default('', true), 'telegramChatID': DH_UPTIME_TELEGRAM_CHAT_ID | default('', true), 'pveIP': home_lxc_ip.rsplit('.', 1)[0] ~ '.220'} | to_json }};
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/home-uptime-socket-pilot.cjs') }}
      register: home36_socket_pilot
      failed_when: false
      changed_when: "'MONITOR=CREATED' in home36_socket_pilot.stdout or 'TELEGRAM=TESTED_AND_CREATED' in home36_socket_pilot.stdout"
      when:
        - DH_UPTIME_ADMIN_USERNAME | default('', true) | length > 0
        - DH_UPTIME_ADMIN_PASSWORD | default('', true) | length > 0
      no_log: true

    - name: Report pilot result without secrets
      ansible.builtin.debug:
        msg: "{{ home36_socket_pilot.stdout | trim }}"
      when: home36_socket_pilot is not skipped

    - name: Stop on unsuccessful Socket.IO pilot with a sanitized result
      ansible.builtin.fail:
        msg: "{{ home36_socket_pilot.stdout | default('HOME_KUMA_PILOT_NO_OUTPUT') | trim }}"
      when:
        - home36_socket_pilot is not skipped
        - home36_socket_pilot.rc != 0

    - name: Report server readiness without claiming monitors were provisioned
      ansible.builtin.debug:
        msg: "HOME36=SERVICE_READY http://{{ home_lxc_ip }}:3001; Socket.IO pilot runs only when admin credentials are set in task 05"
