---
# Manual Semaphore task 00: adds missing catalog templates without running them.
- name: Update the public Ansible-HOME task catalog
  hosts: runner
  gather_facts: false
  become: false
  vars:
    semaphore_api: http://127.0.0.1/api
    site_id: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    site_profile: >-
      {{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile', errors='ignore')
         | default('home', true) | trim }}
    catalog: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../catalog/tasks.yml') | from_yaml }}"
  tasks:
    - name: Load the catalog API token
      ansible.builtin.slurp:
        src: /etc/semaphore/catalog-token
      register: token_file
      no_log: true

    - name: Read visible Semaphore projects
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/projects"
        method: GET
        headers:
          Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: projects
      no_log: true

    - name: Identify exactly one site project
      ansible.builtin.set_fact:
        site_projects: "{{ projects.json | selectattr('name', 'equalto', site_id) | list }}"
      no_log: true

    - name: Require valid project and task catalog
      ansible.builtin.assert:
        that:
          - site_projects | length == 1
          - site_profile == 'home'
          - catalog.tasks is sequence
          - catalog.tasks | length > 0
        fail_msg: Invalid site project or task catalog

    - name: Read existing task templates
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ site_projects[0].id }}/templates"
        method: GET
        headers:
          Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: templates
      no_log: true

    - name: Locate the bootstrap template
      ansible.builtin.set_fact:
        bootstrap_templates: >-
          {{ templates.json |
             selectattr('name', 'equalto', '00-Обновить список задач') | list }}
      no_log: true

    - name: Verify the template to use as a reference
      ansible.builtin.assert:
        that:
          - bootstrap_templates | length == 1
          - bootstrap_templates[0].app == 'ansible'
          - bootstrap_templates[0].repository_id is number
          - bootstrap_templates[0].inventory_id is number
          - bootstrap_templates[0].environment_id is number
        fail_msg: Invalid task 00; catalog sync aborted

    - name: Refuse invalid names and conflicting existing playbooks
      ansible.builtin.assert:
        that:
          - >-
            (templates.json | selectattr('name', 'equalto', item.name) |
             selectattr('playbook', 'equalto', item.playbook) | list | length) ==
            (templates.json | selectattr('name', 'equalto', item.name) |
             list | length)
            or
            (item.name == '30-Медиасервер'
             and item.playbook == 'playbooks/media-server-deploy.yml'
             and (templates.json | selectattr('name', 'equalto', item.name)
                  | selectattr('playbook', 'equalto', 'playbooks/media-server.yml')
                  | list | length) == 1
             and (templates.json | selectattr('name', 'equalto', item.name)
                  | list | length) == 1)
          - item.name is match('^[0-9]{2,3}-')
          - item.playbook is match('^playbooks/[a-z0-9_-]+\.yml$')
        fail_msg: Invalid or conflicting task catalog entry
        quiet: true
      loop: "{{ catalog.tasks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create missing templates without deleting or running tasks
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ site_projects[0].id }}/templates"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
        body:
          name: "{{ item.name }}"
          project_id: "{{ site_projects[0].id }}"
          app: ansible
          description: "{{ item.description | default('Ansible-HOME task') }}"
          playbook: "{{ item.playbook }}"
          arguments: '[]'
          type: ''
          inventory_id: "{{ bootstrap_templates[0].inventory_id }}"
          repository_id: "{{ bootstrap_templates[0].repository_id }}"
          environment_id: "{{ bootstrap_templates[0].environment_id }}"
          allow_override_args_in_task: false
          autorun: false
          survey_vars: "{{ item.survey_vars | default([]) }}"
        use_proxy: false
        status_code: [200, 201]
      loop: "{{ catalog.tasks }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in (templates.json | map(attribute='name') | list)
      no_log: true

    - name: Reconcile descriptions and Survey fields of existing catalog templates
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ site_projects[0].id }}/templates/{{ current_template.id }}"
        method: PUT
        body_format: json
        headers:
          Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
        body:
          id: "{{ current_template.id }}"
          project_id: "{{ site_projects[0].id }}"
          name: "{{ current_template.name }}"
          app: "{{ current_template.app }}"
          description: "{{ item.description | default(current_template.description) }}"
          playbook: "{{ current_template.playbook }}"
          arguments: "{{ current_template.arguments }}"
          inventory_id: "{{ current_template.inventory_id }}"
          repository_id: "{{ current_template.repository_id }}"
          environment_id: "{{ current_template.environment_id }}"
          survey_vars: "{{ desired_survey }}"
        use_proxy: false
        status_code: [200, 204]
      vars:
        current_template: "{{ templates.json | selectattr('name', 'equalto', item.name) | first }}"
        current_survey: "{{ current_template.survey_vars | default([]) }}"
        desired_survey: "{{ item.survey_vars | default(current_survey) }}"
      loop: "{{ catalog.tasks }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in (templates.json | map(attribute='name') | list)
        - >-
            current_template.description !=
            (item.description | default(current_template.description)) or
            (current_survey | map(attribute='name') | list) !=
            (desired_survey | map(attribute='name') | list)
            or (current_survey | map(attribute='title') | list) !=
            (desired_survey | map(attribute='title') | list)
            or (current_survey | map(attribute='type', default='') | list) !=
            (desired_survey | map(attribute='type', default='') | list)
            or (current_survey | selectattr('type', 'defined') | selectattr('type', 'equalto', 'enum') | map(attribute='values') | list) !=
            (desired_survey | selectattr('type', 'defined') | selectattr('type', 'equalto', 'enum') | map(attribute='values') | list)
            or (current_survey | map(attribute='default_value', default='') | list) !=
            (desired_survey | map(attribute='default_value', default='') | list)
            or (current_survey | map(attribute='required', default=false) | list) !=
            (desired_survey | map(attribute='required', default=false) | list)
            or (current_survey | map(attribute='target', default='') | list) !=
            (desired_survey | map(attribute='target', default='') | list)
      no_log: true

    - name: "Verify ownership of existing task 30 before changing its entrypoint"
      ansible.builtin.assert:
        that:
          - current_template.app == 'ansible'
          - current_template.playbook in ['playbooks/media-server.yml', 'playbooks/media-server-deploy.yml']
          - current_template.repository_id == bootstrap_templates[0].repository_id
          - current_template.inventory_id == bootstrap_templates[0].inventory_id
          - current_template.environment_id == bootstrap_templates[0].environment_id
        fail_msg: MEDIA30_CATALOG_FOREIGN_TEMPLATE_REFUSED
      vars:
        current_template: "{{ templates.json | selectattr('name', 'equalto', item.name) | first }}"
      loop: "{{ catalog.tasks | selectattr('name', 'equalto', '30-Медиасервер') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in (templates.json | map(attribute='name') | list)
        - item.playbook == 'playbooks/media-server-deploy.yml'

    - name: "Repoint owned task 30 from audit to native deployment"
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/project/{{ site_projects[0].id }}/templates/{{ current_template.id }}"
        method: PUT
        body_format: json
        headers:
          Authorization: "Bearer {{ token_file.content | b64decode | trim }}"
        body:
          id: "{{ current_template.id }}"
          project_id: "{{ site_projects[0].id }}"
          name: "{{ current_template.name }}"
          app: "{{ current_template.app }}"
          description: "{{ item.description }}"
          playbook: "{{ item.playbook }}"
          arguments: "{{ current_template.arguments }}"
          inventory_id: "{{ current_template.inventory_id }}"
          repository_id: "{{ current_template.repository_id }}"
          environment_id: "{{ current_template.environment_id }}"
          survey_vars: "{{ item.survey_vars }}"
        use_proxy: false
        status_code: [200, 204]
      vars:
        current_template: "{{ templates.json | selectattr('name', 'equalto', item.name) | first }}"
      loop: "{{ catalog.tasks | selectattr('name', 'equalto', '30-Медиасервер') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in (templates.json | map(attribute='name') | list)
        - item.playbook == 'playbooks/media-server-deploy.yml'
        - current_template.playbook != item.playbook
      no_log: true

    - name: Report catalog sync
      ansible.builtin.debug:
        msg: >-
          Catalog checked for {{ site_id }}. Existing tasks kept;
          missing templates added; descriptions and Surveys reconciled; only the known #30
          audit-to-native entrypoint may be updated. Nothing executed or deleted.
